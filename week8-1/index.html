<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM 261 &middot; Week 8-1 &mdash; Science of Fandom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="fan-lab-theme">
/* ===== "Fan Lab" theme: stadium night + face-paint accents + lab-grid ===== */
:root{
  --bg:#0b0e1d; --bg2:#121632; --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.085);
  --line:rgba(255,255,255,.13); --ink:#f5f2ea; --muted:#a6abc6; --muted2:#7c82a3;
  --hot:#ff5b3a; --gold:#ffc53d; --cyan:#38c6ff; --lime:#a3e635; --violet:#b197fc;
  --st1:#38c6ff; --st2:#a3e635; --st3:#ffc53d; --st4:#ff5b3a;
  --font-display:'Anton',Impact,'Arial Narrow',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --fs-body:clamp(15px,min(1.5vw,2.7vh),29px);
  --fs-h:clamp(28px,min(3.3vw,6vh),64px);
  --z:1;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
body{
  background:
    radial-gradient(60vw 50vh at 8% -10%, rgba(120,170,255,.16), transparent 70%),
    radial-gradient(55vw 45vh at 95% -12%, rgba(255,140,90,.13), transparent 70%),
    radial-gradient(90vw 40vh at 50% 115%, rgba(56,198,255,.10), transparent 70%),
    var(--bg);
}
.bg-grid{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 85%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 85%);}
.bg-beam{position:fixed;top:-20vh;width:30vw;height:90vh;pointer-events:none;z-index:0;filter:blur(40px);opacity:.25;
  background:linear-gradient(180deg,rgba(255,255,255,.5),transparent);animation:beam 14s ease-in-out infinite alternate;}
.bg-beam.l{left:-6vw;transform:rotate(-18deg);} .bg-beam.r{right:-6vw;transform:rotate(18deg);animation-delay:-7s;}
@keyframes beam{from{opacity:.12}to{opacity:.28}}

/* chrome */
.chrome-top{position:fixed;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:linear-gradient(180deg,rgba(11,14,29,.95),rgba(11,14,29,.6));border-bottom:1px solid var(--line);font-size:13px;}
.brand{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;}
.brand b{color:var(--ink);}
.progress-track{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;min-width:60px;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold),var(--hot));transition:width .5s var(--ease);}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);white-space:nowrap;}
.counter{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;}
.textlink{background:none;border:1px solid var(--line);color:var(--ink);font:600 12px var(--font-body);padding:6px 11px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap;}
.textlink:hover{border-color:var(--gold);color:var(--gold);}
.zoom-controls{display:flex;gap:4px;}
.zoom-btn{background:none;border:1px solid var(--line);color:var(--ink);height:28px;min-width:28px;border-radius:7px;cursor:pointer;font:600 12px var(--font-mono);}
.zoom-btn:hover{border-color:var(--gold);}
.chrome-bottom{position:fixed;right:22px;bottom:18px;z-index:20;display:flex;gap:10px;}
.navbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(18,22,50,.8);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s;}
.navbtn svg{width:20px;height:20px;} .navbtn:hover{border-color:var(--gold);transform:translateY(-2px);}
.page-num{position:fixed;left:22px;bottom:24px;z-index:20;font-family:var(--font-mono);font-size:12px;color:var(--muted2);}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);background:rgba(18,22,50,.85);border:1px solid var(--line);padding:7px 14px;border-radius:999px;transition:opacity .6s;}
.hint.hide{opacity:0;pointer-events:none;}
.notes-panel{position:fixed;top:46px;right:0;bottom:0;width:min(420px,90vw);z-index:25;background:#141836;border-left:1px solid var(--line);padding:22px 24px;transform:translateX(100%);transition:transform .35s var(--ease);overflow:auto;}
.notes-panel.open{transform:none;}
.notes-panel h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 12px;}
.notes-panel p{font-size:15px;line-height:1.55;margin:0 0 10px;color:var(--ink);} .notes-empty{color:var(--muted)!important;}
.close-notes{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;}

/* ask */
.ask-btn{position:fixed;right:clamp(20px,4vw,48px);top:54px;z-index:21;height:34px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:rgba(18,22,50,.85);color:var(--ink);font:600 13px var(--font-body);cursor:pointer;transition:transform .2s,border-color .2s;}
.ask-btn:hover{border-color:var(--gold);transform:translateY(-2px);}
.ask-backdrop{position:fixed;inset:0;z-index:30;background:rgba(5,7,16,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);display:flex;align-items:center;justify-content:center;padding:24px;}
.ask-backdrop.open{opacity:1;pointer-events:auto;}
.ask-panel{width:min(480px,100%);background:#161a38;border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);}
.ask-title{font-family:var(--font-body);font-weight:700;font-size:19px;margin:0 0 4px;}
.ask-context{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--gold);margin:0 0 16px;}
.ask-panel textarea,.ask-panel input[type=text]{width:100%;background:#0e1129;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font:14px/1.5 var(--font-body);outline:none;}
.ask-panel textarea{min-height:96px;resize:vertical;} .ask-panel input[type=text]{margin-top:10px;}
.ask-panel textarea:focus,.ask-panel input:focus{border-color:var(--gold);}
.ask-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;}
.ask-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--muted2);}
.ask-actions{display:flex;gap:10px;}
.ask-btn-cancel,.ask-btn-send{font:600 13px var(--font-body);border-radius:7px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);}
.ask-btn-send{background:var(--hot);border-color:var(--hot);color:#fff;} .ask-btn-send:disabled{opacity:.5;}
.ask-status{font-family:var(--font-mono);font-size:12px;margin-top:12px;min-height:16px;}
.ask-status.err{color:#ff8a7a;} .ask-status.ok{color:var(--lime);}

/* deck + slides */
.deck{position:fixed;inset:0;z-index:1;}
.slide{position:absolute;inset:0;padding:100px clamp(28px,5.5vw,104px) 86px;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s;}
.slide.active{opacity:1;visibility:visible;transition:opacity .5s var(--ease);}
.slide-inner{position:relative;height:100%;width:100%;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;zoom:var(--z);}
.slide.active .slide-inner > *{animation:rise .7s var(--ease) both;}
.slide.active .slide-inner > *:nth-child(2){animation-delay:.08s}
.slide.active .slide-inner > *:nth-child(3){animation-delay:.16s}
.slide.active .slide-inner > *:nth-child(4){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.step{opacity:0;transform:translateY(16px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
.step.on{opacity:1;transform:none;}
line.step{transform:none;transition:opacity .45s var(--ease);}

.sh{flex:none;margin:0 0 clamp(12px,2.6vh,30px);}
.kick{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-family:var(--font-mono);font-size:clamp(11px,1.6vh,14px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.kick .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);}
.k-cb{--c:var(--cyan)} .k-ti{--c:var(--hot)} .k-fs{--c:var(--gold)}
.sh h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:var(--fs-h);line-height:1.04;letter-spacing:.01em;text-transform:uppercase;}
.sh h2::after{content:"";display:block;width:72px;height:4px;margin-top:clamp(8px,1.4vh,14px);border-radius:4px;background:linear-gradient(90deg,var(--hot),var(--gold));}
.cite-t{font-family:var(--font-body);font-weight:500;text-transform:none;font-size:.45em;color:var(--muted);letter-spacing:0;vertical-align:middle;}
p,li{font-size:var(--fs-body);line-height:1.42;}
cite{font-style:normal;font-family:var(--font-mono);font-size:.72em;letter-spacing:.04em;color:var(--gold);}
a.lnk{color:var(--cyan);font-family:var(--font-mono);font-size:clamp(13px,min(1.1vw,2vh),19px);word-break:break-all;}
img{max-width:100%;}
.slide img:not([data-nozoom]){cursor:zoom-in;}

.bl{list-style:none;margin:0 0 clamp(10px,2vh,22px);padding:0;display:flex;flex-direction:column;gap:clamp(6px,1.4vh,14px);}
.bl li{position:relative;padding-left:1.4em;margin:0;}
.bl li::before{content:"";position:absolute;left:0;top:.52em;width:.55em;height:.55em;border-radius:2px;background:var(--hot);transform:rotate(45deg);}
.bl.sub li::before{background:var(--gold);}
.chip{display:inline-flex;align-self:flex-start;margin:0 0 clamp(8px,1.6vh,16px);padding:6px 14px;border-radius:999px;border:1px solid rgba(255,197,61,.5);background:rgba(255,197,61,.1);color:var(--gold);font-family:var(--font-mono);font-size:clamp(12px,1.9vh,17px);letter-spacing:.05em;}

/* quote cards */
.qcard{position:relative;margin:0;padding:clamp(14px,2.6vh,28px) clamp(18px,2.2vw,36px) clamp(14px,2.4vh,26px) clamp(54px,4.6vw,84px);background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:16px;}
.qcard.alt{border-left-color:var(--violet);} .qcard.gold{border-left-color:var(--gold);}
.qcard p{margin:0 0 6px;font-size:clamp(16px,min(1.55vw,2.8vh),30px);}
.qmark{position:absolute;left:clamp(12px,1.2vw,22px);top:-.08em;font-family:var(--font-display);font-size:clamp(60px,10vh,110px);line-height:1;color:var(--cyan);opacity:.9;}
.qcard.alt .qmark{color:var(--violet);} .qcard.gold .qmark{color:var(--gold);}

/* youtube link cards */
.yt{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;transition:border-color .2s,transform .2s;}
.yt:hover{border-color:var(--hot);transform:translateY(-2px);}
.yt-img{position:relative;flex:none;width:clamp(150px,min(17vw,24vh),300px);aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:#000;}
.yt-img img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;}
.yt-play{position:absolute;left:50%;top:50%;width:54px;height:38px;transform:translate(-50%,-50%);border-radius:11px;background:#ff0033;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.yt-play::after{content:"";position:absolute;left:21px;top:11px;border-left:16px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;}
.yt-url{font-family:var(--font-mono);font-size:clamp(12px,min(1.05vw,1.9vh),18px);color:var(--cyan);word-break:break-all;}

/* ===== slide 1 ===== */
.s-title .slide-inner{justify-content:center;}
.t-wrap{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(24px,4vw,72px);align-items:center;height:100%;}
.t-kick{font-family:var(--font-mono);font-size:clamp(12px,1.9vh,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 18px;}
.s-title h1{margin:0;font-weight:400;}
.t-big{display:block;font-family:var(--font-display);text-transform:uppercase;font-size:clamp(48px,min(7.2vw,13vh),150px);line-height:.95;
  background:linear-gradient(100deg,#fff 0%,#ffe2a3 45%,var(--hot) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.t-sub{display:block;margin-top:clamp(10px,2vh,22px);font-family:var(--font-body);font-weight:600;font-size:clamp(20px,min(2.3vw,4vh),44px);line-height:1.15;color:var(--ink);}
.t-course{margin:clamp(16px,3.4vh,40px) 0 0;padding-top:16px;border-top:1px solid var(--line);font-family:var(--font-mono);font-size:clamp(13px,2vh,18px);letter-spacing:.06em;color:var(--muted);}
.t-photo{margin:0;position:relative;}
.t-photo::before{content:"";position:absolute;inset:6% 0 0 6%;border-radius:22px;background:linear-gradient(135deg,var(--cyan),var(--hot));opacity:.5;filter:blur(28px);}
.t-photo img{position:relative;display:block;width:100%;max-height:calc(100vh - 260px);object-fit:cover;border-radius:18px;box-shadow:0 30px 70px -20px rgba(0,0,0,.8);}

/* ===== slide 2 framework ===== */
.s2 .slide-inner{justify-content:flex-start;}
.fw{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(8px,1.4vw,22px);}
.fw-card{--c:var(--cyan);flex:1;max-width:400px;aspect-ratio:1/1.05;max-height:calc(100vh - 330px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vh,20px);
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%),var(--card);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:22px;color:var(--ink);cursor:pointer;padding:16px;transition:transform .25s var(--ease),box-shadow .25s;}
.fw-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px -20px var(--c);}
.fw-card.c-ti{--c:var(--hot)} .fw-card.c-fs{--c:var(--gold)}
.fw-n{font-family:var(--font-display);font-size:clamp(30px,6vh,64px);color:var(--c);line-height:1;}
.fw-ic{width:clamp(48px,10vh,104px);height:auto;fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.fw-t{font-family:var(--font-body);font-weight:700;font-size:clamp(18px,min(1.9vw,3.4vh),34px);text-align:center;line-height:1.2;}
.fw-arrow{flex:none;width:clamp(26px,3.4vw,60px);height:4px;background:linear-gradient(90deg,var(--line),var(--muted));position:relative;border-radius:2px;}
.fw-arrow::after{content:"";position:absolute;right:-2px;top:-6px;border-left:12px solid var(--muted);border-top:8px solid transparent;border-bottom:8px solid transparent;}

/* ===== slide 3 ===== */
.defs{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.8vh,18px);}
.lead{margin:0;padding-left:6px;color:var(--muted);font-style:italic;}

/* ===== slide 4 ===== */
.sd{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(20px,4vw,70px);align-items:center;min-height:0;}
.sd-left{display:flex;flex-direction:column;gap:clamp(14px,3vh,34px);}
.sd-box{padding:clamp(16px,3vh,32px) clamp(18px,2.2vw,36px);border-radius:18px;background:linear-gradient(135deg,rgba(56,198,255,.16),rgba(56,198,255,.04));border:1px solid rgba(56,198,255,.45);}
.sd-box.b2{background:linear-gradient(135deg,rgba(255,91,58,.18),rgba(255,91,58,.04));border-color:rgba(255,91,58,.5);}
.sd-q{margin:0;font-family:var(--font-display);text-transform:uppercase;font-size:clamp(26px,min(3vw,5.6vh),58px);line-height:1.05;}
.sd-box cite{display:block;margin-top:10px;font-size:clamp(13px,2vh,18px);}
.sd-right{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;height:100%;}
.sd-right img{display:block;height:calc(100vh - 400px);max-width:100%;width:auto;object-fit:contain;border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.8);}
.bubble{position:relative;margin-bottom:22px;padding:14px 26px;border-radius:18px;background:#fff;color:#111;font-family:var(--font-display);text-transform:uppercase;font-size:clamp(22px,min(2.4vw,4.4vh),44px);transform:rotate(-3deg);}
.bubble::after{content:"";position:absolute;left:46%;bottom:-16px;border-top:18px solid #fff;border-left:12px solid transparent;border-right:12px solid transparent;}

/* ===== slide 5 ===== */
.fx{flex:1;display:grid;grid-template-columns:.9fr 1.2fr;gap:clamp(20px,4vw,64px);align-items:center;min-height:0;}
.fx-q{margin:0;font-family:var(--font-display);text-transform:uppercase;font-size:clamp(28px,min(3.2vw,6vh),62px);line-height:1.08;color:var(--ink);}
.fx-dia{height:100%;min-height:0;display:flex;align-items:center;justify-content:center;}
.fx-dia svg{width:100%;max-height:calc(100vh - 290px);}
.fx-core{fill:url(#none);fill:rgba(56,198,255,.16);stroke:var(--cyan);stroke-width:3;}
.fx-ct{fill:#fff;font:700 27px var(--font-body);text-anchor:middle;}
.fx-node rect{fill:#1a1f45;stroke:rgba(255,255,255,.35);stroke-width:2;}
.fx-node text{fill:#fff;font:700 27px var(--font-body);text-anchor:middle;}

/* ===== slide 6 ===== */
.s6 .yt-img{width:clamp(180px,min(22vw,26vh),380px);}
.wc{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(20px,3.4vw,60px);align-items:center;min-height:0;}
.wc-vids{display:flex;flex-direction:column;gap:clamp(12px,2.4vh,24px);}
.wc-photo{margin:0;} .wc-photo img{display:block;width:100%;max-height:calc(100vh - 320px);object-fit:contain;border-radius:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.8);}

/* ===== slide 7 ===== */
.s7 .bl{margin-top:auto;} .s7 .fd-out{margin-bottom:auto;}
.fd-box{position:relative;padding:clamp(12px,2.2vh,24px) clamp(18px,2vw,32px);border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--hot);}
.fd-box p{margin:0 0 4px;} .fd-box cite{display:block;text-align:right;margin-top:6px;font-size:clamp(13px,2vh,18px);}
.fd-out{display:flex;align-items:center;gap:clamp(14px,2vw,30px);margin-top:clamp(12px,2.6vh,28px);}
.fd-arrow{flex:none;width:clamp(90px,10vw,170px);height:clamp(30px,5vh,46px);background:var(--hot);clip-path:polygon(0 30%,70% 30%,70% 0,100% 50%,70% 100%,70% 70%,0 70%);}
.fd-ch{margin:0;padding:clamp(10px,1.8vh,18px) clamp(16px,2vw,30px);border-radius:14px;border:2px solid var(--gold);color:var(--gold);font-weight:700;}

/* ===== slide 8 ===== */
.scd{flex:1;display:grid;grid-template-columns:minmax(220px,.55fr) 1.6fr;gap:clamp(18px,3vw,50px);align-items:center;min-height:0;}
.scd-ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(12px,2.4vh,24px);}
.scd-ex li{margin:0;padding:clamp(12px,2.2vh,22px) 20px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:clamp(18px,min(1.8vw,3.2vh),32px);}
.scd-ex li span{font-family:var(--font-mono);color:var(--cyan);font-weight:500;margin-right:6px;}
.scd-vid{min-width:0;} .vbox{position:relative;width:100%;max-width:calc((100vh - 335px)*1.7778);margin:0 auto;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 24px 60px -20px rgba(0,0,0,.8);}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vlink{margin:10px 0 0;text-align:center;font-size:13px;} .vlink a{color:var(--cyan);font-family:var(--font-mono);word-break:break-all;}

/* ===== slide 9 ===== */

<script type="application/json" id="slide-data">[{"title": "Science of Fandom: A Framework of Sport Consumerism", "cls": "s-title", "html": "\n<div class=\"t-wrap\">\n  <div class=\"t-copy\">\n    <p class=\"t-kick\">SPM 261 · Week 8-1<\/p>\n    <h1><span class=\"t-big\">Science of Fandom:<\/span><span class=\"t-sub\">A Framework of Sport Consumerism<\/span><\/h1>\n    <p class=\"t-course\">SPM261 Introduction to Sport Management<\/p>\n  <\/div>\n  <figure class=\"t-photo\"><img src=\"assets/p01-fans.jpg\" alt=\"Painted fans cheering in the student section\"><\/figure>\n<\/div>", "sec": "", "notes": ""}, {"title": "A Framework of Sport Consumerism", "cls": "s2", "html": "<header class=\"sh\"><h2>A Framework of Sport Consumerism<\/h2><\/header>\n<div class=\"fw\">\n  <button type=\"button\" class=\"fw-card c-cb\" data-go=\"3\"><span class=\"fw-n\">(1)<\/span><svg class=\"fw-ic\" viewBox=\"0 0 48 48\"><path d=\"M24 6c-8 0-14 6-14 13 0 5 3 8 5 10v7h18v-7c2-2 5-5 5-10 0-7-6-13-14-13z\"/><path d=\"M18 42h12M21 20h6M24 17v6\"/><\/svg><span class=\"fw-t\">Consumer Behavior<\/span><\/button>\n  <span class=\"fw-arrow\"><\/span>\n  <button type=\"button\" class=\"fw-card c-ti\" data-go=\"9\"><span class=\"fw-n\">(2)<\/span><svg class=\"fw-ic\" viewBox=\"0 0 48 48\"><path d=\"M16 6l-10 6 4 9 4-2v23h20V19l4 2 4-9-10-6c-1 3-4 5-8 5s-7-2-8-5z\"/><\/svg><span class=\"fw-t\">Team Identification<\/span><\/button>\n  <span class=\"fw-arrow\"><\/span>\n  <button type=\"button\" class=\"fw-card c-fs\" data-go=\"14\"><span class=\"fw-n\">(3)<\/span><svg class=\"fw-ic\" viewBox=\"0 0 48 48\"><circle cx=\"16\" cy=\"15\" r=\"6\"/><circle cx=\"33\" cy=\"17\" r=\"5\"/><path d=\"M5 40c0-7 5-12 11-12s11 5 11 12M26 40c0-6 3-10 7-10s9 4 9 10\"/><\/svg><span class=\"fw-t\">Fan socialization<\/span><\/button>\n<\/div>", "sec": "", "notes": ""}, {"title": "Consumer Behavior", "sec": "Consumer Behavior", "cls": "s3", "notes": "Before getting into the fan socialization, have you thought about the definition of consumer behavior?\nAMA-> general definition\nTextbook definition more specific!\nSo what do the definitions really mean?\nWhat is consumer behavior?", "html": "<header class=\"sh\"><p class=\"kick k-cb\"><span class=\"dot\"><\/span>Consumer Behavior<\/p><h2>Consumer Behavior<\/h2><\/header>\n<div class=\"defs\">\n  <blockquote class=\"qcard step\" data-step=\"1\"><span class=\"qmark\">“<\/span><p>The dynamic interaction of affect and cognition, behavior, and the environment by which human beings conduct the exchange aspects of their lives”<\/p><cite>(American Marketing Association, 2008).<\/cite><\/blockquote>\n  <p class=\"lead step\" data-step=\"2\">A textbook definition of consumer behavior is generally,<\/p>\n  <blockquote class=\"qcard alt step\" data-step=\"3\"><span class=\"qmark\">“<\/span><p>The study of individuals, groups, or organizations and the processes they use to select, secure, use, and dispose of products, services, experiences, or idea to satisfy needs and the impacts that these processes have on the consumer and society”<\/p><cite>(Hawkins, Best, &amp; Coney, 2004, p. 7).<\/cite><\/blockquote>\n<\/div>"}, {"title": "Simple Definition of Consumer Behavior", "sec": "Consumer Behavior", "cls": "s4", "notes": "The study of consumer behavior is essentially an attempt to understand what influences a person’s decision to consume a product.\nThe sport industry consists of three major elements:", "html": "<header class=\"sh\"><p class=\"kick k-cb\"><span class=\"dot\"><\/span>Consumer Behavior<\/p><h2>Simple Definition of Consumer Behavior<\/h2><\/header>\n<div class=\"sd\">\n  <div class=\"sd-left\">\n    <div class=\"sd-box step\" data-step=\"1\"><p class=\"sd-q\">“The study of why people buy.”<\/p><cite>(Trail &amp; James, 2013, p.38)<\/cite><\/div>\n    <div class=\"sd-box b2 step\" data-step=\"2\"><p class=\"sd-q\">Decision making process<\/p><\/div>\n  <\/div>\n  <div class=\"sd-right\">\n    <div class=\"bubble\">Are you kidding?<\/div>\n    <img src=\"assets/p04-kid.jpg\" alt=\"Child screaming\">\n  <\/div>\n<\/div>"}, {"title": "Factors Affecting Sport Consumption", "sec": "Consumer Behavior", "cls": "s5", "html": "<header class=\"sh\"><p class=\"kick k-cb\"><span class=\"dot\"><\/span>Consumer Behavior<\/p><h2>Factors Affecting Sport Consumption<\/h2><\/header>\n<div class=\"fx\">\n  <p class=\"fx-q step\" data-step=\"1\">Think about what other factors influence your sport consumption?????<\/p>\n  <div class=\"fx-dia step\" data-step=\"2\">\n    <svg viewBox=\"0 0 640 470\" role=\"img\" aria-label=\"Thoughts, Feelings and Other people point to Sport Consumption\">\n      <defs><marker id=\"fxa\" viewBox=\"0 0 10 10\" refX=\"7\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#38c6ff\"/><\/marker><\/defs>\n      <g class=\"fx-arrows\" stroke=\"#38c6ff\" stroke-width=\"12\" stroke-linecap=\"round\" fill=\"none\" marker-end=\"url(#fxa)\">\n        <path d=\"M170 228 L248 282\"/><path d=\"M320 152 L320 232\"/><path d=\"M470 228 L392 282\"/>\n      <\/g>\n      <circle cx=\"320\" cy=\"345\" r=\"114\" class=\"fx-core\"/>\n      <text x=\"320\" y=\"335\" class=\"fx-ct\">Sport<\/text><text x=\"320\" y=\"372\" class=\"fx-ct\">Consumption<\/text>\n      <g class=\"fx-node\"><rect x=\"20\" y=\"118\" width=\"190\" height=\"110\" rx=\"18\"/><text x=\"115\" y=\"182\">Thoughts<\/text><\/g>\n      <g class=\"fx-node\"><rect x=\"225\" y=\"20\" width=\"190\" height=\"110\" rx=\"18\"/><text x=\"320\" y=\"84\">Feelings<\/text><\/g>\n      <g class=\"fx-node\"><rect x=\"430\" y=\"118\" width=\"190\" height=\"110\" rx=\"18\"/><text x=\"525\" y=\"182\">Other people<\/text><\/g>\n    <\/svg>\n  <\/div>\n<\/div>", "notes": ""}, {"title": "Who Are Sport Consumers?", "sec": "Consumer Behavior", "cls": "s6", "notes": "Also linked on this slide (link box click): http://www.youtube.com/watch?v=1AdNk3wpyWE", "html": "<header class=\"sh\"><p class=\"kick k-cb\"><span class=\"dot\"><\/span>Consumer Behavior<\/p><h2>Who Are Sport Consumers?<\/h2><\/header>\n<div class=\"wc\">\n  <div class=\"wc-vids\"><a class=\"yt\" href=\"https://www.youtube.com/watch?v=gzTGwR47PDU\" target=\"_blank\" rel=\"noopener\"><span class=\"yt-img\"><img src=\"https://i.ytimg.com/vi/gzTGwR47PDU/hqdefault.jpg\" alt=\"YouTube video thumbnail\" data-nozoom=\"1\"><span class=\"yt-play\"><\/span><\/span><span class=\"yt-url\">https://www.youtube.com/watch?v=gzTGwR47PDU<\/span><\/a><a class=\"yt\" href=\"http://www.youtube.com/watch?v=1q5V6DKH3bw\" target=\"_blank\" rel=\"noopener\"><span class=\"yt-img\"><img src=\"https://i.ytimg.com/vi/1q5V6DKH3bw/hqdefault.jpg\" alt=\"YouTube video thumbnail\" data-nozoom=\"1\"><span class=\"yt-play\"><\/span><\/span><span class=\"yt-url\">http://www.youtube.com/watch?v=1q5V6DKH3bw<\/span><\/a><\/div>\n  <figure class=\"wc-photo\"><img src=\"assets/p06-fans.jpg\" alt=\"Netherlands fans in costume\"><\/figure>\n<\/div>"}, {"title": "Fandom", "sec": "Consumer Behavior", "cls": "s7", "notes": "Psychographic methods. –one of the market segmentation methods;\nCan you think of other segmentation methods demographics, socio-economics, geographic region, behavioral style, benefit (why you buy it),", "html": "<header class=\"sh\"><p class=\"kick k-cb\"><span class=\"dot\"><\/span>Consumer Behavior<\/p><h2>Fandom<\/h2><\/header>\n<ul class=\"bl\">\n  <li>Sport consumers can be categorized by their level of fandom (i.e., the degree they are a fan or not).<\/li>\n  <li>It’s critical for managers to know whether someone is a fan of their team. Why?<\/li>\n<\/ul>\n<div class=\"fd-box step\" data-step=\"1\">\n  <p>Not all consumers are equally passionate.<\/p>\n  <p>Neither are they all resistant to change that threatens team values and practices.<\/p>\n  <p>Some attend games on a regular basis, while others attend only on special occasions.<\/p>\n  <cite>Stewart et al. (2003)<\/cite>\n<\/div>\n<div class=\"fd-out\"><span class=\"fd-arrow step\" data-step=\"2\"><\/span><p class=\"fd-ch step\" data-step=\"3\">Challenges of narrowing a set of homogeneous traits<\/p><\/div>"}, {"title": "Sport Consumer Data", "sec": "Consumer Behavior", "cls": "s8", "notes": "https://www.youtube.com/watch?v=8YD5HcnVYd4&t=10s", "html": "<header class=\"sh\"><p class=\"kick k-cb\"><span class=\"dot\"><\/span>Consumer Behavior<\/p><h2>Sport Consumer Data<\/h2><\/header>\n<div class=\"scd\">\n  <ul class=\"scd-ex\"><li><span>Ex)<\/span> Pittsburgh Penguins<\/li><li><span>Ex)<\/span> 49ers<\/li><\/ul>\n  <div class=\"scd-vid\"><div class=\"vbox\"><iframe src=\"https://www.youtube-nocookie.com/embed/8YD5HcnVYd4?start=10&amp;rel=0\" title=\"Sport consumer data video\" loading=\"lazy\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\"><\/iframe><\/div>\n  <p class=\"vlink\"><a href=\"https://www.youtube.com/watch?v=8YD5HcnVYd4&amp;t=10s\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=8YD5HcnVYd4&amp;t=10s<\/a><\/p><\/div>\n<\/div>"}, {"title": "Team Identification", "sec": "Team Identification", "cls": "s9", "notes": "Do you now how to measure one’s team identification?\n\nthe extent that a fan feels psychologically connected to a team", "html": "<header class=\"sh\"><p class=\"kick k-ti\"><span class=\"dot\"><\/span>Team Identification<\/p><h2>Team Identification<\/h2><\/header>\n<div class=\"tid-top\">\n  <p class=\"tid-def step\" data-step=\"1\">“The extent that a fan psychologically connected to a team” <cite>(Wann, 1997)<\/cite><\/p>\n  <p class=\"tid-sub step\" data-step=\"2\">Sense of belongingness to a team<\/p>\n<\/div>\n<div class=\"tid\">\n  <figure class=\"tid-photo\"><img src=\"assets/p09-fans.jpg\" alt=\"Australia fans in face paint\"><\/figure>\n  <div class=\"vcl step\" data-step=\"3\">\n    <div class=\"vcl-arc\"><\/div>\n    <div class=\"vcl-item\"><span class=\"vcl-dot\"><\/span><p>More like to attend games regardless of team performance<\/p><\/div>\n    <div class=\"vcl-item\"><span class=\"vcl-dot\"><\/span><p>Less complaint<\/p><\/div>\n    <div class=\"vcl-item\"><span class=\"vcl-dot\"><\/span><p>Higher purchase intentions toward the team sponsor’s products<\/p><\/div>\n  <\/div>\n<\/div>"}, {"title": "Team Identification cont.", "sec": "Team Identification", "cls": "s10", "html": "<header class=\"sh\"><p class=\"kick k-ti\"><span class=\"dot\"><\/span>Team Identification<\/p><h2>Team Identification cont.<\/h2><\/header>\n<div class=\"sp\">\n  <div class=\"sp-l\">\n    <div class=\"sp-src\"><img src=\"assets/p10-turnkey.png\" alt=\"Turnkey Intelligence logo\"><span>(SBJ, 2016)<\/span><\/div>\n    <p class=\"sp-q\">WHICH OF THE FOLLOWING IS AN OFFICIAL SPONSOR OF THE NBA?<\/p>\n    <table class=\"tb tb-ins\"><thead><tr><th><\/th><th colspan=\"3\" class=\"grp av\">AVID<\/th><th colspan=\"3\" class=\"grp ca\">CASUAL<\/th><\/tr>\n    <tr><th class=\"ins-h\">INSURANCE<\/th><th class=\"av\">2016<\/th><th class=\"av\">2015<\/th><th class=\"av\">2014<\/th><th class=\"ca\">2016<\/th><th class=\"ca\">2015<\/th><th class=\"ca\">2014<\/th><\/tr><\/thead><tbody><tr class=\"hi\"><th>State Farm*<\/th><td>28.0%<\/td><td>20.5%<\/td><td>22.4%<\/td><td>16.5%<\/td><td>17.4%<\/td><td>8.0%<\/td><\/tr><tr><th>Geico<\/th><td>15.5%<\/td><td>17.5%<\/td><td>13.9%<\/td><td>14.5%<\/td><td>12.9%<\/td><td>11.6%<\/td><\/tr><tr><th>Allstate<\/th><td>13.0%<\/td><td>12.0%<\/td><td>12.4%<\/td><td>10.5%<\/td><td>10.9%<\/td><td>9.5%<\/td><\/tr><tr><th>Progressive<\/th><td>6.5%<\/td><td>7.0%<\/td><td>6.0%<\/td><td>4.0%<\/td><td>6.0%<\/td><td>6.5%<\/td><\/tr><tr><th>I’m not sure<\/th><td>32.0%<\/td><td>31.5%<\/td><td>37.8%<\/td><td>47.0%<\/td><td>43.3%<\/td><td>56.3%<\/td><\/tr><\/tbody><\/table>\n  <\/div>\n  <div class=\"sp-r\">\n    <div class=\"sv\"><p class=\"sv-q\">Are you more or less likely to consciously support a company by purchasing its products/services if the company is an official sponsor of the NBA?<\/p><table class=\"tb\"><thead><tr><th><\/th><th colspan=\"3\" class=\"grp av\">AVID<\/th><th colspan=\"3\" class=\"grp ca\">CASUAL<\/th><\/tr><tr><th><\/th><th class=\"av\">2016<\/th><th class=\"av\">2015<\/th><th class=\"av\">2014<\/th><th class=\"ca\">2016<\/th><th class=\"ca\">2015<\/th><th class=\"ca\">2014<\/th><\/tr><\/thead><tbody><tr class=\"hi\"><th>More likely<\/th><td>62.0%<\/td><td>53.5%<\/td><td>53.8%<\/td><td>36.0%<\/td><td>36.9%<\/td><td>29.1%<\/td><\/tr><tr><th>Unaffected / less likely<\/th><td>38.0%<\/td><td>46.5%<\/td><td>46.3%<\/td><td>64.0%<\/td><td>63.2%<\/td><td>70.8%<\/td><\/tr><\/tbody><\/table><\/div>\n    <div class=\"sv\"><p class=\"sv-q\">Are you more or less likely to recommend a product/service to a friend or family member if that product/service is an official sponsor of the NBA?<\/p><table class=\"tb\"><thead><tr><th><\/th><th colspan=\"3\" class=\"grp av\">AVID<\/th><th colspan=\"3\" class=\"grp ca\">CASUAL<\/th><\/tr><tr><th><\/th><th class=\"av\">2016<\/th><th class=\"av\">2015<\/th><th class=\"av\">2014<\/th><th class=\"ca\">2016<\/th><th class=\"ca\">2015<\/th><th class=\"ca\">2014<\/th><\/tr><\/thead><tbody><tr class=\"hi\"><th>More likely<\/th><td>62.0%<\/td><td>52.0%<\/td><td>51.8%<\/td><td>36.5%<\/td><td>33.9%<\/td><td>26.6%<\/td><\/tr><tr><th>Unaffected / less likely<\/th><td>38.0%<\/td><td>48.0%<\/td><td>48.3%<\/td><td>63.5%<\/td><td>66.2%<\/td><td>73.4%<\/td><\/tr><\/tbody><\/table><\/div>\n  <\/div>\n<\/div>", "notes": ""}, {"title": "Team Identification cont.", "sec": "Team Identification", "cls": "s11", "html": "<header class=\"sh\"><p class=\"kick k-ti\"><span class=\"dot\"><\/span>Team Identification<\/p><h2>Team Identification cont.<\/h2><\/header>\n<div class=\"gap\">\n  <div class=\"gap-side\">\n    <p>The 2017 Women’s college basketball NCAA Championship game (Mississippi State vs. South Carolina) drew <b>3.8 million<\/b> viewers.<\/p>\n    <img src=\"assets/p11-ncaa.jpg\" alt=\"Mississippi State vs. South Carolina, 2017 NCAA final\">\n  <\/div>\n  <div class=\"gap-mid\">\n    <div class=\"gap-bars\"><div class=\"gb\"><span class=\"gb-v\">3.8M<\/span><span class=\"gb-bar\" style=\"--h:100%\"><\/span><span class=\"gb-l\">NCAA<\/span><\/div><div class=\"gb w\"><span class=\"gb-v\">528K<\/span><span class=\"gb-bar\" style=\"--h:13.9%\"><\/span><span class=\"gb-l\">WNBA<\/span><\/div><\/div>\n    <p class=\"gap-why\">Drastic Gap, Why?<\/p>\n  <\/div>\n  <div class=\"gap-side\">\n    <p>The fifth game of the 2016 WNBA Finals drew about <b>528,000<\/b> viewers.<\/p>\n    <img src=\"assets/p11-wnba.jpg\" alt=\"2016 WNBA Finals, Game 5\">\n  <\/div>\n<\/div>", "notes": ""}, {"title": "Team Identification cont.", "sec": "Team Identification", "cls": "s12", "html": "<header class=\"sh\"><p class=\"kick k-ti\"><span class=\"dot\"><\/span>Team Identification<\/p><h2>Team Identification cont.<\/h2><\/header>\n<div class=\"rg\">\n  <div class=\"rg-copy\">\n    <p class=\"rg-acr\">BIRGing<\/p>\n    <p class=\"rg-full\"><b>B<\/b>asking <b>i<\/b>n <b>R<\/b>eflected <b>G<\/b>lory<\/p>\n    <p class=\"rg-def\">People wear a team jersey or climb on a team’s bandwagon because they believe that associating with a winner makes them a winner (i.e., self-esteem).<\/p>\n    <div class=\"rg-links\"><a class=\"yt\" href=\"https://www.youtube.com/watch?v=-MXiQk2zc60\" target=\"_blank\" rel=\"noopener\"><span class=\"yt-img\"><img src=\"https://i.ytimg.com/vi/-MXiQk2zc60/hqdefault.jpg\" alt=\"YouTube video thumbnail\" data-nozoom=\"1\"><span class=\"yt-play\"><\/span><\/span><span class=\"yt-url\">https://www.youtube.com/watch?v=-MXiQk2zc60<\/span><\/a><\/div>\n  <\/div>\n  <figure class=\"rg-photo\"><img src=\"assets/p12-birg.jpg\" alt=\"Fan pointing to the stadium in team jersey\"><\/figure>\n<\/div>", "notes": ""}, {"title": "Team Identification cont.", "sec": "Team Identification", "cls": "s13", "html": "<header class=\"sh\"><p class=\"kick k-ti\"><span class=\"dot\"><\/span>Team Identification<\/p><h2>Team Identification cont.<\/h2><\/header>\n<div class=\"rg corf\">\n  <div class=\"rg-copy\">\n    <p class=\"rg-acr\">CORFing<\/p>\n    <p class=\"rg-full\"><b>C<\/b>utting <b>O<\/b>ff <b>R<\/b>eflected <b>F<\/b>ailure<\/p>\n    <p class=\"rg-def\">People distance themselves from a loser for fear that a connection would make them look like losers.<\/p>\n    <p class=\"rg-cubs\">Cubs fans…<\/p>\n    <div class=\"rg-links\"><a class=\"lnk\" href=\"http://espn.go.com/mlb/attendance\" target=\"_blank\" rel=\"noopener\">http://espn.go.com/mlb/attendance<\/a><a class=\"yt\" href=\"https://www.youtube.com/watch?v=CqeLZ7vVLYE\" target=\"_blank\" rel=\"noopener\"><span class=\"yt-img\"><img src=\"https://i.ytimg.com/vi/CqeLZ7vVLYE/hqdefault.jpg\" alt=\"YouTube video thumbnail\" data-nozoom=\"1\"><span class=\"yt-play\"><\/span><\/span><span class=\"yt-url\">https://www.youtube.com/watch?v=CqeLZ7vVLYE<\/span><\/a><\/div>\n  <\/div>\n  <figure class=\"rg-logo step\" data-step=\"1\"><img src=\"assets/p13-cubs.png\" alt=\"Chicago Cubs logo\"><\/figure>\n<\/div>", "notes": ""}, {"title": "Fan Socialization", "sec": "Fan Socialization", "cls": "s14", "notes": "Parents, siblings, friends, a local community, one’s school, even the media can influence our connection to teams or sports.\nThese individuals and groups are socializing agents that influence how we become a sports fan.\nThe idea of fan socialization is really an understanding of how and why an individual becomes a fan of a particular sports team.", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Fan Socialization<\/h2><\/header>\n<div class=\"fsx\">\n  <ul class=\"bl\">\n    <li>It’s important to spend some time discussing how people become fans in the first place.<\/li>\n    <li>Try and think back to when you first became a fan of a team, or even if you more recently became a fan of a team, what caused you to become a fan?<\/li>\n  <\/ul>\n  <figure class=\"fsx-photo\"><img src=\"assets/p14-kids.jpg\" alt=\"Two young Packers fans in the stands\"><\/figure>\n<\/div>"}, {"title": "Fan Socialization cont.", "sec": "Fan Socialization", "cls": "s15", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Fan Socialization cont.<\/h2><\/header>\n<div class=\"ho\">\n  <p class=\"ho-t\">Fan socialization Questions<\/p>\n  <div class=\"ho-badge\"><svg viewBox=\"0 0 48 48\"><path d=\"M12 4h18l10 10v30H12z\"/><path d=\"M30 4v10h10M18 24h16M18 31h16M18 38h10\"/><\/svg><span>See Handout<\/span><\/div>\n<\/div>", "notes": ""}, {"title": "Fan Socialization cont.", "sec": "Fan Socialization", "cls": "s16", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Fan Socialization cont.<\/h2><\/header>\n<p class=\"chip\">Kolbe and James (2000)<\/p>\n<blockquote class=\"qcard gold\"><span class=\"qmark\">“<\/span><p>Fan socialization involves learning and internalizing the attitudes, values, knowledge and behaviors that are associated with fans of a team. This process results in individual-level internalizations and an appreciation of the importance of being a fan of the team”<\/p><cite>(p. 3).<\/cite><\/blockquote>\n<div class=\"qa step\" data-step=\"1\"><p class=\"qa-q\">When can you become a fan of a team?<\/p><p class=\"qa-a\">People can be socialized into being fans at any point during the life span.<\/p><\/div>", "notes": ""}, {"title": "Fan Socialization cont.", "sec": "Fan Socialization", "cls": "s17", "notes": "Let’s see what the empirical research really found about how an individual became a fan of his or her favorite team.\nIndividuals in their preteen and adolescent years maintained that fathers had the most influence.\nAmong the Brown fans, 38.8% reported “father” as one person most influential in them becoming a team fan.\n56% reported they had become true fans of the team prior to age 15, and most indicated becoming a fan between 6 and 15 years of age.", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Fan Socialization cont.<\/h2><\/header>\n<img class=\"helmet\" src=\"assets/p17-browns.png\" alt=\"Cleveland Browns helmet\">\n<p class=\"chip\">Kolbe and James (2000)<\/p>\n<ul class=\"bl sub\">\n  <li>Conducted interviews, focus groups, and a mail survey with fans of the Cleveland Browns.<\/li>\n  <li>Fans were asked to identify (1) “the one person who had the most influence on them becoming a Browns fan,” and (2) “how important various activities like attending games in person were to them becoming a fan.”<\/li>\n<\/ul>\n<div class=\"stats step\" data-step=\"1\">\n  <div class=\"stat\"><svg viewBox=\"0 0 42 42\"><circle cx=\"21\" cy=\"21\" r=\"15.9\" class=\"trk\"/><circle cx=\"21\" cy=\"21\" r=\"15.9\" class=\"val\" style=\"--p:38.8\"/><\/svg><div><p class=\"stat-n\">38.8%<\/p><p class=\"stat-t\">→ “Father”<\/p><\/div><\/div>\n  <div class=\"stat\"><svg viewBox=\"0 0 42 42\"><circle cx=\"21\" cy=\"21\" r=\"15.9\" class=\"trk\"/><circle cx=\"21\" cy=\"21\" r=\"15.9\" class=\"val\" style=\"--p:56\"/><\/svg><div><p class=\"stat-n\">56%<\/p><p class=\"stat-t\">→ Prior to age 15 and between 6 and 15 years of age.<\/p><\/div><\/div>\n<\/div>"}, {"title": "Fan Socialization cont.", "sec": "Fan Socialization", "cls": "s18", "notes": "Like the city and support the home team.", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Fan Socialization cont.<\/h2><\/header>\n<img class=\"helmet\" src=\"assets/p17-browns.png\" alt=\"Cleveland Browns helmet\">\n<p class=\"chip\">Kolbe and James (2000)<\/p>\n<ul class=\"bl sub\">\n  <li>Adult fans indicated that a distinct difference from the other groups in that players and coaches contributed most to their attachment with a professional football team.<\/li>\n  <li>Emotional connection between the city and the team.<\/li>\n<\/ul>\n<div class=\"disc\"><p>What are implications from this information?<\/p><p>Any practical implications for the sport managers?<\/p><\/div>"}, {"title": "Fan Socialization Across the Life Cycle", "sec": "Fan Socialization", "cls": "s19", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Fan Socialization Across the Life Cycle<\/h2><\/header>\n<div class=\"lc\">\n  <figure class=\"lc-img\"><img src=\"assets/p19-plc.png\" alt=\"Product Life Cycle Curve: introduction, growth, maturity, decline\"><\/figure>\n  <div class=\"lc-right\">\n    <ol class=\"stairs\"><li class=\"st1\">Childhood<\/li><li class=\"st2\">Adolescence (10s)<\/li><li class=\"st3\">Young Adult (20s)<\/li><li class=\"st4\">Older Adult (30s &amp; above)<\/li><\/ol>\n    <p class=\"lc-txt\">A lifecycle perspective is used to consider how the various agents may influence fan socialization, and to what extent specific agents may have more or less impact at different points in one’s life.<\/p>\n  <\/div>\n<\/div>", "notes": ""}, {"title": "Socializing Agents & Fan Cycle (James & Trail, 2015)", "sec": "Fan Socialization", "cls": "s20", "notes": "Childhood (birth-preadolescence\nAdolescence (10-18)\nYoung adult (college years – late 20s)\nOld adult (30 and above)", "html": "<header class=\"sh\"><p class=\"kick k-fs\"><span class=\"dot\"><\/span>Fan Socialization<\/p><h2>Socializing Agents &amp; Fan Cycle <span class=\"cite-t\">(James &amp; Trail, 2015)<\/span><\/h2><\/header><svg class=\"ag\" viewBox=\"120 205 1200 480\" role=\"img\" aria-label=\"Socializing agents and the fan life cycle\"><defs><marker id=\"ah-st1\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk-st1\"/><\/marker><marker id=\"ah-st2\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk-st2\"/><\/marker><marker id=\"ah-st3\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk-st3\"/><\/marker><marker id=\"ah-st4\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"4.2\" markerHeight=\"4.2\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" class=\"mk-st4\"/><\/marker><\/defs><circle cx=\"1074\" cy=\"443\" r=\"184\" class=\"ag-ring\"/><line x1=\"514\" y1=\"264\" x2=\"1168\" y2=\"343\" class=\"ar st1 step\" data-step=\"1\" marker-end=\"url(#ah-st1)\"/><line x1=\"514\" y1=\"279\" x2=\"1019\" y2=\"592\" class=\"ar st1 step\" data-step=\"2\" marker-end=\"url(#ah-st1)\"/><line x1=\"514\" y1=\"387\" x2=\"1169\" y2=\"522\" class=\"ar st2 step\" data-step=\"3\" marker-end=\"url(#ah-st2)\"/><line x1=\"514\" y1=\"368\" x2=\"1168\" y2=\"353\" class=\"ar st2 step\" data-step=\"4\" marker-end=\"url(#ah-st2)\"/><line x1=\"514\" y1=\"492\" x2=\"1014\" y2=\"284\" class=\"ar st3 step\" data-step=\"5\" marker-end=\"url(#ah-st3)\"/><line x1=\"514\" y1=\"524\" x2=\"850\" y2=\"533\" class=\"ar st3 step\" data-step=\"6\" marker-end=\"url(#ah-st3)\"/><line x1=\"514\" y1=\"613\" x2=\"851\" y2=\"548\" class=\"ar st4 step\" data-step=\"7\" marker-end=\"url(#ah-st4)\"/><line x1=\"514\" y1=\"637\" x2=\"1169\" y2=\"544\" class=\"ar st4 step\" data-step=\"8\" marker-end=\"url(#ah-st4)\"/><circle cx=\"1074\" cy=\"443\" r=\"84\" class=\"ag-fan\"/><text x=\"1074\" y=\"455\" class=\"ag-fant\">Fan<\/text><circle cx=\"1075\" cy=\"259\" r=\"59\" class=\"ag-n\"/><text x=\"1075\" y=\"266\" class=\"ag-t\">Geography<\/text><circle cx=\"1234\" cy=\"351\" r=\"59\" class=\"ag-n\"/><text x=\"1234\" y=\"358\" class=\"ag-t\">Family<\/text><circle cx=\"1234\" cy=\"535\" r=\"59\" class=\"ag-n\"/><text x=\"1234\" y=\"542\" class=\"ag-t small\">Friends/Peers<\/text><circle cx=\"1075\" cy=\"627\" r=\"59\" class=\"ag-n\"/><text x=\"1075\" y=\"634\" class=\"ag-t\">Sport<\/text><circle cx=\"916\" cy=\"535\" r=\"59\" class=\"ag-n\"/><text x=\"916\" y=\"542\" class=\"ag-t small\">Organization<\/text><circle cx=\"916\" cy=\"351\" r=\"59\" class=\"ag-n\"/><text x=\"916\" y=\"358\" class=\"ag-t\">Media<\/text><g class=\"stg st1\"><rect x=\"132\" y=\"230\" width=\"382\" height=\"83\" rx=\"14\"/><text x=\"323\" y=\"282\">Childhood<\/text><\/g><g class=\"stg st2\"><rect x=\"132\" y=\"345\" width=\"382\" height=\"83\" rx=\"14\"/><text x=\"323\" y=\"397\">Adolescence (10s)<\/text><\/g><g class=\"stg st3\"><rect x=\"132\" y=\"457\" width=\"382\" height=\"83\" rx=\"14\"/><text x=\"323\" y=\"509\">Young Adult (20s)<\/text><\/g><g class=\"stg st4\"><rect x=\"132\" y=\"570\" width=\"382\" height=\"83\" rx=\"14\"/><text x=\"323\" y=\"622\">Older Adult (30s &amp; above)<\/text><\/g><\/svg>"}, {"title": "Questions?", "cls": "s-close", "html": "<div class=\"cl\"><p class=\"cl-t\">Questions?<\/p><p class=\"cl-s\">SPM 261 · Science of Fandom<\/p><\/div>", "sec": "", "notes": ""}]</script>
<script>
(function(){
  const SLIDES = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  const els = SLIDES.map((s,i)=>{
    const sec = document.createElement('section');
    sec.className = 'slide ' + (s.cls||'');
    sec.dataset.index = i;
    sec.setAttribute('aria-label', s.title||'');
    sec.innerHTML = '<div class="slide-inner">' + s.html + '</div>';
    deck.appendChild(sec);
    return sec;
  });
  let current = 0, step = 0, notesOpen = false, zoom = 1;
  const stepsOf = el => Array.from(el.querySelectorAll('.step'));
  const maxStep = el => stepsOf(el).reduce((m,e)=>Math.max(m, +e.dataset.step||0), 0);
  function paint(){
    stepsOf(els[current]).forEach(e=>e.classList.toggle('on', (+e.dataset.step||0) <= step));
  }
  function activate(i, atEnd){
    i = Math.max(0, Math.min(SLIDES.length-1, i));
    els[current].classList.remove('active');
    current = i;
    els[i].classList.add('active');
    step = atEnd ? maxStep(els[i]) : 0;
    paint();
    const s = SLIDES[i];
    document.getElementById('progressFill').style.width = ((i+1)/SLIDES.length*100) + '%';
    document.getElementById('counter').textContent = String(i+1).padStart(2,'0') + ' / ' + SLIDES.length;
    document.getElementById('pageNum').textContent = (i+1) + ' / ' + SLIDES.length;
    document.getElementById('sectionLabel').textContent = s.sec || '';
    const nb = document.getElementById('notesBody');
    nb.innerHTML = '<h3>Speaker Notes</h3>' + (s.notes ? s.notes.split('\n').filter(x=>x.trim()).map(p=>'<p>'+p.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#38c6ff">$1</a>')+'</p>').join('') : '<p class="notes-empty">No speaker notes for this slide.</p>');
    history.replaceState(null, '', '#s' + (i+1));
  }
  function next(){ if(step < maxStep(els[current])){ step++; paint(); } else if(current < SLIDES.length-1) activate(current+1); }
  function prev(){ if(step > 0){ step--; paint(); } else if(current > 0) activate(current-1, true); }
  window.SB_revealAll = function(){ step = maxStep(els[current]); paint(); };
  window.SB_go = function(n){ activate(n-1); };

  document.getElementById('nextBtn').addEventListener('click', e=>{ e.stopPropagation(); next(); });
  document.getElementById('prevBtn').addEventListener('click', e=>{ e.stopPropagation(); prev(); });
  deck.addEventListener('click', e=>{
    if(e.target.closest('a,button,iframe,input,textarea,.zq-btn') ) return;
    if(e.target.tagName === 'IMG' && !e.target.dataset.nozoom) return;
    if(window.getSelection && String(window.getSelection()).length) return;
    next(); hideHint();
  });
  deck.addEventListener('click', e=>{
    const g = e.target.closest('[data-go]');
    if(g){ e.stopPropagation(); activate(+g.dataset.go - 1); }
  });
  let wheelLock = 0;
  window.addEventListener('wheel', e=>{
    if(document.getElementById('askBackdrop').classList.contains('open') || e.target.closest('.notes-panel')) return;
    const now = Date.now(); if(now - wheelLock < 650 || Math.abs(e.deltaY) < 18) return;
    wheelLock = now; e.deltaY > 0 ? next() : prev(); hideHint();
  }, {passive:true});
  document.addEventListener('keydown', e=>{
    if(e.target.closest && e.target.closest('input,textarea')) return;
    if(document.getElementById('askBackdrop').classList.contains('open')) return;
    const k = e.key;
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); next(); hideHint(); }
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
    else if(k==='Home') activate(0); else if(k==='End') activate(SLIDES.length-1);
    else if(k==='n'||k==='N') toggleNotes();
    else if(k==='+'||k==='=') zoomIn(); else if(k==='-'||k==='_') zoomOut(); else if(k==='0') zoomReset();
  });
  let tx = null;
  deck.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
  deck.addEventListener('touchend', e=>{ if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); } tx = null; });

  function applyZoom(){ document.documentElement.style.setProperty('--z', zoom); document.getElementById('zoomResetBtn').textContent = Math.round(zoom*100)+'%'; }
  function zoomIn(){ zoom = Math.min(1.6, +(zoom+0.1).toFixed(2)); applyZoom(); }
  function zoomOut(){ zoom = Math.max(0.6, +(zoom-0.1).toFixed(2)); applyZoom(); }
  function zoomReset(){ zoom = 1; applyZoom(); }
  document.getElementById('zoomInBtn').addEventListener('click', e=>{ e.stopPropagation(); zoomIn(); });
  document.getElementById('zoomOutBtn').addEventListener('click', e=>{ e.stopPropagation(); zoomOut(); });
  document.getElementById('zoomResetBtn').addEventListener('click', e=>{ e.stopPropagation(); zoomReset(); });
  applyZoom();

  const notesPanel = document.getElementById('notesPanel');
  function toggleNotes(){ notesOpen = !notesOpen; notesPanel.classList.toggle('open', notesOpen); }
  document.getElementById('notesToggle').addEventListener('click', toggleNotes);
  document.getElementById('closeNotes').addEventListener('click', toggleNotes);
  const hint = document.getElementById('hint');
  function hideHint(){ hint.classList.add('hide'); }
  setTimeout(hideHint, 5000);

  // ask a question / leave a comment
  (function(){
    const askBtn = document.getElementById('askBtn'), backdrop = document.getElementById('askBackdrop'),
      context = document.getElementById('askContext'), textEl = document.getElementById('askText'),
      nameEl = document.getElementById('askName'), sendBtn = document.getElementById('askSend'),
      cancelBtn = document.getElementById('askCancel'), statusEl = document.getElementById('askStatus');
    const DECK = 'SPM261 Week 8-1 — Science of Fandom';
    function open(){
      const slide = SLIDES[current] || {};
      context.textContent = 'Slide ' + (current+1) + ' of ' + SLIDES.length + ' — ' + (slide.title || '(untitled)');
      statusEl.textContent = ''; statusEl.className = 'ask-status';
      sendBtn.disabled = false; sendBtn.textContent = 'Send';
      backdrop.classList.add('open'); setTimeout(()=> textEl.focus(), 50);
    }
    function close(){ backdrop.classList.remove('open'); textEl.value=''; nameEl.value=''; }
    async function send(){
      const question = textEl.value.trim(), name = nameEl.value.trim();
      if(!name){ statusEl.textContent = 'Please enter your name.'; statusEl.className = 'ask-status err'; nameEl.focus(); return; }
      if(!question){ statusEl.textContent = 'Please enter a question or comment.'; statusEl.className = 'ask-status err'; textEl.focus(); return; }
      if(!window.QUESTIONS_API){ statusEl.textContent = "This form isn't connected yet — let your professor know."; statusEl.className = 'ask-status err'; return; }
      sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
      const slide = SLIDES[current] || {};
      try{
        await fetch(window.QUESTIONS_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({deck: DECK, slideIndex: current+1, slideTitle: slide.title || '', question: question, name: name})});
        statusEl.textContent = 'Sent — thanks!'; statusEl.className = 'ask-status ok'; setTimeout(close, 1100);
      }catch(err){
        statusEl.textContent = "Couldn't send — check your connection and try again."; statusEl.className = 'ask-status err';
        sendBtn.disabled = false; sendBtn.textContent = 'Send';
      }
    }
    askBtn.addEventListener('click', open); cancelBtn.addEventListener('click', close); sendBtn.addEventListener('click', send);
    backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });
    document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && backdrop.classList.contains('open')) close(); });
  })();

  let startIdx = 0;
  const m = location.hash.match(/s(\d+)/);
  if(m){ const n = parseInt(m[1],10)-1; if(n>=0 && n<SLIDES.length) startIdx = n; }
  els[0].classList.add('active');
  activate(startIdx);
})();
</script>
<script id="w81-zoomfloat-js">
(function(){
 var btn=document.createElement('button');btn.className='zq-btn';btn.type='button';btn.textContent='+';btn.title='Enlarge image';btn.setAttribute('aria-label','Enlarge image');
 var lb=document.createElement('div');lb.className='zq-lb';var li=document.createElement('img');li.alt='';lb.appendChild(li);
 document.body.appendChild(btn);document.body.appendChild(lb);
 var cur=null;
 function ok(im){return im&&im.tagName==='IMG'&&im.matches('#deck .slide.active img')&&!im.dataset.nozoom;}
 document.addEventListener('mouseover',function(e){var im=e.target;if(ok(im)){cur=im;var r=im.getBoundingClientRect();btn.style.left=(r.right-46)+'px';btn.style.top=(r.top+8)+'px';btn.style.display='flex';}else if(e.target!==btn){btn.style.display='none';}});
 function open(src){li.src=src;lb.classList.add('open');btn.style.display='none';}
 document.addEventListener('click',function(e){
  if(e.target===btn&&cur){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(cur.currentSrc||cur.src);return;}
  if(ok(e.target)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(e.target.currentSrc||e.target.src);return;}
  if(lb.classList.contains('open')&&lb.contains(e.target)){e.stopPropagation();e.stopImmediatePropagation();lb.classList.remove('open');}
 },true);
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('open')){lb.classList.remove('open');e.stopPropagation();}},true);
})();
</script>
