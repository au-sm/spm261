<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPM 261 &middot; Week 9-1 &mdash; Baseball Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style id="scorebook-theme">
/* ===== "Scorebook" theme: ballpark scorecard paper, navy ink, red stitching, outfield green ===== */
:root{
  --bg:#f6f2e8; --paper:#fffdf7; --card:#ffffff; --card2:#f1ece0;
  --line:rgba(19,41,75,.14); --ink:#13294b; --ink2:#2b3f63; --muted:#5e6b84; --muted2:#8a93a6;
  --red:#c8102e; --green:#1f7a4d; --gold:#c98a12; --sky:#2f6fb5; --clay:#b4532a;
  --font-display:'Oswald','Arial Narrow',Impact,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --fs-body:clamp(15px,min(1.45vw,2.65vh),28px);
  --fs-h:clamp(26px,min(3.1vw,5.6vh),60px);
  --shadow:0 18px 44px -22px rgba(19,41,75,.45);
  --z:1;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
.bg-paper{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(rgba(19,41,75,.045) 1px,transparent 1px) 0 0/100% 36px,
    radial-gradient(70vw 50vh at 100% 110%,rgba(31,122,77,.10),transparent 70%),
    radial-gradient(60vw 45vh at -5% -10%,rgba(200,16,46,.07),transparent 70%),
    var(--bg);}
.bg-paper::before{content:"";position:absolute;top:0;bottom:0;left:clamp(14px,2.2vw,40px);width:2px;background:rgba(200,16,46,.22);}

/* chrome */
.chrome-top{position:fixed;top:0;left:0;right:0;height:46px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 20px;
  background:var(--ink);color:#fff;font-size:13px;box-shadow:0 2px 0 var(--red);}
.brand{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:#b9c4da;white-space:nowrap;}
.brand b{color:#fff;}
.progress-track{flex:1;height:4px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden;min-width:60px;}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#fff,#ffb3bf,var(--red));transition:width .5s var(--ease);}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#ffd27a;white-space:nowrap;}
.counter{font-family:var(--font-mono);font-size:12px;color:#b9c4da;white-space:nowrap;}
.textlink{background:none;border:1px solid rgba(255,255,255,.28);color:#fff;font:600 12px var(--font-body);padding:6px 11px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap;}
.textlink:hover{border-color:#ffd27a;color:#ffd27a;}
.zoom-controls{display:flex;gap:4px;}
.zoom-btn{background:none;border:1px solid rgba(255,255,255,.28);color:#fff;height:28px;min-width:28px;border-radius:7px;cursor:pointer;font:600 12px var(--font-mono);}
.zoom-btn:hover{border-color:#ffd27a;}
.chrome-bottom{position:fixed;right:22px;bottom:18px;z-index:20;display:flex;gap:10px;}
.navbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s,border-color .2s;box-shadow:var(--shadow);}
.navbtn svg{width:20px;height:20px;} .navbtn:hover{border-color:var(--red);color:var(--red);transform:translateY(-2px);}
.page-num{position:fixed;left:22px;bottom:24px;z-index:20;font-family:var(--font-mono);font-size:12px;color:var(--muted2);}
.hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:20;font-family:var(--font-mono);font-size:11.5px;color:#fff;background:var(--ink);padding:7px 14px;border-radius:999px;transition:opacity .4s;white-space:nowrap;}
.hint.hide{opacity:0;pointer-events:none;}
.notes-panel{position:fixed;top:46px;right:0;bottom:0;width:min(420px,90vw);z-index:25;background:var(--paper);border-left:1px solid var(--line);padding:22px 24px;transform:translateX(100%);transition:transform .35s var(--ease);overflow:auto;box-shadow:-20px 0 50px -30px rgba(19,41,75,.5);}
.notes-panel.open{transform:none;}
.notes-panel h3{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 12px;}
.notes-panel p{font-size:15px;line-height:1.55;margin:0 0 10px;color:var(--ink);word-break:break-word;} .notes-empty{color:var(--muted)!important;}
.notes-panel a{color:var(--sky);}
.close-notes{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;}

/* ask */
.ask-btn{position:fixed;right:clamp(20px,4vw,48px);top:54px;z-index:21;height:34px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink);font:600 13px var(--font-body);cursor:pointer;box-shadow:var(--shadow);transition:transform .2s,border-color .2s;}
.ask-btn:hover{border-color:var(--red);transform:translateY(-2px);}
.ask-backdrop{position:fixed;inset:0;z-index:30;background:rgba(19,41,75,.35);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);display:flex;align-items:center;justify-content:center;padding:20px;}
.ask-backdrop.open{opacity:1;pointer-events:auto;}
.ask-panel{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;box-shadow:0 40px 90px -30px rgba(19,41,75,.6);}
.ask-title{font-family:var(--font-body);font-weight:700;font-size:19px;margin:0 0 4px;}
.ask-context{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--red);margin:0 0 16px;}
.ask-panel textarea,.ask-panel input[type=text]{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font:14px/1.5 var(--font-body);outline:none;}
.ask-panel textarea{min-height:96px;resize:vertical;} .ask-panel input[type=text]{margin-top:10px;}
.ask-panel textarea:focus,.ask-panel input:focus{border-color:var(--red);}
.ask-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;}
.ask-hint{font-family:var(--font-mono);font-size:10.5px;color:var(--muted2);}
.ask-actions{display:flex;gap:10px;}
.ask-btn-cancel,.ask-btn-send{font:600 13px var(--font-body);border-radius:7px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);}
.ask-btn-send{background:var(--red);border-color:var(--red);color:#fff;} .ask-btn-send:disabled{opacity:.5;}
.ask-status{font-family:var(--font-mono);font-size:12px;margin-top:12px;min-height:16px;}
.ask-status.err{color:var(--red);} .ask-status.ok{color:var(--green);}

/* deck + slides */
.deck{position:fixed;inset:0;z-index:1;}
.slide{position:absolute;inset:0;padding:100px clamp(34px,6vw,110px) 86px;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility 0s .5s;}
.slide.active{opacity:1;visibility:visible;transition:opacity .5s var(--ease);}
.slide-inner{position:relative;height:100%;width:100%;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;zoom:var(--z);}
.slide.active .slide-inner > *{animation:rise .7s var(--ease) both;}
.slide.active .slide-inner > *:nth-child(2){animation-delay:.08s}
.slide.active .slide-inner > *:nth-child(3){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.step{opacity:0;transform:translateY(14px);transition:opacity .55s var(--ease),transform .55s var(--ease);}
.step.on{opacity:1;transform:none;}

.sh{flex:none;margin:0 0 clamp(12px,2.6vh,30px);}
.kick{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-family:var(--font-mono);font-size:clamp(11px,1.6vh,14px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.kick .dot{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--c);box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--c);}
.k-sa{--c:var(--sky)} .k-py{--c:var(--red)} .k-ex{--c:var(--green)}
.sh h2{margin:0;font-family:var(--font-display);font-weight:600;font-size:var(--fs-h);line-height:1.08;letter-spacing:.005em;text-transform:uppercase;color:var(--ink);}
.sh h2::after{content:"";display:block;width:96px;height:6px;margin-top:clamp(8px,1.4vh,14px);
  background:repeating-linear-gradient(-55deg,var(--red) 0 4px,transparent 4px 9px);}
p,li{font-size:var(--fs-body);line-height:1.42;}
sup{font-size:.62em;line-height:0;vertical-align:super;}
a.lnk{color:var(--sky);font-family:var(--font-mono);font-size:clamp(12px,min(1.05vw,1.9vh),18px);word-break:break-all;}
a.lnk:hover{color:var(--red);}
.red{color:var(--red);} .blue{color:#00a0e0;}
img{max-width:100%;}
.slide img:not([data-nozoom]){cursor:zoom-in;}
.pic{display:block;border-radius:6px;background:#fff;padding:8px;box-shadow:var(--shadow);}

.bl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:clamp(6px,1.5vh,15px);}
.bl li{position:relative;padding-left:1.5em;margin:0;}
.bl li::before{content:"";position:absolute;left:0;top:.36em;width:.8em;height:.8em;border-radius:50%;background:#fff;border:2px solid var(--red);
  box-shadow:inset .18em 0 0 -.1em #fff,inset .26em 0 0 -.1em var(--red);}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .2em;font-family:'Cambria Math','STIX Two Math','Times New Roman',serif;font-style:normal;line-height:1.15;}
.fr-n,.fr-d{display:block;text-align:center;padding:0 .25em;white-space:nowrap;}
.fr-n{border-bottom:.08em solid currentColor;padding-bottom:.08em;}
.fr-d{padding-top:.08em;}
.fr i{font-style:italic;}
.fr.sm{font-size:.86em;}
.op{margin:0 .25em;font-family:'Cambria Math',serif;}

/* video */
.vid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
.vbox{position:relative;width:100%;max-width:calc((100vh - 250px)*1.7778);margin:0 auto;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 8px #fff,0 0 0 9px var(--line),var(--shadow);}
.vbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vlink{margin:18px 0 0;text-align:center;font-size:13px;} .vlink a{color:var(--sky);font-family:var(--font-mono);word-break:break-all;}

/* ===== slide 1 ===== */
.s-title .slide-inner{justify-content:center;}
.t-wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(24px,4vw,72px);align-items:center;height:100%;}
.t-kick{font-family:var(--font-mono);font-size:clamp(12px,1.9vh,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin:0 0 18px;}
.s-title h1{margin:0;font-weight:400;}
.t-big{display:block;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(48px,min(7.4vw,13vh),150px);line-height:.95;color:var(--ink);}
.t-sub{display:inline-block;margin-top:clamp(12px,2.2vh,24px);padding:.12em .5em;font-family:var(--font-display);font-weight:500;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(24px,min(3vw,5.2vh),58px);line-height:1.1;color:#fff;background:var(--red);transform:skewX(-6deg);}
.t-course{margin:clamp(18px,3.6vh,42px) 0 0;padding-top:16px;border-top:2px dashed var(--line);font-family:var(--font-mono);font-size:clamp(13px,2vh,18px);letter-spacing:.06em;color:var(--muted);}
.t-art{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;max-height:100%;}
.ball{width:min(100%,calc(100vh - 300px));height:auto;filter:drop-shadow(0 30px 40px rgba(19,41,75,.25));animation:spin 30s linear infinite;}
.ball-c{fill:#fff;stroke:#e3ddcf;stroke-width:3;}
.ball-s{fill:none;stroke:var(--red);stroke-width:3;}
.ball-st{fill:none;stroke:var(--red);stroke-width:12;stroke-dasharray:2 9;opacity:.85;}
@keyframes spin{to{transform:rotate(360deg)}}
.t-score{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 26px;background:var(--ink);color:#fff;border-radius:10px;font-family:var(--font-mono);font-weight:700;font-size:clamp(20px,3.6vh,40px);box-shadow:var(--shadow);}
.t-div{width:100%;height:3px;background:#ffd27a;}

/* ===== slide 2 collage ===== */
.mb{flex:1;min-height:0;display:grid;grid-template-columns:1fr .95fr 1.6fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(10px,1.4vw,22px);}
.mb figure{margin:0;min-height:0;position:relative;display:flex;}
.mb img{width:100%;height:100%;object-fit:cover;border-radius:6px;background:#fff;padding:6px;box-shadow:var(--shadow);}
.mb-a{grid-column:2;grid-row:1;} .mb-b{grid-column:1;grid-row:1;} .mb-c{grid-column:3/5;grid-row:1;}
.mb-d{grid-column:3;grid-row:2;} .mb-e{grid-column:4;grid-row:2;} .mb-f{grid-column:5;grid-row:1/3;}
.mb-c img{object-fit:cover;}
.person figcaption{position:absolute;left:12px;bottom:12px;padding:5px 12px;background:var(--ink);color:#fff;font-family:var(--font-display);font-weight:500;letter-spacing:.04em;text-transform:uppercase;font-size:clamp(13px,2.2vh,22px);border-left:4px solid var(--red);}
.mb-g{grid-column:1/3;grid-row:2;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:clamp(12px,2vh,24px);border:2px solid var(--ink);border-radius:8px;background:var(--paper);}
.saber{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(28px,min(3.4vw,6vh),64px);line-height:1;color:var(--red);}

/* ===== slide 5 ===== */
.sa{flex:1;min-height:0;display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(20px,3.6vw,64px);align-items:center;}
.sa-l{display:flex;flex-direction:column;gap:clamp(12px,2.6vh,28px);min-height:0;}
.sa-img{margin:0;} .sa-img img{display:block;width:100%;max-height:calc(100vh - 380px);object-fit:cover;border-radius:6px;background:#fff;padding:8px;box-shadow:var(--shadow);}
.sa-t{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,min(4.4vw,8vh),86px);line-height:1;}
.lineup{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;}
.lineup li{display:flex;align-items:center;gap:clamp(10px,1.2vw,20px);margin:0;padding:clamp(8px,1.7vh,18px) clamp(12px,1.4vw,22px);border-bottom:1px solid var(--line);font-weight:600;}
.lineup li:last-child{border-bottom:0;}
.lineup .n{flex:none;display:inline-flex;align-items:center;justify-content:center;width:2em;height:2em;border-radius:50%;background:var(--ink);color:#fff;font:700 .72em var(--font-mono);}
.lineup li:nth-child(odd){background:var(--paper);}

/* ===== slide 6 ===== */
.arc{flex:1;display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(16px,2.6vw,44px);align-items:center;}
.arc-card{display:flex;flex-direction:column;gap:clamp(10px,2vh,18px);padding:clamp(18px,3.4vh,40px) clamp(18px,2.4vw,40px);background:#fff;border-radius:10px;border-top:8px solid var(--red);box-shadow:var(--shadow);}
.arc-card.c2{border-top-color:var(--green);align-self:stretch;justify-content:center;}
.arc{align-items:stretch;margin:auto 0;flex:none;min-height:40vh;}
.arc-c{margin:0;font-family:var(--font-display);font-weight:600;text-transform:uppercase;font-size:clamp(24px,min(2.8vw,5vh),52px);line-height:1.05;}

/* ===== slide 7 ===== */
.sa2{flex:1;min-height:0;display:grid;grid-template-columns:2.4fr 1fr;gap:clamp(16px,2.4vw,40px);align-items:center;margin-top:clamp(10px,2vh,22px);}
.sa2-l{display:flex;flex-direction:column;gap:clamp(10px,2vh,22px);min-width:0;}
.sa2-p{margin:0;padding:clamp(10px,2vh,20px) clamp(14px,1.6vw,26px);background:#fff;border-left:6px solid var(--sky);border-radius:0 8px 8px 0;font-weight:500;box-shadow:var(--shadow);}
.s7 .vbox{max-width:calc((100vh - 500px)*1.7778);} .s7 .sa2-p{font-size:clamp(14px,min(1.3vw,2.4vh),25px);padding-top:clamp(8px,1.4vh,16px);padding-bottom:clamp(8px,1.4vh,16px);}
.s7 .vlink{margin-top:12px;}
.sa2-img{margin:0;display:flex;justify-content:center;} .sa2-img img{display:block;max-height:calc(100vh - 360px);width:auto;max-width:100%;object-fit:contain;border-radius:6px;background:#fff;padding:8px;box-shadow:var(--shadow);}

/* ===== slide 8 ===== */
.rd{flex:1;display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(20px,4vw,70px);align-items:center;}
.rd-k{margin:0 0 clamp(12px,2.6vh,28px);font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(34px,min(4.4vw,8vh),84px);line-height:1;}
.rd-ch{margin:0 0 clamp(14px,3vh,32px);display:flex;align-items:center;gap:16px;padding:clamp(12px,2.4vh,24px) clamp(16px,2vw,30px);background:#fff;border-radius:10px;border-left:8px solid var(--red);font-weight:700;font-size:clamp(18px,min(2vw,3.6vh),38px);box-shadow:var(--shadow);}
.rd-ch span{font-family:var(--font-mono);color:var(--red);}
.rd-dl{margin:0;color:var(--muted);font-weight:500;}
.rd-book{margin:0;display:flex;justify-content:center;} .rd-book img{display:block;height:calc(100vh - 300px);max-height:620px;width:auto;transform:rotate(3deg);box-shadow:0 30px 60px -20px rgba(19,41,75,.6);border-radius:3px;}

/* ===== slide 9 divider ===== */
.s-div{padding:0;} .s-div .slide-inner{max-width:none;justify-content:flex-end;}
.div-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none;}
.s-div .slide-inner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,41,75,.05) 30%,rgba(19,41,75,.92) 100%);}
.div-copy{position:relative;z-index:1;padding:0 clamp(34px,6vw,110px) clamp(70px,12vh,130px);}
.div-k{margin:0 0 10px;font-family:var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:#ffd27a;font-size:clamp(12px,2vh,17px);}
.div-t{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(40px,min(6vw,11vh),120px);line-height:.98;color:#fff;max-width:16ch;}

/* ===== slide 10 ===== */
.s-div2 .slide-inner{justify-content:center;}
.d2{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(20px,4vh,44px);}
.d2-board{display:grid;grid-template-columns:repeat(3,auto);gap:6px clamp(12px,1.6vw,26px);padding:clamp(14px,2.4vh,26px) clamp(20px,2.4vw,40px);background:var(--ink);border-radius:10px;box-shadow:var(--shadow);border-bottom:6px solid var(--green);}
.d2-lab{font-family:var(--font-mono);color:#b9c4da;font-size:clamp(12px,2vh,18px);letter-spacing:.14em;text-align:center;}
.d2-q{font-family:var(--font-mono);font-weight:700;color:#ffd27a;font-size:clamp(34px,7vh,76px);text-align:center;min-width:1.6em;animation:flick 1.8s steps(2) infinite;}
.d2-q:nth-of-type(5){animation-delay:.3s} .d2-q:nth-of-type(6){animation-delay:.6s}
@keyframes flick{50%{opacity:.45}}
.d2-t{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(40px,min(5.6vw,10vh),112px);line-height:1;max-width:18ch;}

/* ===== slide 11 ===== */
.py{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(18px,3vw,52px);align-items:center;}
.py .bl{gap:clamp(10px,2.4vh,26px);} .py .bl li{font-size:clamp(15px,min(1.45vw,2.7vh),28px);}
.py-r{display:flex;flex-direction:column;gap:clamp(10px,2.2vh,24px);}
.book{background:#fff;padding:clamp(12px,2.2vh,24px) clamp(16px,2vw,30px);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);font-family:Georgia,'Times New Roman',serif;}
.eq1{display:flex;align-items:center;gap:10px;font-size:clamp(15px,min(1.45vw,2.7vh),27px);}

.book-p{margin:clamp(6px,1.4vh,14px) 0 4px;font-size:clamp(14px,min(1.35vw,2.5vh),25px);}
.book-l{margin:0;padding-left:1.3em;} .book-l li{font-size:clamp(14px,min(1.35vw,2.5vh),25px);line-height:1.35;}
.mrow{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-weight:600;font-size:clamp(16px,min(1.6vw,3vh),31px);}
.mrow.big{font-size:clamp(20px,min(2.1vw,3.9vh),40px);}
.mrow.red{color:var(--red);}
.py .mrow.big{flex-wrap:nowrap;white-space:nowrap;font-size:clamp(16px,min(1.65vw,3.1vh),33px);}

/* ===== slide 12 ===== */
.why{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,2.4vh,26px);}
.why-q{margin:0;font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(30px,min(3.4vw,6vh),64px);line-height:1;color:var(--red);}
.why-p{margin:0;}
.why-eq{align-self:center;padding:clamp(12px,2.6vh,30px) clamp(24px,3.4vw,60px);background:#fff;border-radius:10px;box-shadow:var(--shadow);font-size:clamp(18px,min(2.2vw,3.5vh),44px);}
.why-eq .outer>.fr-n,.why-eq .outer>.fr-d{padding:.2em .4em;}
.why-eq .outer>.fr-n{border-bottom-width:.1em;}
.why-out{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.2vh,24px);} .why-out .mrow{font-size:clamp(18px,min(1.9vw,3.5vh),36px);} .why-out .mrow.big{font-size:clamp(22px,min(2.4vw,4.4vh),46px);}

/* ===== slide 13 ===== */
.ex{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(14px,2.2vw,36px);align-items:start;}

.calc li::before{content:counter(c);position:absolute;left:.6em;top:50%;transform:translateY(-50%);width:1.3em;height:1.3em;border-radius:50%;background:var(--red);color:#fff;font:700 .75em/1.3em var(--font-mono);text-align:center;}
.calc b{font-family:var(--font-mono);color:var(--red);}
.fig{margin:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;box-shadow:var(--shadow);max-height:100%;}
.fig-scroll{min-height:0;overflow:auto;}
.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:clamp(9px,min(.95vw,1.5vh),18px);}

.st tbody th{text-align:left;font-weight:600;}
.st tr.mad td{border:0;text-align:right;font-family:var(--font-mono);font-weight:700;color:var(--ink);}
.st tbody tr:hover td,.st tbody tr:hover th{background:#eef3fb;}
.st tr.hi td,.st tr.hi th{background:#fff1f3;outline:3px solid var(--red);outline-offset:-2px;font-weight:700;}
.st tr.hi{position:relative;}
.fig figcaption{margin-top:6px;font-family:Georgia,serif;font-size:clamp(11px,1.7vh,15px);color:var(--muted);text-align:center;}

\/figure>\n  <h2 class=\"sa-t\">What is sport analytics?<\/h2><\/div>\n  <ol class=\"lineup\"><li class=\"step\" data-step=\"1\"><span class=\"n\">01<\/span>Data<\/li><li class=\"step\" data-step=\"2\"><span class=\"n\">02<\/span>Analyzing skill<\/li><li class=\"step\" data-step=\"3\"><span class=\"n\">03<\/span>Data interpretation<\/li><li class=\"step\" data-step=\"4\"><span class=\"n\">04<\/span>Basic features of the data<\/li><li class=\"step\" data-step=\"5\"><span class=\"n\">05<\/span>Data visualization<\/li><li class=\"step\" data-step=\"6\"><span class=\"n\">06<\/span>Prediction-significance test<\/li><\/ol>\n<\/div>", "sec": "Sport Analytics", "notes": ""}, {"title": "What is sport analytics? cont.", "cls": "s7", "html": "<header class=\"sh\"><p class=\"kick k-sa\"><span class=\"dot\"><\/span>Sport Analytics<\/p><h2>What is sport analytics? cont.<\/h2><\/header>\n<p class=\"sa2-p\">Player/team performance, winning/ performance prediction, fan emotions/reactions (i.e., social media), economic impact, betting market, rule/ policy test, playoff team selection, etc.<\/p>\n<div class=\"sa2\">\n  <div class=\"sa2-l\">\n    <div class=\"vbox\"><iframe src=\"https://www.youtube-nocookie.com/embed/MpLHMKTolVw?rel=0\" title=\"Sport analytics video\" loading=\"lazy\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" allowfullscreen referrerpolicy=\"strict-origin-when-cross-origin\"><\/iframe><\/div><p class=\"vlink\"><a href=\"https://www.youtube.com/watch?v=MpLHMKTolVw\" target=\"_blank\" rel=\"noopener\">https://www.youtube.com/watch?v=MpLHMKTolVw<\/a><\/p>\n  <\/div>\n  <figure class=\"sa2-img\"><img src=\"assets/p07-curry-chart.png\" alt=\"Stephen Curry 2018-19 shot chart\"><\/figure>\n<\/div>", "sec": "Sport Analytics", "notes": "https://www.youtube.com/watch?v=MpLHMKTolVw"}, {"title": "Please read the book Mathletics", "cls": "s8", "html": "\n<div class=\"rd\">\n  <div class=\"rd-copy\">\n    <p class=\"rd-k\">Please read the book Mathletics:<\/p>\n    <p class=\"rd-ch\"><span>(a)<\/span> Ch.1 Baseball’s Pythagorean Theorem<\/p>\n    <p class=\"rd-dl\">You can download the book Mathletics on course website. See Module 9<\/p>\n  <\/div>\n  <figure class=\"rd-book\"><img src=\"assets/p08-mathletics.jpg\" alt=\"Mathletics by Wayne L. Winston, book cover\"><\/figure>\n<\/div>", "sec": "Mathletics Ch.1", "notes": ""}, {"title": "Baseball’s Pythagorean Theorem (Ch.1)", "cls": "s-div s9", "html": "\n<img class=\"div-bg\" src=\"assets/p09-astros.jpg\" alt=\"Houston Astros players celebrating on the field\" data-nozoom=\"1\">\n<div class=\"div-copy\"><p class=\"div-k\">Mathletics · Chapter 1<\/p><h2 class=\"div-t\">Baseball’s Pythagorean Theorem (Ch.1)<\/h2><\/div>", "sec": "Pythagorean Theorem", "notes": ""}, {"title": "Predicting a team’s winning percentage & # of games", "cls": "s-div2", "html": "\n<div class=\"d2\">\n  <div class=\"d2-board\"><span class=\"d2-lab\">W<\/span><span class=\"d2-lab\">L<\/span><span class=\"d2-lab\">PCT<\/span>\n    <span class=\"d2-q\">?<\/span><span class=\"d2-q\">?<\/span><span class=\"d2-q\">.???<\/span><\/div>\n  <h2 class=\"d2-t\">Predicting a team’s winning percentage &amp; # of games<\/h2>\n<\/div>", "sec": "Pythagorean Theorem", "notes": ""}, {"title": "Baseball’s Pythagorean Theorem (Ch.1) cont.", "cls": "s11", "html": "<header class=\"sh\"><p class=\"kick k-py\"><span class=\"dot\"><\/span>Pythagorean Theorem<\/p><h2>Baseball’s Pythagorean Theorem (Ch.1) cont.<\/h2><\/header>\n<div class=\"py\">\n  <ul class=\"bl\">\n    <li>The more runs a baseball team scores, the more games the team should win.<\/li>\n    <li>Bill James introduces a formula that measures percentage of games won by baseball team (p.3).<\/li>\n    <li>Pythagorean Theorem states that a triangle is a right triangle if and only if a<sup>2<\/sup>+b<sup>2<\/sup>=c<sup>2<\/sup>.<\/li>\n    <li>For example, a triangle with sides of lengths 3, 4, and 5 is right triangle because 3<sup>2<\/sup>+4<sup>2<\/sup>=5<sup>2<\/sup>.<\/li>\n  <\/ul>\n  <div class=\"py-r\">\n    <div class=\"book\">\n      <div class=\"eq1\"><span class=\"fr \"><span class=\"fr-n\">runs scored<sup>2<\/sup><\/span><span class=\"fr-d\">runs scored<sup>2<\/sup> + runs allowed<sup>2<\/sup><\/span><\/span><span class=\"eq-eq\">=<\/span><span class=\"eq-w\">estimate of percentage<br>of games won.<\/span><span class=\"eq-n\">(1)<\/span><\/div>\n      <p class=\"book-p\">This formula has several desirable properties.<\/p>\n      <ul class=\"book-l\"><li>The predicted win percentage is always between 0 and 1.<\/li><li>An increase in runs scored increases predicted win percentage.<\/li><li>A decrease in runs allowed increases predicted win percentage.<\/li><\/ul>\n    <\/div>\n    <p class=\"mrow step\" data-step=\"1\">If R (scoring ratio) = <span class=\"fr \"><span class=\"fr-n\">runs scored<\/span><span class=\"fr-d\">runs allowed<\/span><\/span><\/p>\n    <p class=\"mrow step\" data-step=\"2\">The equation (1) can be interpreted as<\/p>\n    <p class=\"mrow big red step\" data-step=\"2\"><span class=\"fr \"><span class=\"fr-n\"><i>R<\/i><sup>2<\/sup><\/span><span class=\"fr-d\"><i>R<\/i><sup>2<\/sup> + 1<\/span><\/span> = estimate of percentage of games won<\/p>\n  <\/div>\n<\/div>", "sec": "Pythagorean Theorem", "notes": ""}, {"title": "Baseball’s Pythagorean Theorem (Ch.1) cont.", "cls": "s12", "html": "<header class=\"sh\"><p class=\"kick k-py\"><span class=\"dot\"><\/span>Pythagorean Theorem<\/p><h2>Baseball’s Pythagorean Theorem (Ch.1) cont.<\/h2><\/header>\n<div class=\"why\">\n  <p class=\"why-q\">Why?<\/p>\n  <p class=\"why-p\">The equation (1) is same as the following fraction (if you divide the numerator and denominator of <span class=\"red\">(runs allowed)<\/span><sup class=\"blue\">2<\/sup>:<\/p>\n  <div class=\"why-eq step\" data-step=\"1\"><span class=\"fr outer\"><span class=\"fr-n\"><span class=\"fr sm\"><span class=\"fr-n\">runs scored<sup>2<\/sup><\/span><span class=\"fr-d\">runs allowed<sup>2<\/sup><\/span><\/span><\/span><span class=\"fr-d\"><span class=\"fr sm\"><span class=\"fr-n\">runs score<sup>2<\/sup><\/span><span class=\"fr-d\">runs allowed<sup>2<\/sup><\/span><\/span><span class=\"op\">+<\/span><span class=\"fr sm\"><span class=\"fr-n\">runs allowed<sup>2<\/sup><\/span><span class=\"fr-d\">runs allowed<sup>2<\/sup><\/span><\/span><\/span><\/span><\/div>\n  <div class=\"why-out\">\n    <p class=\"mrow step\" data-step=\"2\">If R (scoring ratio) = <span class=\"fr \"><span class=\"fr-n\">runs scored<\/span><span class=\"fr-d\">runs allowed<\/span><\/span><\/p>\n    <p class=\"mrow big step\" data-step=\"3\"><span class=\"fr \"><span class=\"fr-n\"><i>R<\/i><sup>2<\/sup><\/span><span class=\"fr-d\"><i>R<\/i><sup>2<\/sup> + 1<\/span><\/span> <span class=\"red\">= estimate of percentage of games won<\/span><\/p>\n  <\/div>\n<\/div>", "sec": "Pythagorean Theorem", "notes": ""}, {"title": "Baseball’s Pythagorean Theorem (Ch.1) cont.", "cls": "s13", "html": "<header class=\"sh\"><p class=\"kick k-py\"><span class=\"dot\"><\/span>Pythagorean Theorem<\/p><h2>Baseball’s Pythagorean Theorem (Ch.1) cont.<\/h2><\/header>\n<div class=\"ex\">\n  <div class=\"ex-l\">\n    <p class=\"ex-lead\">Figure 1.1 shows how well <span class=\"fr \"><span class=\"fr-n\"><i>R<\/i><sup>2<\/sup><\/span><span class=\"fr-d\"><i>R<\/i><sup>2<\/sup> + 1<\/span><\/span> predicts MLB team’s winning percentage.<\/p>\n    <ol class=\"calc\">\n      <li class=\"step\" data-step=\"1\">For example, the 2006 Detroit Tigers <span class=\"red\">scored 822 runs and gave up 675 runs.<\/span><\/li>\n      <li class=\"step\" data-step=\"2\">Their scoring ratio was R (scoring ratio) = <span class=\"fr \"><span class=\"fr-n\">822<\/span><span class=\"fr-d\">675<\/span><\/span> = <b>1.218<\/b><\/li>\n      <li class=\"step\" data-step=\"3\">Their predicted win percentage was <span class=\"fr \"><span class=\"fr-n\">1.218<sup>2<\/sup><\/span><span class=\"fr-d\">1.218<sup>2<\/sup> + 1<\/span><\/span> = <b>.597<\/b><\/li>\n      <li class=\"step\" data-step=\"4\">Actual win percentage (win/total games played) was <b>.586<\/b><\/li>\n      <li class=\"step\" data-step=\"5\">Absolute error (actual win % - predicted win %)<br>So Tigers absolute error was |.586-.597| = <b>0.011<\/b><\/li>\n    <\/ol>\n  <\/div>\n  <figure class=\"fig\"><div class=\"fig-scroll\"><table class=\"st\"><thead><tr class=\"mad\"><td colspan=\"10\">MAD = 0.020<\/td><\/tr><tr><th>Year<\/th><th>Team<\/th><th>Wins<\/th><th>Losses<\/th><th>Runs scored<\/th><th>Runs allowed<\/th><th>Scoring ratio<\/th><th>Predicted winning %<\/th><th>Actual Winning %<\/th><th>Absolute Error<\/th><\/tr><\/thead><tbody><tr><td>2006<\/td><th>Diamondbacks<\/th><td>76<\/td><td>86<\/td><td>773<\/td><td>788<\/td><td>0.981<\/td><td>0.490<\/td><td>0.469<\/td><td>0.021<\/td><\/tr><tr><td>2006<\/td><th>Braves<\/th><td>79<\/td><td>83<\/td><td>849<\/td><td>805<\/td><td>1.055<\/td><td>0.527<\/td><td>0.488<\/td><td>0.039<\/td><\/tr><tr><td>2006<\/td><th>Orioles<\/th><td>70<\/td><td>92<\/td><td>768<\/td><td>899<\/td><td>0.854<\/td><td>0.422<\/td><td>0.432<\/td><td>0.010<\/td><\/tr><tr><td>2006<\/td><th>Red Sox<\/th><td>86<\/td><td>76<\/td><td>820<\/td><td>825<\/td><td>0.994<\/td><td>0.497<\/td><td>0.531<\/td><td>0.034<\/td><\/tr><tr><td>2006<\/td><th>White Sox<\/th><td>90<\/td><td>72<\/td><td>868<\/td><td>794<\/td><td>1.093<\/td><td>0.544<\/td><td>0.556<\/td><td>0.011<\/td><\/tr><tr><td>2006<\/td><th>Cubs<\/th><td>66<\/td><td>96<\/td><td>716<\/td><td>834<\/td><td>0.859<\/td><td>0.424<\/td><td>0.407<\/td><td>0.017<\/td><\/tr><tr><td>2006<\/td><th>Reds<\/th><td>80<\/td><td>82<\/td><td>749<\/td><td>801<\/td><td>0.935<\/td><td>0.466<\/td><td>0.494<\/td><td>0.027<\/td><\/tr><tr><td>2006<\/td><th>Indians<\/th><td>78<\/td><td>84<\/td><td>870<\/td><td>782<\/td><td>1.113<\/td><td>0.553<\/td><td>0.481<\/td><td>0.072<\/td><\/tr><tr><td>2006<\/td><th>Rockies<\/th><td>76<\/td><td>86<\/td><td>813<\/td><td>812<\/td><td>1.001<\/td><td>0.501<\/td><td>0.469<\/td><td>0.031<\/td><\/tr><tr class=\"hi\"><td>2006<\/td><th>Tigers<\/th><td>95<\/td><td>67<\/td><td>822<\/td><td>675<\/td><td>1.218<\/td><td>0.597<\/td><td>0.586<\/td><td>0.011<\/td><\/tr><tr><td>2006<\/td><th>Marlins<\/th><td>78<\/td><td>84<\/td><td>758<\/td><td>772<\/td><td>0.982<\/td><td>0.491<\/td><td>0.481<\/td><td>0.009<\/td><\/tr><tr><td>2006<\/td><th>Astros<\/th><td>82<\/td><td>80<\/td><td>735<\/td><td>719<\/td><td>1.022<\/td><td>0.511<\/td><td>0.506<\/td><td>0.005<\/td><\/tr><tr><td>2006<\/td><th>Royals<\/th><td>62<\/td><td>100<\/td><td>757<\/td><td>971<\/td><td>0.780<\/td><td>0.378<\/td><td>0.383<\/td><td>0.005<\/td><\/tr><tr><td>2006<\/td><th>Angels<\/th><td>89<\/td><td>73<\/td><td>766<\/td><td>732<\/td><td>1.046<\/td><td>0.523<\/td><td>0.549<\/td><td>0.027<\/td><\/tr><tr><td>2006<\/td><th>Dodgers<\/th><td>88<\/td><td>74<\/td><td>820<\/td><td>751<\/td><td>1.092<\/td><td>0.544<\/td><td>0.543<\/td><td>0.001<\/td><\/tr><tr><td>2006<\/td><th>Brewers<\/th><td>75<\/td><td>87<\/td><td>730<\/td><td>833<\/td><td>0.876<\/td><td>0.434<\/td><td>0.463<\/td><td>0.029<\/td><\/tr><tr><td>2006<\/td><th>Twins<\/th><td>96<\/td><td>66<\/td><td>801<\/td><td>683<\/td><td>1.173<\/td><td>0.579<\/td><td>0.593<\/td><td>0.014<\/td><\/tr><tr><td>2006<\/td><th>Yankees<\/th><td>97<\/td><td>65<\/td><td>930<\/td><td>767<\/td><td>1.213<\/td><td>0.595<\/td><td>0.599<\/td><td>0.004<\/td><\/tr><\/tbody><\/table><\/div><figcaption>Figure 1.1. Baseball’s Pythagorean Theorem, 1980–2006. See file Standings.xls.<\/figcaption><\/figure>\n<\/div>", "sec": "Pythagorean Theorem", "notes": ""}, {"title": "Exercise (1-point)", "cls": "s14", "html": "<header class=\"sh\"><p class=\"kick k-ex\"><span class=\"dot\"><\/span>Exercise<\/p><h2>Exercise (1-point)<\/h2><\/header>\n<div class=\"task\">\n  <div class=\"task-file\"><svg viewBox=\"0 0 48 48\" aria-hidden=\"true\"><path d=\"M12 4h18l10 10v30H12z\"/><path d=\"M30 4v10h10M18 22h16M18 29h16M18 36h16M25 22v14\"/><\/svg>\n    <div><p>2019 MLB_Student Excel file on course website (see Module 9) or link below<\/p>\n    <a class=\"lnk\" href=\"https://drive.google.com/file/d/1Qgk1WN_ky61AyTZa6ckXWMxrD6As2F78/view?usp=sharing\" target=\"_blank\" rel=\"noopener\">https://drive.google.com/file/d/1Qgk1WN_ky61AyTZa6ckXWMxrD6As2F78/view?usp=sharing<\/a><\/div><\/div>\n  <p class=\"task-p\">Complete the following columns: Scoring Ratio, Predicted Winning %, Actual Winning %, Absolute Error<\/p>\n  <div class=\"cols\"><span>Scoring Ratio<\/span><span>Predicted Winning %<\/span><span>Actual Winning %<\/span><span>Absolute Error<\/span><\/div>\n  <ul class=\"bl\">\n    <li>Upload your completed answer to Module 11 (see In-Class Assignments- Baseball Analytics)<\/li>\n    <li>This will replace your handwritten note.<\/li>\n  <\/ul>\n<\/div>", "sec": "Exercise", "notes": ""}, {"title": "In-Class Assignments (1-point)", "cls": "s15", "html": "<header class=\"sh\"><p class=\"kick k-ex\"><span class=\"dot\"><\/span>In-Class Assignment<\/p><h2>In-Class Assignments (1-point)<\/h2><\/header>\n<div class=\"ica\">\n  <p class=\"ica-q\">How do we use this information?<\/p>\n  <div class=\"ica-board\">\n    <div class=\"ica-cell\"><span class=\"ica-l\">On July 4, 2005, the Nationals were in first place with a record of<\/span><span class=\"ica-v\">50-32<\/span><\/div>\n    <div class=\"ica-cell\"><span class=\"ica-l\">On July 4, 2005, the Nationals scoring ratio was<\/span><span class=\"ica-v\">.991<\/span><\/div>\n  <\/div>\n  <ul class=\"bl\">\n    <li>Calculate the 2005 Nationals’ predicted season records (# of wins and losses) using the scoring ratio. MLB has a total of 162 games per season.<\/li>\n    <li>In 2005, National finished XX (# of win) – XX (# of loss)?<\/li>\n    <li>This will replace your handwritten note.<\/li>\n    <li>Please download the form (from Module 9) and return your answer with the formula.<\/li>\n  <\/ul>\n<\/div>", "sec": "In-Class Assignment", "notes": ""}, {"title": "Baseball’s Pythagorean Theorem (Ch.1) cont.", "cls": "s16", "html": "<header class=\"sh\"><p class=\"kick k-py\"><span class=\"dot\"><\/span>Pythagorean Theorem<\/p><h2>Baseball’s Pythagorean Theorem (Ch.1) cont.<\/h2><\/header>\n<div class=\"fc\">\n  <div class=\"fc-l\">\n    <p class=\"fc-q\">How well does the Pythagorean Theorem forecast?<\/p>\n    <ul class=\"bl\">\n      <li>Compared the Pythagorean Theorem’s forecast for each MLB playoff series (1980-2007) against a prediction based just on games won.<\/li>\n      <li>For each playoff series the Pythagorean method would predict the winner to be the team with the higher scoring ratio, while the games won approach simply predicts the winner of a playoff series to be the team that won more games.<\/li>\n      <li>Pythagorean approach correctly predicted 57 of 106 playoff series (53.8%), while the games won approach correctly predicted the winner of only 50% (50 out of 100) playoff series.<\/li>\n      <li class=\"step\" data-step=\"1\">Regular season is a relatively poor predictor of the playoffs in baseball because a team’s regular season record depends on the performance of five starting pitchers.<\/li>\n      <li class=\"step\" data-step=\"1\">During the playoffs teams only use three or four starting pitchers, so much of the regular season data are not relevant for predicting the outcome of the playoffs.<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"fc-viz\" aria-hidden=\"true\">\n    <div class=\"fcb\"><span class=\"fcb-v\">53.8%<\/span><span class=\"fcb-bar\" style=\"--h:53.8%\"><\/span><span class=\"fcb-l\">Pythagorean<br>57 of 106<\/span><\/div>\n    <div class=\"fcb g\"><span class=\"fcb-v\">50%<\/span><span class=\"fcb-bar\" style=\"--h:50%\"><\/span><span class=\"fcb-l\">Games won<br>50 out of 100<\/span><\/div>\n  <\/div>\n<\/div>", "sec": "Pythagorean Theorem", "notes": ""}, {"title": "Questions?", "cls": "s-close", "html": "<div class=\"cl\"><svg class=\"ball\" viewBox=\"0 0 200 200\" aria-hidden=\"true\"><circle cx=\"100\" cy=\"100\" r=\"92\" class=\"ball-c\"/>\n<path d=\"M38 32c26 22 38 44 38 68s-12 46-38 68\" class=\"ball-s\"/><path d=\"M162 32c-26 22-38 44-38 68s12 46 38 68\" class=\"ball-s\"/>\n<path d=\"M38 32c26 22 38 44 38 68s-12 46-38 68\" class=\"ball-st\"/><path d=\"M162 32c-26 22-38 44-38 68s12 46 38 68\" class=\"ball-st\"/><\/svg><p class=\"cl-t\">Questions?<\/p><p class=\"cl-s\">SPM 261 · Baseball Analytics<\/p><\/div>", "sec": "", "notes": ""}]</script>
<script>
(function(){
  const SLIDES = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  const els = SLIDES.map((s,i)=>{
    const sec = document.createElement('section');
    sec.className = 'slide ' + (s.cls||'');
    sec.dataset.index = i;
    sec.setAttribute('aria-label', s.title||'');
    sec.innerHTML = '<div class="slide-inner">' + s.html + '</div>';
    deck.appendChild(sec);
    return sec;
  });
  let current = 0, step = 0, notesOpen = false, zoom = 1;
  const stepsOf = el => Array.from(el.querySelectorAll('.step'));
  const maxStep = el => stepsOf(el).reduce((m,e)=>Math.max(m, +e.dataset.step||0), 0);
  function paint(){
    stepsOf(els[current]).forEach(e=>e.classList.toggle('on', (+e.dataset.step||0) <= step));
  }
  function activate(i, atEnd){
    i = Math.max(0, Math.min(SLIDES.length-1, i));
    els[current].classList.remove('active');
    current = i;
    els[i].classList.add('active');
    step = atEnd ? maxStep(els[i]) : 0;
    paint();
    const s = SLIDES[i];
    document.getElementById('progressFill').style.width = ((i+1)/SLIDES.length*100) + '%';
    document.getElementById('counter').textContent = String(i+1).padStart(2,'0') + ' / ' + SLIDES.length;
    document.getElementById('pageNum').textContent = (i+1) + ' / ' + SLIDES.length;
    document.getElementById('sectionLabel').textContent = s.sec || '';
    const nb = document.getElementById('notesBody');
    nb.innerHTML = '<h3>Speaker Notes</h3>' + (s.notes ? s.notes.split('\n').filter(x=>x.trim()).map(p=>'<p>'+p.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener" style="color:#38c6ff">$1</a>')+'</p>').join('') : '<p class="notes-empty">No speaker notes for this slide.</p>');
    history.replaceState(null, '', '#s' + (i+1));
  }
  function next(){ if(step < maxStep(els[current])){ step++; paint(); } else if(current < SLIDES.length-1) activate(current+1); }
  function prev(){ if(step > 0){ step--; paint(); } else if(current > 0) activate(current-1, true); }
  window.SB_revealAll = function(){ step = maxStep(els[current]); paint(); };
  window.SB_go = function(n){ activate(n-1); };

  document.getElementById('nextBtn').addEventListener('click', e=>{ e.stopPropagation(); next(); });
  document.getElementById('prevBtn').addEventListener('click', e=>{ e.stopPropagation(); prev(); });
  deck.addEventListener('click', e=>{
    if(e.target.closest('a,button,iframe,input,textarea,.zq-btn') ) return;
    if(e.target.tagName === 'IMG' && !e.target.dataset.nozoom) return;
    if(window.getSelection && String(window.getSelection()).length) return;
    next(); hideHint();
  });
  deck.addEventListener('click', e=>{
    const g = e.target.closest('[data-go]');
    if(g){ e.stopPropagation(); activate(+g.dataset.go - 1); }
  });
  let wheelLock = 0;
  window.addEventListener('wheel', e=>{
    if(document.getElementById('askBackdrop').classList.contains('open') || e.target.closest('.notes-panel')) return;
    const now = Date.now(); if(now - wheelLock < 650 || Math.abs(e.deltaY) < 18) return;
    wheelLock = now; e.deltaY > 0 ? next() : prev(); hideHint();
  }, {passive:true});
  document.addEventListener('keydown', e=>{
    if(e.target.closest && e.target.closest('input,textarea')) return;
    if(document.getElementById('askBackdrop').classList.contains('open')) return;
    const k = e.key;
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(k)){ e.preventDefault(); next(); hideHint(); }
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(k)){ e.preventDefault(); prev(); }
    else if(k==='Home') activate(0); else if(k==='End') activate(SLIDES.length-1);
    else if(k==='n'||k==='N') toggleNotes();
    else if(k==='+'||k==='=') zoomIn(); else if(k==='-'||k==='_') zoomOut(); else if(k==='0') zoomReset();
  });
  let tx = null;
  deck.addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
  deck.addEventListener('touchend', e=>{ if(tx===null) return; const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); } tx = null; });

  function applyZoom(){ document.documentElement.style.setProperty('--z', zoom); document.getElementById('zoomResetBtn').textContent = Math.round(zoom*100)+'%'; }
  function zoomIn(){ zoom = Math.min(1.6, +(zoom+0.1).toFixed(2)); applyZoom(); }
  function zoomOut(){ zoom = Math.max(0.6, +(zoom-0.1).toFixed(2)); applyZoom(); }
  function zoomReset(){ zoom = 1; applyZoom(); }
  document.getElementById('zoomInBtn').addEventListener('click', e=>{ e.stopPropagation(); zoomIn(); });
  document.getElementById('zoomOutBtn').addEventListener('click', e=>{ e.stopPropagation(); zoomOut(); });
  document.getElementById('zoomResetBtn').addEventListener('click', e=>{ e.stopPropagation(); zoomReset(); });
  applyZoom();

  const notesPanel = document.getElementById('notesPanel');
  function toggleNotes(){ notesOpen = !notesOpen; notesPanel.classList.toggle('open', notesOpen); }
  document.getElementById('notesToggle').addEventListener('click', toggleNotes);
  document.getElementById('closeNotes').addEventListener('click', toggleNotes);
  const hint = document.getElementById('hint');
  function hideHint(){ hint.classList.add('hide'); }
  setTimeout(hideHint, 5000);

  // ask a question / leave a comment
  (function(){
    const askBtn = document.getElementById('askBtn'), backdrop = document.getElementById('askBackdrop'),
      context = document.getElementById('askContext'), textEl = document.getElementById('askText'),
      nameEl = document.getElementById('askName'), sendBtn = document.getElementById('askSend'),
      cancelBtn = document.getElementById('askCancel'), statusEl = document.getElementById('askStatus');
    const DECK = 'SPM261 Week 9-1 — Baseball Analytics';
    function open(){
      const slide = SLIDES[current] || {};
      context.textContent = 'Slide ' + (current+1) + ' of ' + SLIDES.length + ' — ' + (slide.title || '(untitled)');
      statusEl.textContent = ''; statusEl.className = 'ask-status';
      sendBtn.disabled = false; sendBtn.textContent = 'Send';
      backdrop.classList.add('open'); setTimeout(()=> textEl.focus(), 50);
    }
    function close(){ backdrop.classList.remove('open'); textEl.value=''; nameEl.value=''; }
    async function send(){
      const question = textEl.value.trim(), name = nameEl.value.trim();
      if(!name){ statusEl.textContent = 'Please enter your name.'; statusEl.className = 'ask-status err'; nameEl.focus(); return; }
      if(!question){ statusEl.textContent = 'Please enter a question or comment.'; statusEl.className = 'ask-status err'; textEl.focus(); return; }
      if(!window.QUESTIONS_API){ statusEl.textContent = "This form isn't connected yet — let your professor know."; statusEl.className = 'ask-status err'; return; }
      sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
      const slide = SLIDES[current] || {};
      try{
        await fetch(window.QUESTIONS_API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({deck: DECK, slideIndex: current+1, slideTitle: slide.title || '', question: question, name: name})});
        statusEl.textContent = 'Sent — thanks!'; statusEl.className = 'ask-status ok'; setTimeout(close, 1100);
      }catch(err){
        statusEl.textContent = "Couldn't send — check your connection and try again."; statusEl.className = 'ask-status err';
        sendBtn.disabled = false; sendBtn.textContent = 'Send';
      }
    }
    askBtn.addEventListener('click', open); cancelBtn.addEventListener('click', close); sendBtn.addEventListener('click', send);
    backdrop.addEventListener('click', e=>{ if(e.target === backdrop) close(); });
    document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && backdrop.classList.contains('open')) close(); });
  })();

  let startIdx = 0;
  const m = location.hash.match(/s(\d+)/);
  if(m){ const n = parseInt(m[1],10)-1; if(n>=0 && n<SLIDES.length) startIdx = n; }
  els[0].classList.add('active');
  activate(startIdx);
})();
</script>
<script id="w91-zoomfloat-js">
(function(){
 var btn=document.createElement('button');btn.className='zq-btn';btn.type='button';btn.textContent='+';btn.title='Enlarge image';btn.setAttribute('aria-label','Enlarge image');
 var lb=document.createElement('div');lb.className='zq-lb';var li=document.createElement('img');li.alt='';lb.appendChild(li);
 document.body.appendChild(btn);document.body.appendChild(lb);
 var cur=null;
 function ok(im){return im&&im.tagName==='IMG'&&im.matches('#deck .slide.active img')&&!im.dataset.nozoom;}
 document.addEventListener('mouseover',function(e){var im=e.target;if(ok(im)){cur=im;var r=im.getBoundingClientRect();btn.style.left=(r.right-46)+'px';btn.style.top=(r.top+8)+'px';btn.style.display='flex';}else if(e.target!==btn){btn.style.display='none';}});
 function open(src){li.src=src;lb.classList.add('open');btn.style.display='none';}
 document.addEventListener('click',function(e){
  if(e.target===btn&&cur){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(cur.currentSrc||cur.src);return;}
  if(ok(e.target)){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();open(e.target.currentSrc||e.target.src);return;}
  if(lb.classList.contains('open')&&lb.contains(e.target)){e.stopPropagation();e.stopImmediatePropagation();lb.classList.remove('open');}
 },true);
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&lb.classList.contains('open')){lb.classList.remove('open');e.stopPropagation();}},true);
})();
