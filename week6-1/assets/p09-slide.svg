<svg xmlns="http://www.w3.org/2000/svg" viewBox="118.9 56.6 652.5 432.0" role="img" aria-label="Flow of funds: Start, community residents pay taxes to the city council, which subsidizes sports facilities or events that attract out-of-town visitors who spend money locally, creating income and jobs and an inflow of revenues for community residents who pay taxes. Finish. (Howard &amp; Crompton, 2003, p. 105)">
