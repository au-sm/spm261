/div><span>Seats</span></div></div><div class=\"ig-row\"><div class=\"ig-card ig-stat\" style=\"--c:#2a9d8f;border-color:#2a9d8f\"><div class=\"ig-big\">35 yrs</div><span>Years non-relocation agreement</span></div><div class=\"ig-card ig-stat\" style=\"--c:#e9a03b;border-color:#e9a03b\"><div class=\"ig-big\">2029</div><span>Opening Day</span></div></div></div>\n<img class=\"ig-photo\" src=\"assets/p47-new-stadium.jpg\" alt=\"New stadium rendering\"></div>\n<div class=\"ig-bar\"><span style=\"flex:137;background:#1d3557\" title=\"Rays\">$1.37B</span><span style=\"flex:79.6;background:#2a9d8f\" title=\"Hillsborough County\">$796M</span><span style=\"flex:8;background:#b23a2c\" title=\"Tampa\">$80M</span><span style=\"flex:3;background:#e9a03b\" title=\"Federal\"></span></div><div class=\"ig-legend\"><span><i style=\"background:#1d3557\"></i>$1.37B – Rays</span><span><i style=\"background:#2a9d8f\"></i>$796M – Hillsborough County</span><span><i style=\"background:#b23a2c\"></i>$80M – Tampa</span><span><i style=\"background:#e9a03b\"></i>$30M – Federal</span> <span>(Another $30 million will come from federal disaster recovery funds)</span></div></div>", "notes": "https://www.sportsbusinessjournal.com/Articles/2026/10/02/how-the-tampa-bay-rays-new-owners-found-a-home-and-a-new-future/"}, {"type": "media", "title": "How can you differentiate between local residents and visitors (i.e., non-local residents)?", "images": [{"src": "assets/p48-composite.jpg", "w": 1600, "h": 961}]}, {"type": "media", "title": "Agree or Disagree with the large public subsidies? ", "kicker": "Questions?"}]</script>
<script>
(function(){
  const SLIDES = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  const progressFill = document.getElementById('progressFill');
  const counterEl = document.getElementById('counter');
  const sectionLabel = document.getElementById('sectionLabel');
  const pageNum = document.getElementById('pageNum');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const hint = document.getElementById('hint');
  const notesPanel = document.getElementById('notesPanel');
  const notesBody = document.getElementById('notesBody');
  const notesToggle = document.getElementById('notesToggle');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced) document.documentElement.classList.add('reduced');

  const SECTIONS = [
    {from:0,to:0,label:'Opening'},
    {from:1,to:8,label:'What Is Economic Impact?'},
    {from:9,to:13,label:'Measuring Economic Impact'},
    {from:14,to:18,label:'Who Really Benefits?'},
    {from:19,to:24,label:'An Alternative Rationale'},
    {from:25,to:46,label:'Case: Tampa Bay Rays'},
    {from:47,to:47,label:'Discussion'}
  ];
  function sectionFor(i){ for(const s of SECTIONS){ if(i>=s.from && i<=s.to) return s.label; } return ''; }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function revealItem(node, delayMs){ node.classList.add('reveal-item'); node.style.transitionDelay=(delayMs||0)+'ms'; return node; }
  function isQuestion(text){ return /\?\s*$/.test(text.trim()); }
  function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function titleEl(text, delay){
    const cls = 'disp title-slide'+(text.length>52?' long':'')+' reveal-item';
    const h = el('h1',cls, escapeHTML(text));
    revealItem(h, delay||0);
    return h;
  }
  function buildKicker(text, delay){ const k = el('p','kicker reveal-item', escapeHTML(text)); revealItem(k, delay||0); return k; }

  const LINK_MARKER_RE = /\[\[LINK:([^|\]]+)\|([^\]]+)\]\]/g;
  const HL_MARKER_RE = /==([^=]+)==/g;
  function renderMarkedText(text){
    const frag = document.createDocumentFragment();
    let last = 0, m;
    LINK_MARKER_RE.lastIndex = 0;
    while((m = LINK_MARKER_RE.exec(text))){
      if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1].trim(); a.target = '_blank'; a.rel = 'noopener'; a.style.color = 'inherit';
      a.textContent = m[2];
      frag.appendChild(a);
      last = LINK_MARKER_RE.lastIndex;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    const out = document.createDocumentFragment();
    Array.from(frag.childNodes).forEach(node => {
      if(node.nodeType !== Node.TEXT_NODE){ out.appendChild(node); return; }
      const t = node.textContent;
      let l2 = 0, mm;
      HL_MARKER_RE.lastIndex = 0;
      while((mm = HL_MARKER_RE.exec(t))){
        if(mm.index > l2) out.appendChild(document.createTextNode(t.slice(l2, mm.index)));
        const mark = document.createElement('mark');
        mark.className = 'hl-yellow';
        mark.textContent = mm[1];
        out.appendChild(mark);
        l2 = HL_MARKER_RE.lastIndex;
      }
      if(l2 < t.length) out.appendChild(document.createTextNode(t.slice(l2)));
    });
    return out;
  }
  function buildBullets(list, baseDelay){
    const ul = el('ul','bullets');
    list.forEach((t,i)=>{
      const li = el('li','');
      li.appendChild(renderMarkedText(t));
      revealItem(li, (baseDelay||0)+90*i);
      ul.appendChild(li);
    });
    return ul;
  }
  const URL_RE = /\b((?:https?:\/\/)?(?:www\.)?[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.[a-z]{2,}(?:\.[a-z]{2,})?(?:\/[^\s]*)?)/gi;
  function linkifyText(text){
    const frag = document.createDocumentFragment();
    let last = 0, m;
    URL_RE.lastIndex = 0;
    while((m = URL_RE.exec(text))){
      if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      let url = m[0], trail = '';
      while(/[.,;:)\]]$/.test(url)){ trail = url.slice(-1) + trail; url = url.slice(0, -1); }
      const href = /^https?:\/\//i.test(url) ? url : 'https://' + url;
      const a = document.createElement('a');
      a.href = href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = url;
      frag.appendChild(a);
      if(trail) frag.appendChild(document.createTextNode(trail));
      last = URL_RE.lastIndex;
    }
    if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    return frag;
  }
  function buildSource(text){ const p = el('p','source reveal-item'); p.appendChild(linkifyText(text)); return p; }
  function mediaBlock(images, delay){
    if(images.length < 2){ const im0=images[0]; return buildPhoto(im0,{delay:delay, contain: im0.fit==='contain', kb: im0.still!==true}); }
    const g = el('div','media-gallery n'+Math.min(images.length,5));
    images.forEach(function(im,i){ g.appendChild(buildPhoto(im,{delay:delay+i*90, contain:true, kb:false})); });
    return g;
  }
  function buildPhoto(img, opts){
    opts = opts||{};
    const outer = el('div','');
    const wrap = el('div','photo'+(opts.contain?' contain':'')+(opts.kb!==false?' kb':''));
    if(opts.delay!=null) wrap.style.transitionDelay = opts.delay+'ms';
    const im = document.createElement('img');
    im.src = img.src; im.loading='lazy'; im.alt = img.caption || '';
    if(img.w && img.h) im.style.aspectRatio = img.w+' / '+img.h;
    wrap.appendChild(im);
    if(img.flawBadge){
      wrap.classList.add('flawed');
      const badge = el('div','flaw-badge');
      badge.innerHTML = '<span class="flaw-x">&#10005;</span> '+escapeHTML(img.flawBadge);
      wrap.appendChild(badge);
    }
    if(img.callout){
      wrap.appendChild(el('div','photo-callout', escapeHTML(img.callout)));
    }
    outer.appendChild(wrap);
    if(img.caption) outer.appendChild(el('div','cutline', escapeHTML(img.caption)));
    return outer;
  }
  function badgeCorner(img, delay){
    const b = el('div','badge-corner');
    b.style.transitionDelay=(delay||0)+'ms';
    const im = document.createElement('img'); im.src = img.src; im.loading='lazy';
    b.appendChild(im);
    return b;
  }

  // ---------- slide type builders ----------
  function build(slide, idx){
    const s = el('section','slide');
    s.dataset.index = idx;
    let inner = el('div','slide-inner');

    switch(slide.type){
      case 'title': {
        inner.style.textAlign='center'; inner.style.alignItems='center'; inner.style.justifyContent='center';
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        const h = el('h1','disp title-hero reveal-item', escapeHTML(slide.title)); revealItem(h,140);
        inner.appendChild(h);
        if(slide.subtitle){ const sub = el('p','subtitle reveal-item', escapeHTML(slide.subtitle)); sub.style.margin='14px auto 0'; revealItem(sub,300); inner.appendChild(sub); }
        if(slide.meta){ const m = el('div','meta-badge reveal-item', escapeHTML(slide.meta)); revealItem(m,420); inner.appendChild(m); }
        break;
      }
      case 'agenda': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,60));
        const list = el('div','agenda-list');
        slide.items.forEach((it,i)=>{
          const row = el('div','agenda-row reveal-item'); revealItem(row,180+i*110);
          row.appendChild(el('div','agenda-n', escapeHTML(it.n)));
          const right = el('div','');
          right.appendChild(el('div','agenda-label', escapeHTML(it.label)));
          right.appendChild(el('div','agenda-detail', escapeHTML(it.detail)));
          row.appendChild(right);
          list.appendChild(row);
        });
        inner.appendChild(list);
        if(slide.source){ const src = buildSource(slide.source); src.classList.add('source-lg'); inner.appendChild(src); }
        break;
      }
      case 'hub': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,50));
        const wrap = el('div','hub-wrap');
        wrap.appendChild(el('div','hub-center', escapeHTML(slide.center)));
        const n = slide.spokes.length, radiusPct = 40;
        slide.spokes.forEach((label,i)=>{
          const angle = (Math.PI*2*i/n) - Math.PI/2;
          const dx = radiusPct*Math.cos(angle), dy = radiusPct*Math.sin(angle);
          const x = 50+dx, y = 50+dy;
          const line = el('div','hub-spoke-line');
          const len = Math.sqrt(dx*dx+dy*dy);
          line.style.width = 'calc(' + len + '% * 1.02)';
          line.style.transform = 'rotate(' + (Math.atan2(dy,dx)*180/Math.PI) + 'deg)';
          line.style.transitionDelay = (200+i*70)+'ms';
          wrap.appendChild(line);
          const node = el('div','hub-node', escapeHTML(label));
          node.style.left = x+'%'; node.style.top = y+'%'; node.style.transitionDelay = (300+i*70)+'ms';
          wrap.appendChild(node);
        });
        inner.appendChild(wrap);
        if(slide.bullets && slide.bullets.length) inner.appendChild(buildBullets(slide.bullets, 200+n*70+120));
        break;
      }
      case 'blank': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,50));
        const card = el('div','blank-card reveal-item'); revealItem(card,140);
        const parts = slide.blankText.split('[[BLANK]]');
        const txt = el('div','blank-text');
        parts.forEach((part,i)=>{
          txt.appendChild(document.createTextNode(part));
          if(i < parts.length-1){
            const fill = el('span','blank-fill', escapeHTML((slide.fills&&slide.fills[i])||'      '));
            fill.style.transitionDelay = (600+i*220)+'ms';
            txt.appendChild(fill);
          }
        });
        card.appendChild(txt);
        inner.appendChild(card);
        if(slide.hint) inner.appendChild(el('div','blank-hint reveal-item', escapeHTML(slide.hint)));
        break;
      }
      case 'datatable': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,40));
        const wrap = el('div','data-table-wrap reveal-item'); revealItem(wrap,160);
        const cap = el('div','data-table-cap');
        cap.appendChild(el('div','dtc-label', escapeHTML(slide.tableLabel)));
        cap.appendChild(el('div','dtc-title', escapeHTML(slide.tableTitle)));
        wrap.appendChild(cap);
        const scroll = el('div','data-table-scroll');
        const table = el('table','data-table');
        const thead = el('thead','');
        const htr = el('tr','');
        slide.columns.forEach(c=> htr.appendChild(el('th','',escapeHTML(c))));
        thead.appendChild(htr); table.appendChild(thead);
        const tbody = el('tbody','');
        slide.rows.forEach((row,ri)=>{
          const tr = el('tr','reveal-item'); revealItem(tr, 260+ri*70);
          tr.appendChild(el('td','dt-cluster', escapeHTML(row[0])));
          const behCell = el('td','dt-behaviors');
          row[1].forEach(line=> behCell.appendChild(el('div','',escapeHTML(line))));
          tr.appendChild(behCell);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        scroll.appendChild(table);
        wrap.appendChild(scroll);
        inner.appendChild(wrap);
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }
      case 'flow': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        inner.appendChild(titleEl(slide.title,60));
        if(slide.lede){ const l = el('p','lede reveal-item'); l.appendChild(renderMarkedText(slide.lede)); revealItem(l,120); inner.appendChild(l); }
        const wrap = el('div','flow-wrap');
        slide.stages.forEach((st,i)=>{
          const row = el('div','flow-step reveal-item'); revealItem(row, 200+i*130);
          const left = el('div','');
          left.appendChild(el('div','flevel', escapeHTML(st.level||'')));
          const mid = el('div','');
          mid.appendChild(el('div','flabel', escapeHTML(st.label)));
          if(st.process) mid.appendChild(el('div','fproc', escapeHTML(st.process)));
          const outs = el('div','flow-outs');
          (st.outcomes||[]).forEach(o=> outs.appendChild(el('span','flow-chip', escapeHTML(o))));
          row.appendChild(left); row.appendChild(mid); row.appendChild(outs);
          wrap.appendChild(row);
        });
        inner.appendChild(wrap);
        if(slide.bullets) inner.appendChild(buildBullets(slide.bullets, 200+slide.stages.length*130+80));
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }
      case 'compare': {
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        if(slide.badge) inner.appendChild(badgeCorner(slide.badge,140));
        inner.appendChild(titleEl(slide.title,40));
        if(slide.bullets) inner.appendChild(buildBullets(slide.bullets,120));
        const grid = el('div','compare-grid');
        slide.panels.forEach((p,pi)=>{
          const panel = el('div','compare-panel '+p.tone+' reveal-item');
          revealItem(panel, 280+pi*160);
          panel.appendChild(el('div','compare-head', escapeHTML(p.label)));
          p.items.forEach(it=>{
            const item = el('div','compare-item');
            item.appendChild(el('div','ci-name', escapeHTML(it.name)));
            item.appendChild(el('div','ci-full', escapeHTML(it.full)));
            item.appendChild(el('div','ci-detail', escapeHTML(it.detail)));
            panel.appendChild(item);
          });
          grid.appendChild(panel);
        });
        inner.appendChild(grid);
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }
      case 'media': {
        const layout = slide.layout || 'stack';
        if(slide.kicker) inner.appendChild(buildKicker(slide.kicker,0));
        if(slide.title) inner.appendChild(titleEl(slide.title,50));

        function bodyContent(delayBase){
          const frag = document.createDocumentFragment();
          if(slide.quote){ const pq = el('p','pullquote reveal-item'); pq.appendChild(renderMarkedText(slide.quote)); revealItem(pq,delayBase); frag.appendChild(pq); delayBase+=140; }
          if(slide.bullets && slide.bullets.length){ frag.appendChild(buildBullets(slide.bullets, delayBase)); }
          return frag;
        }

        if(layout === 'split' || layout === 'split-reverse'){
          const grid = el('div','split-grid'+(layout==='split-reverse'?' reverse':''));
          const text = el('div','split-text');
          text.appendChild(bodyContent(120));
          const media = el('div','split-media');
          const im0 = slide.images[0];
          media.appendChild(mediaBlock(slide.images,260));
          grid.appendChild(text); grid.appendChild(media);
          inner.appendChild(grid);
        } else {
          const body = el('div','stack-body');
          body.appendChild(bodyContent(100));
          if(slide.images && slide.images.length){
            const im0 = slide.images[0];
            body.appendChild(mediaBlock(slide.images,280));
          }
          inner.appendChild(body);
        }

        if(slide.html){ const hb=el('div','info-html reveal-item'); hb.innerHTML=slide.html; revealItem(hb,180); inner.appendChild(hb); }
        if(slide.video){
          const vid=(slide.video.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/)||[])[1];
          if(vid){ const w=el('div','video-embed reveal-item'); revealItem(w,200);
            const f=document.createElement('iframe'); f.src='https://www.youtube-nocookie.com/embed/'+vid+'?rel=0';
            f.title='YouTube video'; f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'; f.allowFullscreen=true; f.loading='lazy';
            w.appendChild(f); inner.appendChild(w); }
        }
        if(slide.source){ const src = buildSource(slide.source); src.classList.add('source-lg'); inner.appendChild(src); }
        break;
      }
      case 'closing': {
        inner.classList.add('closing-wrap');
        const h = el('h1','disp title-hero reveal-item', escapeHTML(slide.title)); revealItem(h,100);
        const rule = el('div','rule reveal-item'); revealItem(rule,40);
        const rule2 = el('div','rule reveal-item'); revealItem(rule2,360);
        inner.appendChild(rule); inner.appendChild(h);
        if(slide.subtitle){ const sub=el('p','subtitle reveal-item', escapeHTML(slide.subtitle)); revealItem(sub,220); inner.appendChild(sub); }
        inner.appendChild(rule2);
        break;
      }
      default: break;
    }
    if(slide.type!=='title' && slide.type!=='closing'){
      const t = inner.querySelector(':scope > h1.title-slide');
      const k = inner.querySelector(':scope > .kicker');
      if(t && k && (k.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING)) t.after(k);
      if(slide.subhead){ const sh = el('p','subhead reveal-item'+(slide.subheadSize==='xl'?' subhead-xl':''), escapeHTML(slide.subhead)); revealItem(sh,90); (k||t||inner.firstChild).after(sh); }
    }
    s.appendChild(inner);
    return s;
  }

  const slideEls = SLIDES.map((sl,i)=> build(sl,i));
  slideEls.forEach(e=> deck.appendChild(e));

  let current = -1, notesOpen = false;

  function activate(idx){
    current = idx;
    slideEls.forEach((e,i)=>{
      if(i===idx){ e.classList.add('active'); }
      else{
        e.classList.remove('active');
        e.querySelectorAll('.reveal-item').forEach(r=> r.classList.remove('in'));
        e.querySelectorAll('.photo').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.banner-wrap').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.hub-center,.hub-node,.hub-spoke-line').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.badge-corner').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.blank-fill').forEach(x=> x.classList.remove('in'));
      }
    });
    const activeEl = slideEls[idx];
    requestAnimationFrame(()=>{
      activeEl.querySelectorAll('.reveal-item').forEach(r=> r.classList.add('in'));
      activeEl.querySelectorAll('.photo').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.banner-wrap').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.hub-center,.hub-node,.hub-spoke-line').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.badge-corner').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.blank-fill').forEach(x=> x.classList.add('in'));
    });

    progressFill.style.width = ((idx)/(SLIDES.length-1)*100).toFixed(2)+'%';
    counterEl.textContent = String(idx+1).padStart(2,'0')+' / '+SLIDES.length;
    sectionLabel.textContent = sectionFor(idx);
    pageNum.textContent = String(idx+1).padStart(2,'0');
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===SLIDES.length-1;

    const notesText = SLIDES[idx].notes;
    if(notesText){
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p></p>';
      notesBody.querySelector('p').appendChild(linkifyText(notesText));
      notesToggle.style.opacity = 1;
    } else {
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p class="notes-empty">No speaker notes for this slide.</p>';
      notesToggle.style.opacity = .45;
    }
    location.hash = 's'+(idx+1);
  }

  function next(){ if(current < SLIDES.length-1) activate(current+1); hideHint(); }
  function prev(){ if(current > 0) activate(current-1); hideHint(); }
  let hintHidden = false;
  function hideHint(){ if(!hintHidden){ hint.classList.add('hide'); hintHidden = true; } }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  deck.addEventListener('click', (e)=>{ if(e.target.closest('a')) return; next(); });

  window.addEventListener('keydown', (e)=>{
    const tag = (e.target && e.target.tagName) || '';
    if(tag==='TEXTAREA' || tag==='INPUT' || (e.target && e.target.isContentEditable)) return;
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); activate(0); }
    else if(e.key==='End'){ e.preventDefault(); activate(SLIDES.length-1); }
    else if(e.key==='n' || e.key==='N'){ toggleNotes(); }
    else if(e.key==='Escape'){ if(notesOpen) toggleNotes(); }
    else if(e.key==='+' || e.key==='='){ e.preventDefault(); zoomIn(); }
    else if(e.key==='-' || e.key==='_'){ e.preventDefault(); zoomOut(); }
    else if(e.key==='0'){ e.preventDefault(); zoomReset(); }
  });

  const ZOOM_MIN=0.75, ZOOM_MAX=2, ZOOM_STEP=0.1;
  let zoomLevel = 1;
  try{ const saved = parseFloat(localStorage.getItem('spm381_w6_zoom')); if(!isNaN(saved)&&saved>=ZOOM_MIN&&saved<=ZOOM_MAX) zoomLevel=saved; }catch(err){}
  function applyZoom(){
    document.documentElement.style.setProperty('--zoom', zoomLevel.toFixed(2));
    zoomResetBtn.textContent = Math.round(zoomLevel*100)+'%';
    zoomOutBtn.disabled = zoomLevel<=ZOOM_MIN; zoomInBtn.disabled = zoomLevel>=ZOOM_MAX;
    try{ localStorage.setItem('spm381_w6_zoom', zoomLevel); }catch(err){}
  }
  function zoomIn(){ zoomLevel=Math.min(ZOOM_MAX,+(zoomLevel+ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomOut(){ zoomLevel=Math.max(ZOOM_MIN,+(zoomLevel-ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomReset(){ zoomLevel=1; applyZoom(); }
  zoomInBtn.addEventListener('click',(e)=>{ e.stopPropagation(); zoomIn(); });
  zoomOutBtn.addEventListener('click',(e)=>{ e.stopPropagation(); zoomOut(); });
  zoomResetBtn.addEventListener('click',(e)=>{ e.stopPropagation(); zoomReset(); });
  applyZoom();

  function toggleNotes(){ notesOpen = !notesOpen; notesPanel.classList.toggle('open', notesOpen); }
  notesToggle.addEventListener('click', toggleNotes);
  document.getElementById('closeNotes').addEventListener('click', toggleNotes);

  setTimeout(hideHint, 5000);

  // ask a question / leave a comment
  (function(){
    const askBtn = document.getElementById('askBtn');
    const backdrop = document.getElementById('askBackdrop');
    const context = document.getElementById('askContext');
    const textEl = document.getElementById('askText');
    const nameEl = document.getElementById('askName');
    const sendBtn = document.getElementById('askSend');
    const cancelBtn = document.getElementById('askCancel');
    const statusEl = document.getElementById('askStatus');
    const DECK = 'SPM261 Week 6-1 — Economic Impact';

    function open(){
      const slide = SLIDES[current] || {};
      const title = slide.title || slide.text || slide.label || '(untitled)';
      context.textContent = 'Slide ' + (current+1) + ' of ' + SLIDES.length + ' — ' + title;
      statusEl.textContent = ''; statusEl.className = 'ask-status';
      sendBtn.disabled = false; sendBtn.textContent = 'Send';
      backdrop.classList.add('open');
      setTimeout(()=> textEl.focus(), 50);
    }
    function close(){
      backdrop.classList.remove('open');
      textEl.value=''; nameEl.value='';
    }
    async function send(){
      const question = textEl.value.trim();
      const name = nameEl.value.trim();
      if(!name){
        statusEl.textContent = 'Please enter your name.';
        statusEl.className = 'ask-status err';
        nameEl.focus();
        return;
      }
      if(!question){
        statusEl.textContent = 'Please enter a question or comment.';
        statusEl.className = 'ask-status err';
        textEl.focus();
        return;
      }
      if(!window.QUESTIONS_API){
        statusEl.textContent = "This form isn't connected yet — let your professor know.";
        statusEl.className = 'ask-status err';
        return;
      }
      sendBtn.disabled = true; sendBtn.textContent = 'Sending…';
      statusEl.textContent = ''; statusEl.className = 'ask-status';
      const slide = SLIDES[current] || {};
      try{
        await fetch(window.QUESTIONS_API, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({
            deck: DECK,
            slideIndex: current+1,
            slideTitle: slide.title || slide.text || slide.label || '',
            question: question,
            name: name
          })
        });
        statusEl.textContent = 'Sent — thanks!';
        statusEl.className = 'ask-status ok';
        setTimeout(close, 1100);
      }catch(err){
        statusEl.textContent = "Couldn't send — check your connection and try again.";
        statusEl.className = 'ask-status err';
        sendBtn.disabled = false; sendBtn.textContent = 'Send';
      }
    }
    askBtn.addEventListener('click', open);
    cancelBtn.addEventListener('click', close);
    sendBtn.addEventListener('click', send);
    backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) close(); });
    document.addEventListener('keydown', (e)=>{
      if(e.key === 'Escape' && backdrop.classList.contains('open')) close();
    });
  })();

  let startIdx = 0;
  const m = location.hash.match(/s(\d+)/);
  if(m){ const n = parseInt(m[1],10)-1; if(n>=0 && n<SLIDES.length) startIdx = n; }
  activate(startIdx);
})();
</script>
<script>/* ==== components.js ==== */
/* SPM381 Week 6 — "Matchday Editorial" layout components.
 * Post-render enhancer: runs AFTER build() has rendered every <section.slide>.
 * Reads optional presentation fields (variant / media / plate / rowMark / heroKicker /
 * heroNum / closingMark) from each slide object in #slide-data, or from
 * window.DECK_LAYOUTS (a {index: fields} map) if the integrator prefers not to touch the JSON.
 * It only MOVES existing text nodes into new wrappers; it never retypes, deletes or reorders
 * content. Added nodes are decorative (aria-hidden) chrome: numerals, rules, plates, "vs" disc.
 * Load with: <script src="components.js"><\/script> placed after the deck's main script.
 */
(function(){
  'use strict';
  var dataEl = document.getElementById('slide-data');
  if(!dataEl) return;
  var SLIDES;
  try{ SLIDES = JSON.parse(dataEl.textContent); }catch(e){ return; }
  var EXTRA = window.DECK_LAYOUTS || {};

  function mk(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function deco(tag, cls, text){ var e = mk(tag, cls, text); e.setAttribute('aria-hidden','true'); return e; }
  function reveal(node, delay){ node.classList.add('reveal-item'); node.style.transitionDelay = (delay||0)+'ms'; return node; }
  function pad(n){ return (n<10?'0':'')+n; }
  /* move every child of `from` into a new wrapper, keep wrapper inside `from` */
  function wrapChildren(from, cls){
    var w = mk('span', cls);
    while(from.firstChild) w.appendChild(from.firstChild);
    from.appendChild(w);
    return w;
  }
  function fieldsFor(i){
    var s = SLIDES[i] || {}, x = EXTRA[i] || EXTRA[String(i)] || {}, out = {};
    ['variant','media','plate','rowMark','heroKicker','heroNum','closingMark'].forEach(function(k){
      if(x[k] != null) out[k] = x[k]; else if(s[k] != null) out[k] = s[k];
    });
    return out;
  }

  /* ---------- T1 hero ---------- */
  function hero(sec, inner, f){
    ['textAlign','alignItems','justifyContent'].forEach(function(p){ inner.style[p]=''; });
    inner.classList.add('cmp-hero');
    var h = inner.querySelector('h1.title-hero');
    if(f.heroKicker && !inner.querySelector('.kicker')){
      var k = deco('p','kicker cmp-hero-kicker', f.heroKicker);
      reveal(k, 0);
      inner.insertBefore(k, inner.firstChild);
    }
    if(h){
      var rule = deco('div','cmp-hero-rule'); reveal(rule, 420);
      h.after(rule);
    }
    var sub = inner.querySelector('.subtitle');
    if(sub) sub.style.margin = '';
    if(f.heroNum){ sec.appendChild(deco('div','cmp-hero-num', f.heroNum)); }
  }

  /* ---------- T3 numbered rows / T3 statement ---------- */
  function rows(inner, f){
    var ul = inner.querySelector('ul.bullets');
    if(!ul) return;
    ul.classList.add('cmp-rows','cmp-rows--rule');
    Array.prototype.forEach.call(ul.children, function(li, i){
      wrapChildren(li, 'cmp-row-txt');
      var mark = deco('span','cmp-row-mark', '');
      li.insertBefore(mark, li.firstChild);
    });
  }
  function statement(inner){
    var ul = inner.querySelector('ul.bullets');
    if(ul) ul.classList.add('cmp-statement');
  }

  /* ---------- T2 quote-stack / quote-solo ---------- */
  function quoteStack(inner, solo){
    var pq = inner.querySelector('.pullquote');
    if(!pq) return;
    pq.classList.add('cmp-quote');
    var bar = deco('span','cmp-quote-bar'); reveal(bar, 160);
    pq.insertBefore(bar, pq.firstChild);
    var ul = pq.parentNode.querySelector(':scope > ul.bullets');
    if(ul && !solo){
      var hr = deco('div','cmp-quote-rule'); reveal(hr, 260);
      pq.after(hr);
      ul.classList.add('cmp-after-quote');
    }
    if(solo) inner.classList.add('cmp-quote-solo');
  }

  /* ---------- T4 split frame ---------- */
  function frame(inner, f){
    var grid = inner.querySelector('.split-grid');
    if(!grid) return;
    grid.classList.add('cmp-split');
    var photo = grid.querySelector('.split-media .photo');
    if(!photo) return;
    var holder = photo.parentNode; /* outer div from buildPhoto */
    holder.classList.add('cmp-frame');
    if(f.plate === 'card') holder.classList.add('cmp-frame--card');
    var box = mk('div','cmp-frame-box');
    photo.before(box); box.appendChild(photo);          /* move, not copy */
    box.appendChild(deco('span','cmp-frame-offset'));
    var call = photo.querySelector('.photo-callout');
    if(call){ call.classList.add('cmp-pop'); reveal(call, 900); }
  }

  /* ---------- T5 figure plate ---------- */
  function figure(inner, f){
    var body = inner.querySelector('.stack-body');
    if(!body) return;
    var photo = body.querySelector('.photo');
    if(!photo) return;
    var holder = photo.parentNode;
    holder.classList.add('cmp-plate', f.plate === 'card' ? 'cmp-plate--card' : 'cmp-plate--flat');
    body.classList.add('cmp-figure-body');
    if(!body.querySelector('ul,.pullquote')) body.classList.add('cmp-figure-only');
  }

  /* ---------- T6 versus ---------- */
  function versus(sec, inner){
    var grid = inner.querySelector('.compare-grid');
    if(!grid) return;
    grid.classList.add('cmp-versus');
    var panels = grid.querySelectorAll(':scope > .compare-panel');
    if(panels.length === 2){
      panels[0].classList.add('cmp-from-left');
      panels[1].classList.add('cmp-from-right');
      var vs = deco('div','cmp-vs','vs'); reveal(vs, 520);
      panels[0].after(vs);
    }
    var badge = inner.querySelector(':scope > .badge-corner');
    if(badge){ badge.classList.add('cmp-badge-late'); badge.style.transitionDelay = '900ms'; }
  }

  /* ---------- T7 agenda ---------- */
  function agenda(inner){
    var list = inner.querySelector('.agenda-list');
    if(!list) return;
    list.classList.add('cmp-agenda');
    Array.prototype.forEach.call(list.querySelectorAll('.agenda-row'), function(row, i){
      var hair = deco('span','cmp-hair'); reveal(hair, 140 + i*140);
      row.insertBefore(hair, row.firstChild);
      var d = row.querySelector('.agenda-detail'); if(d) d.classList.add('cmp-pill');
    });
    var src = inner.querySelector(':scope > .source'); if(src) src.classList.add('cmp-agenda-source');
  }

  /* ---------- T8 blank ---------- */
  function blankEdge(inner){
    var card = inner.querySelector('.blank-card');
    if(!card) return;
    card.classList.add('cmp-blank');
    Array.prototype.forEach.call(card.querySelectorAll('.blank-fill'), function(fill, i){
      wrapChildren(fill, 'cmp-fill-txt');
      fill.style.setProperty('--cmp-fill-delay', (700 + i*400) + 'ms');
    });
  }

  /* ---------- T9 closing ---------- */
  function closing(sec, inner, f){
    inner.classList.add('cmp-closing');
    if(f.closingMark) sec.appendChild(deco('div','cmp-closing-mark', f.closingMark));
  }

  function enhance(sec){
    if(sec.dataset.cmp) return;
    var i = +sec.dataset.index, f = fieldsFor(i);
    if(!f.variant && !f.media) return;
    var inner = sec.querySelector('.slide-inner');
    if(!inner) return;
    sec.dataset.cmp = '1';
    if(f.variant) sec.classList.add('v-' + f.variant);
    switch(f.variant){
      case 'hero': hero(sec, inner, f); break;
      case 'rows': rows(inner, f); break;
      case 'statement': statement(inner); break;
      case 'quote-stack': quoteStack(inner, false); break;
      case 'quote-solo': quoteStack(inner, true); break;
      case 'versus': versus(sec, inner); break;
      case 'agenda-xl': agenda(inner); break;
      case 'blank-edge': blankEdge(inner); break;
      case 'closing': closing(sec, inner, f); break;
    }
    if(f.media === 'frame') frame(inner, f);
    if(f.media === 'figure') figure(inner, f);
    /* slide already active (initial load): show the new reveal items too */
    if(sec.classList.contains('active')){
      requestAnimationFrame(function(){
        sec.querySelectorAll('.reveal-item').forEach(function(r){ r.classList.add('in'); });
      });
    }
  }

  function run(){ document.querySelectorAll('#deck > section.slide').forEach(enhance); }
  run();
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  window.DeckComponents = { run: run };
})();

</script>
<script>/* ==== motion.js ==== */
/* SPM381 Week 6 — "Matchday Editorial" motion layer (deck-motion-designer).
   Load AFTER the engine script. Never changes text content: titles are only
   wrapped in mask spans (textContent stays identical). Hooks:
   - MutationObserver on .slide class changes (active added/removed)
   - #sectionLabel text (read in the same tick) to decide wipe vs cross-fade
   - #counter / #pageNum / #sectionLabel / #progressFill get a .m-tick pulse */
(function(){
  'use strict';
  var deck = document.getElementById('deck');
  if(!deck) return;
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function reduced(){ return (mq && mq.matches) || root.classList.contains('reduced'); }

  /* ---------- helpers ---------- */
  function setMd(el, ms){ if(el) el.style.setProperty('--md', Math.round(ms)+'ms'); }
  function q(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }

  // Wrap an element's child nodes in mask spans without changing textContent.
  function maskTitle(h){
    if(h.classList.contains('m-split')) return;
    var mask = document.createElement('span'); mask.className = 'm-mask';
    var rise = document.createElement('span'); rise.className = 'm-rise';
    while(h.firstChild) rise.appendChild(h.firstChild);
    mask.appendChild(rise); h.appendChild(mask);
    h.classList.add('m-split');
  }
  function maskWords(h, startMs, stepMs){
    if(h.classList.contains('m-words')) return 0;
    var text = h.textContent;
    if(h.children.length) return 0; // only plain-text titles
    var parts = text.split(/(\s+)/), n = 0;
    h.textContent = '';
    parts.forEach(function(p){
      if(!p) return;
      if(/^\s+$/.test(p)){ h.appendChild(document.createTextNode(p)); return; }
      var w = document.createElement('span'); w.className = 'm-w';
      var wi = document.createElement('span'); wi.className = 'm-wi';
      wi.textContent = p;
      wi.style.setProperty('--mw', (startMs + n*stepMs)+'ms');
      w.appendChild(wi); h.appendChild(w); n++;
    });
    if(h.textContent !== text){ h.textContent = text; return 0; } // safety: never alter text
    h.classList.add('m-words');
    return n;
  }
  function wrapFill(f){
    if(f.querySelector('.m-fill-text')) return;
    var s = document.createElement('span'); s.className = 'm-fill-text';
    while(f.firstChild) s.appendChild(f.firstChild);
    f.appendChild(s);
  }

  /* ---------- per-slide choreography (delays in ms, before --m-base) ---------- */
  function treatment(s){
    if(s.querySelector('h1.title-hero') && s.querySelector('.closing-wrap')) return 'closing';
    if(s.querySelector('h1.title-hero')) return 'hero';
    if(s.querySelector('.compare-grid')) return 'compare';
    if(s.querySelector('.agenda-list')) return 'agenda';
    if(s.querySelector('.blank-card')) return 'blank';
    if(s.querySelector('.split-grid')) return 'split';
    if(s.querySelector('.pullquote')) return 'quote';
    if(s.querySelector('.photo')) return 'figure';
    return 'bullets';
  }

  function choreograph(s){
    if(s.dataset.mReady) return;
    s.dataset.mReady = '1';
    var t = treatment(s);
    s.setAttribute('data-m', t);
    var allowMask = !reduced();

    if(t === 'hero'){
      var h = s.querySelector('h1.title-hero');
      var n = allowMask ? maskWords(h, 120, 90) : 0;
      h.style.setProperty('--mr', (120 + n*90 + 150)+'ms');
      setMd(s.querySelector('.kicker'), 0);
      setMd(s.querySelector('.subtitle'), 260 + n*90);
      setMd(s.querySelector('.meta-badge'), 380 + n*90);
      return;
    }
    if(t === 'closing'){
      var hc = s.querySelector('h1.title-hero');
      if(allowMask) maskWords(hc, 80, 90);
      var rules = q('.rule', s);
      rules.forEach(function(r){ setMd(r, 300); });
      setMd(s.querySelector('.subtitle'), 420);
      return;
    }

    // shared header: kicker -> title (+rule) -> subhead
    setMd(s.querySelector('.kicker'), 0);
    var title = s.querySelector('h1.title-slide');
    if(title){ if(allowMask) maskTitle(title); setMd(title, 60); }
    var sub = s.querySelector('.subhead'); setMd(sub, 180);

    var cursor = 300;
    var pq = s.querySelector('.pullquote');
    if(pq){ setMd(pq, cursor - 40); cursor += 140; }

    q('ul.bullets', s).forEach(function(ul){
      q(':scope > li', ul).forEach(function(li, i){ setMd(li, cursor + Math.min(i, 6)*80); });
    });

    if(t === 'compare'){
      q('.compare-panel', s).forEach(function(p, i){ setMd(p, 280 + i*140); });
    }
    if(t === 'agenda'){
      q('.agenda-row', s).forEach(function(r, i){ setMd(r, 200 + i*140 + 150); });
      setMd(s.querySelector('.source'), 900);
      return;
    }
    if(t === 'blank'){
      setMd(s.querySelector('.blank-card'), 160);
      q('.blank-fill', s).forEach(function(f, i){ wrapFill(f); setMd(f, 450 + i*280); });
      setMd(s.querySelector('.blank-hint'), 1000);
      return;
    }
    q('.photo', s).forEach(function(p){ setMd(p, t === 'split' ? 260 : (s.querySelector('ul.bullets li, .pullquote') ? 360 : 200)); });
    q('.source', s).forEach(function(x){ setMd(x, 800); });
  }

  /* ---------- wipe panel ---------- */
  var wipe = document.querySelector('.wipe');
  if(!wipe){ wipe = document.createElement('div'); wipe.className = 'wipe'; wipe.setAttribute('aria-hidden','true'); document.body.appendChild(wipe); }
  var wipeTimer = 0;
  function runWipe(){
    wipe.classList.remove('go'); void wipe.offsetWidth; wipe.classList.add('go');
    clearTimeout(wipeTimer);
    wipeTimer = setTimeout(function(){ wipe.classList.remove('go'); }, 700);
  }

  /* ---------- chrome ticks ---------- */
  function tick(el){ if(!el) return; el.classList.remove('m-tick'); void el.offsetWidth; el.classList.add('m-tick'); }
  var counter = document.getElementById('counter');
  var pageNum = document.getElementById('pageNum');
  var sectionLabel = document.getElementById('sectionLabel');
  var progress = document.getElementById('progressFill');

  /* ---------- transitions ---------- */
  var slides = q('.slide', deck);
  slides.forEach(choreograph);
  var lastSection = sectionLabel ? sectionLabel.textContent : '';
  var leaveTimers = new WeakMap();

  function onChange(entering, leaving){
    var sec = sectionLabel ? sectionLabel.textContent : '';
    var sectionChange = sec !== lastSection;
    var doWipe = sectionChange && !reduced() && leaving.length > 0;
    if(sectionChange) tick(sectionLabel);
    lastSection = sec;

    leaving.forEach(function(s){
      clearTimeout(leaveTimers.get(s));
      s.classList.add('m-leaving');
      s.classList.toggle('m-out-x', doWipe);
      s.classList.remove('m-wipe-in');
      leaveTimers.set(s, setTimeout(function(){ s.classList.remove('m-leaving','m-out-x'); }, 460));
    });
    if(entering){
      clearTimeout(leaveTimers.get(entering));
      entering.classList.remove('m-leaving','m-out-x');
      choreograph(entering);
      entering.classList.toggle('m-wipe-in', doWipe);
      if(doWipe) runWipe();
      tick(counter); tick(pageNum); tick(progress);
    }
  }

  var mo = new MutationObserver(function(recs){
    var entering = null, leaving = [];
    recs.forEach(function(r){
      var el = r.target;
      if(!el.classList || !el.classList.contains('slide')) return;
      var was = /(^|\s)active(\s|$)/.test(r.oldValue || '');
      var is = el.classList.contains('active');
      if(is && !was) entering = el;
      else if(was && !is && leaving.indexOf(el) < 0) leaving.push(el);
    });
    if(entering || leaving.length) onChange(entering, leaving);
  });
  mo.observe(deck, {subtree:true, attributes:true, attributeFilter:['class'], attributeOldValue:true});

  root.classList.add('m-on');
})();

</script>
<script>/* ==== background.js ==== */
/* SPM381 Week 6 — ambient background layer (deck-background-artist).
   Injects .bga under the deck and cross-fades a per-section tint whenever
   the active slide changes. Reads only the DOM; never touches slide content.
   Section is taken from #sectionLabel text (so it stays right after the
   integrator fixes the SECTIONS offset); falls back to slide index. */
(function(){
  'use strict';
  var TINTS = ['rust','sage','amber','ink'];
  var SECTION_TINT = {
    'Opening':'rust',
    'Defining Sport Consumer Behavior':'rust',
    'Who Are Sport Consumers?':'sage',
    'Understanding Consumer Behavior':'amber',
    'Models & Theories':'ink',
    'Identity & Social Identity Theory':'rust',
    'Attitude Theory':'sage',
    'Theory of Planned Behavior':'amber',
    'Closing':'rust'
  };
  var LINES_SVG =
    '<svg viewBox="0 0 1400 460" preserveAspectRatio="none" aria-hidden="true">' +
      '<line x1="0" y1="430" x2="1400" y2="430"/>' +
      '<line x1="0" y1="380" x2="1400" y2="380"/>' +
      '<line x1="700" y1="300" x2="700" y2="460"/>' +
      '<circle cx="700" cy="460" r="120"/>' +
      '<path d="M120 460 L120 330 L330 330 L330 460"/>' +
      '<path d="M1070 460 L1070 330 L1280 330 L1280 460"/>' +
      '<line class="accent" x1="0" y1="405" x2="1400" y2="405"/>' +
    '</svg>';

  function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

  function init(){
    if(document.querySelector('.bga')) return;
    var root = document.createElement('div');
    root.className = 'bga';
    root.setAttribute('aria-hidden','true');
    var html = '<div class="bga-field f1"></div><div class="bga-field f2"></div>';
    TINTS.forEach(function(t){ html += '<div class="bga-tint t-'+t+'"></div>'; });
    html += '<div class="bga-lines">'+LINES_SVG+'</div><div class="bga-rule"></div>';
    root.innerHTML = html;
    document.body.insertBefore(root, document.body.firstChild);

    var deck = document.getElementById('deck') || document.querySelector('.deck');
    if(!deck) return;
    var label = document.getElementById('sectionLabel');
    var tintEls = {};
    TINTS.forEach(function(t){ tintEls[t] = root.querySelector('.t-'+t); });
    var lastKey = null;

    function update(){
      var slides = deck.querySelectorAll('.slide');
      var active = deck.querySelector('.slide.active');
      if(!active) return;
      var idx = Array.prototype.indexOf.call(slides, active);
      var sec = label ? (label.textContent || '').trim() : '';
      var mode = (idx === 0 || idx === slides.length-1) ? 'hero' : 'body';
      var tint = SECTION_TINT[sec] || (mode === 'hero' ? 'rust' : TINTS[(sec ? hash(sec) : Math.floor(idx/5)) % TINTS.length]);
      var key = tint+'|'+mode;
      if(key === lastKey) return;
      lastKey = key;
      root.setAttribute('data-mode', mode);
      root.setAttribute('data-tint', tint);
      TINTS.forEach(function(t){ tintEls[t].classList.toggle('on', t === tint); });
    }

    var queued = false;
    function schedule(){ if(queued) return; queued = true; requestAnimationFrame(function(){ queued = false; update(); }); }
    new MutationObserver(schedule).observe(deck, {subtree:true, attributes:true, attributeFilter:['class']});
    if(label) new MutationObserver(schedule).observe(label, {childList:true, characterData:true, subtree:true});
    update();
  }

  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>

  var RE = /(?:^|\/)(p\d+)-graphic\.svg(?:[?#].*)?$/;

  /* The original <img> stays in the DOM as an invisible layout sizer, so every deck CSS rule
   * (max-height, width, object-fit:contain) keeps governing the box. The SVG is laid exactly
   * over the img's box; preserveAspectRatio "meet" == object-fit:contain, so it renders identically. */
  var ro = ('ResizeObserver' in window) ? new ResizeObserver(function(es){ es.forEach(function(e){ place(e.target); }); }) : null;
  function place(img){

  function inlineAll(root){
    var imgs = (root||document).querySelectorAll('img[src$="-graphic.svg"]');
    Array.prototype.forEach.call(imgs, function(img){
      if(img.__inlineSvg) return;

      tmp.innerHTML = SVGS[m[1]].trim();
      var svg = tmp.querySelector('svg');
      if(!svg) return;
      svg.removeAttribute('width'); svg.removeAttribute('height');
      svg.classList.add('inline-graphic');
      svg.setAttribute('data-src', img.getAttribute('src'));

      svg.style.display = 'block';
      svg.style.pointerEvents = 'none';

  function sync(slide){
    var on = slide.classList.contains('active');
    var svgs = slide.querySelectorAll('svg.inline-graphic');
    Array.prototype.forEach.call(svgs, function(svg){

  function init(){

    var mo = new MutationObserver(function(recs){

  function load(){

    Promise.all(Object.keys(SVGS).map(function(k){
      return fetch(ANIM_BASE + k + '-graphic.svg').then(function(r){ if(r.ok) return r.text(); })
        .then(function(t){ if(t && t.indexOf('<svg')>-1) SVGS[k]=t; }).catch(function(){});
    })).then(init, init);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load);
  else load();
})();

<script>
(function(){
  var bd=document.getElementById('lightboxBackdrop'), lim=document.getElementById('lightboxImg');
  function open(src,alt){ lim.src=src; lim.alt=alt||''; bd.classList.add('open'); }
  function close(){ bd.classList.remove('open'); }
  function srcOf(photo){ var im=photo.querySelector('img'); return im ? im.getAttribute('src') : null; }
  function addButtons(){
    document.querySelectorAll('#deck .photo').forEach(function(p){
      if(p.querySelector('.photo-zoom') || !srcOf(p)) return;
      var b=document.createElement('button'); b.className='photo-zoom'; b.type='button';
      b.setAttribute('aria-label','Enlarge image'); b.title='Enlarge image'; b.textContent='+';
      p.appendChild(b);
    });
  }
  document.addEventListener('click', function(e){
    var p=e.target.closest && e.target.closest('#deck .photo');
    if(p && (e.target.closest('.photo-zoom') || e.target.tagName==='IMG' || e.target.closest('svg'))){
      var s=srcOf(p); if(!s) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      open(s, (p.querySelector('img')||{}).alt);
    }
  }, true);
  bd.addEventListener('click', function(e){ e.stopPropagation(); close(); });
  document.addEventListener('keydown', function(e){
    if(!bd.classList.contains('open')) return;
    e.stopPropagation(); e.stopImmediatePropagation();
    if(e.key==='Escape') close();
  }, true);
  addButtons(); setTimeout(addButtons, 800); setTimeout(addButtons, 2500);
})();
</script>
