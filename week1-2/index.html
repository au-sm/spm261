<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPM 261 &middot; Current &amp; Future Trends in Sport Management &mdash; Part II</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

:root{
  --bg:#0b1220;
  --bg2:#0e1728;
  --surface:#141f38;
  --surface2:#1a2744;
  --paper:#f5f1e7;
  --paper-ink:#1b1710;
  --ink:#f3f0e8;
  --muted:rgba(243,240,232,.62);
  --muted2:rgba(243,240,232,.4);
  --rule:rgba(243,240,232,.14);
  --gold:#dba548;
  --gold-soft:rgba(219,165,72,.16);
  --blue:#6c93d6;
  --teal:#4fc3a8;
  --green:#a3cf5e;
  --coral:#ec6a5c;
  --violet:#c88bd8;
  --sand:#e7dcc2;
  --font-display: Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','Times New Roman',serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono: ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --ease: cubic-bezier(.22,.61,.36,1);
  --dur: .7s;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.bg-wash{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 600px at 12% -10%, rgba(219,165,72,.10), transparent 60%),
    radial-gradient(ellipse 1100px 800px at 110% 110%, rgba(108,147,214,.10), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg) 40%);
}
.deck{position:fixed;inset:0;z-index:1;}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:translateY(26px) scale(.985);
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur);
  visibility:hidden;
  pointer-events:none;
  padding: clamp(24px,4vh,56px) clamp(24px,5vw,96px);
}
.slide.active{
  opacity:1;transform:translateY(0) scale(1);
  visibility:visible;pointer-events:auto;z-index:2;transition-delay:0s;
}
.slide-inner{width:100%;max-width:1360px;max-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:clamp(12px,1.7vh,18px);overflow:auto;padding-right:2px;zoom:var(--zoom,1);}
.slide-inner::-webkit-scrollbar{width:6px;height:6px;}
.slide-inner::-webkit-scrollbar-thumb{background:rgba(219,165,72,.3);border-radius:3px;}
.slide-inner::-webkit-scrollbar-track{background:transparent;}

/* chrome */
.chrome-top{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:16px;
  padding:16px clamp(20px,4vw,48px) 0;
  pointer-events:none;
}
.brand{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.brand b{color:var(--gold);font-weight:600;}
.progress-track{flex:1;height:2px;background:var(--rule);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .5s var(--ease);}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);white-space:nowrap;}
.counter{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;min-width:52px;text-align:right;}

.chrome-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,48px) 20px;
  pointer-events:none;
}
.navbtn{
  pointer-events:auto;
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--rule);background:rgba(20,31,56,.7);backdrop-filter:blur(6px);
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .25s ease, border-color .25s ease, transform .2s ease;
}
.navbtn:hover{background:var(--gold-soft);border-color:var(--gold);transform:translateY(-2px);}
.navbtn:active{transform:translateY(0);}
.navbtn svg{width:18px;height:18px;}
.navbtn:disabled{opacity:.25;cursor:default;transform:none;}
.hint{
  pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted2);opacity:1;transition:opacity 1s ease;z-index:19;
}
.hint.hide{opacity:0;}
.notes-toggle{
  pointer-events:auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:5px 12px;cursor:pointer;flex-shrink:0;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted);transition:border-color .2s ease,color .2s ease;
}
.notes-toggle:hover{border-color:var(--gold);color:var(--gold);}
.home-btn{text-decoration:none;display:inline-flex;align-items:center;}

.zoom-controls{pointer-events:auto;display:flex;align-items:center;flex-shrink:0;}
.zoom-btn{
  background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;
  font-family:var(--font-mono);font-size:13px;line-height:1;
  padding:5px 10px;transition:border-color .2s ease,color .2s ease;
}
.zoom-btn:hover{border-color:var(--gold);color:var(--gold);}
.zoom-controls .zoom-btn + .zoom-btn{margin-left:-1px;}
.zoom-controls .zoom-btn:first-child{border-radius:999px 0 0 999px;}
.zoom-controls .zoom-btn:last-child{border-radius:0 999px 999px 0;}
.zoom-reset{min-width:46px;text-align:center;font-size:10px;letter-spacing:.03em;}
.zoom-btn:disabled{opacity:.3;cursor:default;}
.zoom-btn:disabled:hover{border-color:var(--rule);color:var(--muted);}

/* reveal primitives */
.reveal-item{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.slide.active .reveal-item.in{opacity:1;transform:translateY(0);}

.kicker{font-family:var(--font-mono);font-size:clamp(10.5px,1vw,12.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;}
.kicker::before{content:'';display:inline-block;width:22px;height:1px;background:var(--gold);margin-right:10px;vertical-align:middle;}

h1.disp{font-family:var(--font-display);font-weight:400;line-height:1.06;margin:0;color:var(--ink);letter-spacing:-.01em;}
.title-hero{font-size:clamp(34px,5.6vw,68px);}
.title-slide{font-size:clamp(23px,3vw,38px);}
.title-slide.long{font-size:clamp(19px,2.3vw,29px);}
.subtitle{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:clamp(15px,1.7vw,20px);margin:6px 0 0;}
.meta-badge{display:inline-block;margin-top:20px;padding:7px 16px;border:1px solid var(--rule);border-radius:999px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);}

.lede{font-family:var(--font-display);font-style:italic;color:var(--sand);font-size:clamp(15px,1.5vw,19px);margin:0;}

ul.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;}
ul.bullets li{
  font-size:clamp(14px,1.25vw,17px);line-height:1.5;color:var(--ink);
  padding-left:22px;position:relative;
}
ul.bullets li::before{content:'';position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--gold);}
ul.bullets li.q{color:var(--sand);font-style:italic;font-family:var(--font-display);font-size:clamp(16px,1.5vw,21px);}
ul.bullets li.q::before{background:var(--coral);}
ul.bullets li.sub{padding-left:34px;color:var(--muted);font-size:.92em;}
ul.bullets li.sub::before{width:5px;height:5px;background:var(--muted2);left:14px;}

.source{font-family:var(--font-mono);font-size:11.5px;color:var(--muted2);margin-top:2px;word-break:break-word;}
.source::before{content:'Source — ';color:var(--muted);}
.link-chip{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:12px;color:var(--blue);text-decoration:none;border:1px solid var(--rule);border-radius:999px;padding:6px 14px;word-break:break-all;transition:border-color .2s ease,color .2s ease;}
.link-chip:hover{border-color:var(--blue);color:#8fb0e6;}
.link-chip::before{content:'↗';flex-shrink:0;}

/* media / exhibits */
.media-grid{display:grid;gap:18px;align-items:start;}
.media-grid.cols-1{grid-template-columns:1fr;}
.media-grid.cols-2{grid-template-columns:1fr 1fr;}
.media-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.exhibit{position:relative;border-radius:14px;overflow:hidden;}
.exhibit .kb{overflow:hidden;display:block;border-radius:inherit;max-height:44vh;}
.exhibit img{display:block;width:100%;height:auto;max-height:44vh;object-fit:contain;opacity:0;transform:scale(1.07);transition:opacity .9s var(--ease), transform 1.3s var(--ease);}
.slide.active .exhibit.in img{opacity:1;transform:scale(1);}
.exhibit.frame{background:var(--surface);padding:9px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);border:1px solid var(--rule);}
.exhibit.frame img{border-radius:6px;}
.exhibit.paper{background:var(--paper);padding:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);}
.exhibit.paper img{border-radius:2px;}
.exhibit.solo{max-width:720px;margin:0 auto;}
.exhibit .cap{font-family:var(--font-mono);font-size:11px;letter-spacing:.02em;margin-top:9px;padding:0 2px;line-height:1.4;}
.exhibit.paper .cap{color:#8a7f63;}
.exhibit.frame .cap{color:var(--muted);}

@keyframes kenburns{ from{transform:scale(1);} to{transform:scale(1.06);} }
.slide.active .kb.kb-anim{animation:kenburns 16s ease-out forwards;}

.two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center;}
.two-col.reverse{grid-template-columns:1fr 1.1fr;}

@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .15s linear !important;transform:none !important;}
  .reveal-item{transition:none !important;opacity:1 !important;transform:none !important;}
  .exhibit img{transition:none !important;opacity:1 !important;transform:none !important;}
  .kb.kb-anim{animation:none !important;}
  table.data tbody tr{transition:none !important;opacity:1 !important;transform:none !important;}
  .vbar-fill, .gbar-fill, .donut-seg, .obj-card, .venn-circle{transition:none !important;}
}
.reduced .slide{transition:opacity .15s linear !important;transform:none !important;}
.reduced .reveal-item{transition:none !important;opacity:1 !important;transform:none !important;}
.reduced .exhibit img{transition:none !important;opacity:1 !important;transform:none !important;}
.reduced .kb.kb-anim{animation:none !important;}
.reduced table.data tbody tr{transition:none !important;opacity:1 !important;transform:none !important;}
.reduced .vbar-fill, .reduced .gbar-fill, .reduced .donut-seg, .reduced .obj-card, .reduced .venn-circle{transition:none !important;}

/* ================= topic nav (breadcrumb) ================= */
.topic-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;}
.topic-chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted2);padding:4px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
.topic-chip.done{color:var(--muted);}
.topic-chip.done::before{content:'✓ ';color:var(--teal);}
.topic-chip.active{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);font-weight:600;}
.topic-sep{color:var(--rule);font-size:10px;}

/* ================= custom slide types ================= */

/* cover-simple */
.cover-simple{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;height:100%;gap:6px;position:relative;}
.cover-logo-wash{position:absolute;right:-4%;top:50%;transform:translateY(-50%);width:min(46vw,560px);opacity:.05;pointer-events:none;filter:invert(1);}
.cover-logo-wash img{width:100%;display:block;opacity:0;transition:opacity 1.6s var(--ease);}
.slide.active .cover-logo-wash.in img{opacity:1;}
.cover-simple .title-hero{max-width:900px;}
.part-badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:18px;padding:7px 16px;border:1px solid var(--gold);border-radius:999px;font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);}
.part-badge::before{content:'▶';font-size:9px;}

/* hub recap */
.hub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:6px;}
.hub-card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
.hub-card.done{opacity:.62;}
.hub-card.today{border-color:var(--gold);box-shadow:0 18px 40px -22px rgba(219,165,72,.5);}
.hub-num{font-family:var(--font-mono);font-size:11px;color:var(--muted2);letter-spacing:.08em;}
.hub-card.today .hub-num{color:var(--gold);}
.hub-title{font-family:var(--font-display);font-size:16.5px;color:var(--ink);line-height:1.3;}
.hub-tag{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);}
.hub-card.today .hub-tag{color:var(--gold);}
.hub-part-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:14px 0 -4px;}
.hub-part-label:first-child{margin-top:0;}
@media (max-width:880px){.hub-grid{grid-template-columns:1fr 1fr;}}

/* objectives */
.objectives-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:8px;}
.obj-card{
  aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:18px;font-family:var(--font-display);font-size:clamp(13px,1.25vw,16.5px);color:var(--ink);
  border:1.5px solid var(--rule);background:var(--surface);
  transform:scale(.7);opacity:0;transition:transform .55s var(--ease),opacity .55s var(--ease);
}
.slide.active .obj-card.in{transform:scale(1);opacity:1;}
.obj-card:nth-child(1){border-color:var(--blue);}
.obj-card:nth-child(2){border-color:var(--teal);}
.obj-card:nth-child(3){border-color:var(--coral);}
.obj-card:nth-child(4){border-color:var(--violet);}
@media (max-width:880px){.objectives-grid{grid-template-columns:1fr 1fr;}}

/* chart row */
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:4px;}
.chart-card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px 20px 14px;}
.chart-card h4{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:500;line-height:1.4;}
@media (max-width:880px){.chart-row{grid-template-columns:1fr;}}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;}
.donut-wrap svg{flex:0 0 auto;width:150px;height:150px;transform:rotate(-90deg);}
.donut-seg{transition:stroke-dashoffset 1.1s var(--ease);}
.donut-center-label{font-family:var(--font-display);font-size:22px;fill:var(--ink);}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;}
.donut-legend .row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);opacity:0;transform:translateX(6px);transition:opacity .5s ease,transform .5s ease;}
.donut-legend .row.in{opacity:1;transform:translateX(0);}
.donut-legend .sw{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.donut-legend .val{font-family:var(--font-mono);color:var(--ink);margin-left:auto;padding-left:8px;flex-shrink:0;}

/* growth bars (grouped) */
.gbar-groups{display:flex;justify-content:space-between;align-items:flex-end;height:150px;gap:10px;}
.gbar-group{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end;}
.gbar-set{display:flex;align-items:flex-end;gap:4px;height:120px;}
.gbar-col{width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.gbar-val{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin-bottom:3px;white-space:nowrap;}
.gbar-fill{width:100%;border-radius:3px 3px 0 0;height:0;transition:height 1s var(--ease);}
.gbar-yr{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:8px;text-align:center;}
.gbar-legend{display:flex;gap:16px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
.gbar-legend .row{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--muted);}
.gbar-legend .sw{width:9px;height:9px;border-radius:2px;}

/* single series bar chart (nevada wagering) */
.vbar-card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px clamp(16px,3vw,28px) 14px;}
.vbar-unit{font-family:var(--font-mono);font-size:10.5px;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
.vbars{display:flex;align-items:flex-end;gap:clamp(3px,.6vw,7px);height:clamp(150px,22vh,220px);border-bottom:1px solid var(--rule);padding-bottom:2px;}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}
.vbar-val{font-family:var(--font-mono);font-size:8.5px;color:var(--sand);margin-bottom:3px;white-space:nowrap;transform-origin:bottom center;}
.vbar-fill{width:100%;background:linear-gradient(180deg,var(--gold),#a97a2e);border-radius:3px 3px 0 0;height:0;transition:height 1.1s var(--ease);}
.vbar-yr{font-family:var(--font-mono);font-size:8.5px;color:var(--muted2);margin-top:7px;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;}
@media (max-width:880px){.vbar-yr{font-size:7.5px;} .vbar-val{font-size:7.5px;}}

/* revenue stats */
.rev-intro{font-size:clamp(13.5px,1.2vw,16px);color:var(--ink);line-height:1.55;max-width:900px;}
.rev-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px;}
.rev-card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;}
.rev-card .lbl{font-size:11.5px;color:var(--muted);line-height:1.35;min-height:44px;}
.rev-card .val{font-family:var(--font-display);font-size:clamp(24px,2.6vw,34px);color:var(--gold);}
.rev-total{margin-top:2px;text-align:center;background:var(--gold-soft);border:1px solid var(--gold);border-radius:14px;padding:12px;font-family:var(--font-mono);font-size:13px;color:var(--gold);letter-spacing:.02em;}
.rev-total b{font-family:var(--font-display);font-size:19px;margin-left:8px;}
.rev-table-wrap{margin-top:6px;}
@media (max-width:880px){.rev-stats{grid-template-columns:1fr;}}

/* annotated photo */
.annotated-wrap{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--rule);box-shadow:0 24px 60px -20px rgba(0,0,0,.55);max-width:640px;margin:0 auto;}
.annotated-wrap img{display:block;width:100%;height:auto;max-height:48vh;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1s var(--ease),transform 1.3s var(--ease);}
.slide.active .annotated-wrap.in img{opacity:1;transform:scale(1);}
.photo-tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
.photo-tag{font-family:var(--font-mono);font-size:11.5px;color:var(--sand);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;}

/* job card */
.job-card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:clamp(16px,2.4vw,24px);display:flex;flex-direction:column;gap:12px;}
.job-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.job-company-row{display:flex;align-items:center;gap:10px;}
.job-company-badge{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--gold);border-radius:6px;padding:4px 9px;font-weight:700;}
.job-tagline{font-family:var(--font-mono);font-size:10px;color:var(--muted2);letter-spacing:.04em;}
.job-role{font-family:var(--font-display);font-size:clamp(19px,2.2vw,26px);color:var(--ink);margin:2px 0 0;}
.job-meta{font-size:12.5px;color:var(--muted);}
.job-rating{color:var(--gold);font-family:var(--font-mono);font-size:12px;}
.job-salary-box{text-align:right;flex-shrink:0;}
.job-salary{font-family:var(--font-display);font-size:clamp(18px,2vw,24px);color:var(--gold);white-space:nowrap;}
.job-salary-sub{font-size:10.5px;color:var(--muted2);max-width:230px;line-height:1.4;margin-top:4px;}
.job-chips{display:flex;gap:8px;flex-wrap:wrap;}
.job-chip{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;}
.job-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:2px;}
.job-col h5{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;}
.job-more{font-family:var(--font-mono);font-size:10.5px;color:var(--muted2);font-style:italic;margin-top:2px;}
.job-note{font-family:var(--font-display);font-style:italic;font-size:12.5px;color:var(--muted);margin-top:2px;}
@media (max-width:880px){.job-cols{grid-template-columns:1fr;} .job-head{flex-direction:column;} .job-salary-box{text-align:left;}}

/* venn future */
.venn-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,4vw,50px);align-items:center;}
.venn-circles{position:relative;height:340px;max-width:420px;}
.venn-circle{
  position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:16px 20px;font-family:var(--font-display);font-size:13.5px;line-height:1.32;color:var(--ink);
  border:1px solid rgba(243,240,232,.22);background:var(--bg2);
  opacity:0;transform:scale(.75);transition:opacity .7s var(--ease),transform .7s var(--ease);
}
.slide.active .venn-circle.in{opacity:1;transform:scale(1);}
.venn-circle.c1{width:200px;height:200px;left:16px;top:60px;border-color:var(--blue);z-index:1;}
.venn-circle.c2{width:170px;height:170px;left:228px;top:0;border-color:var(--teal);z-index:2;}
.venn-circle.c3{width:190px;height:190px;left:148px;top:142px;border-color:var(--gold);background:rgba(219,165,72,.14);z-index:3;}
.venn-photo{border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--rule);box-shadow:0 24px 60px -20px rgba(0,0,0,.55);}
.venn-photo img{display:block;width:100%;height:auto;max-height:40vh;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1s var(--ease),transform 1.3s var(--ease);}
.slide.active .venn-photo.in img{opacity:1;transform:scale(1);}

.section-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;text-align:center;}
.section-wrap .rule{width:56px;height:1px;background:var(--gold);}
.section-media{display:flex;gap:16px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
.section-media .exhibit{max-width:280px;}

/* closing */
.closing-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;}
.closing-wrap .rule{width:64px;height:1px;background:var(--gold);}
.closing-logo{width:180px;opacity:0;filter:invert(1);transition:opacity 1s var(--ease);margin-top:6px;}
.slide.active .closing-logo.in{opacity:.55;}

/* table reuse */
.table-wrap{background:var(--paper);border-radius:14px;padding:16px 20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);max-height:38vh;overflow:auto;}
table.data{width:100%;border-collapse:collapse;font-family:var(--font-body);color:var(--paper-ink);}
table.data thead th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:#6b6350;border-bottom:2px solid #d9cfb5;padding:7px 10px;position:sticky;top:0;background:var(--paper);
}
table.data thead th:not(:first-child){text-align:right;}
table.data tbody td:not(:first-child){text-align:right;}
table.data tbody td{padding:7px 10px;font-size:13px;border-bottom:1px solid #e7ddc4;}
table.data tbody tr{opacity:0;transform:translateY(6px);transition:opacity .4s ease,transform .4s ease;}
table.data tbody tr.in{opacity:1;transform:translateY(0);}
table.data tfoot td{padding:9px 10px;font-family:var(--font-mono);font-weight:700;font-size:13px;color:#8a5a1c;border-top:2px solid #d9cfb5;}
table.data tfoot td:not(:first-child){text-align:right;}

/* notes panel */
.notes-panel{
  position:fixed;top:0;right:0;height:100%;width:min(420px,86vw);
  background:rgba(10,16,30,.97);backdrop-filter:blur(10px);
  border-left:1px solid var(--rule);z-index:15;
  transform:translateX(100%);transition:transform .45s var(--ease);
  padding:80px 28px 28px;display:flex;flex-direction:column;gap:14px;
}
.notes-panel.open{transform:translateX(0);}
.notes-panel h3{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0;}
.notes-panel p{font-family:var(--font-display);font-size:16px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.notes-panel .close-notes{position:absolute;top:24px;right:24px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;}
.notes-empty{color:var(--muted2);font-style:italic;font-family:var(--font-display);}

.table-wrap::-webkit-scrollbar, .notes-panel::-webkit-scrollbar{width:8px;}
.table-wrap::-webkit-scrollbar-thumb, .notes-panel::-webkit-scrollbar-thumb{background:rgba(219,165,72,.35);border-radius:4px;}

@media (max-width: 880px){
  .media-grid.cols-2, .media-grid.cols-3{grid-template-columns:1fr;}
  .two-col, .two-col.reverse{grid-template-columns:1fr;}
  .chart-row{grid-template-columns:1fr;}
}

(function(){
  const SLIDES = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  const progressFill = document.getElementById('progressFill');
  const counterEl = document.getElementById('counter');

  const zoomResetBtn = document.getElementById('zoomResetBtn');

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced) document.documentElement.classList.add('reduced');

  const SECTIONS = [
    {from:0,to:0,label:'Opening'},
    {from:1,to:1,label:'Recap & Agenda'},
    {from:2,to:5,label:'Sponsorship'},
    {from:6,to:15,label:'Sports Betting'},
    {from:16,to:22,label:'Sports Analytics'},
    {from:23,to:23,label:'Closing'}
  ];
  function sectionFor(i){
    for(const s of SECTIONS){ if(i>=s.from && i<=s.to) return s.label; }
    return '';
  }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function revealItem(node, delayMs){
    node.classList.add('reveal-item');
    node.style.transitionDelay = (delayMs||0)+'ms';
    return node;
  }
  function isQuestion(text){ return /\?\s*$/.test(text.trim()); }
  function escapeHTML(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function linkify(text){
    const parts = String(text).split(/(https?:\/\/[^\s]+)/g);
    return parts.map(p=>{
      if(/^https?:\/\//.test(p)){
        const clean = p.replace(/[.,;]+$/,'');
        return '<a href="'+clean+'" target="_blank" rel="noopener" style="color:var(--blue);">'+escapeHTML(clean)+'</a>';
      }
      return escapeHTML(p);
    }).join('');
  }
  function titleEl(text, delay){
    const cls = 'disp title-slide'+(text.length>52?' long':'')+' reveal-item';
    const h = el('h1',cls, escapeHTML(text));
    revealItem(h, delay||0);
    return h;
  }
  function buildKicker(text){ return el('p','kicker reveal-item', escapeHTML(text)); }

  function buildTopicNav(topic){
    const order = [
      {key:'internship', label:'Internship'},
      {key:'college', label:'College Athletics'},
      {key:'sponsorship', label:'Sponsorship'},
      {key:'analytics', label:'Analytics'}
    ];
    const nav = el('div','topic-nav reveal-item');
    order.forEach((t,i)=>{
      let cls = 'topic-chip';
      if(t.key==='internship' || t.key==='college'){ cls += ' done'; }
      if(t.key===topic){ cls += ' active'; }
      nav.appendChild(el('span',cls, escapeHTML(t.label)));
      if(i<order.length-1){ nav.appendChild(el('span','topic-sep','/')); }
    });
    revealItem(nav,0);
    return nav;
  }

  function buildExhibit(img, delay, extraClass){
    const wrap = el('div','exhibit '+(img.frame||'paper')+(extraClass?' '+extraClass:''));
    wrap.style.transitionDelay = (delay||0)+'ms';
    const kb = el('div','kb');
    const im = document.createElement('img');
    im.src = img.src; im.loading='lazy'; im.alt = img.caption || '';
    if(img.w && img.h) im.style.aspectRatio = img.w+' / '+img.h;
    kb.appendChild(im);
    wrap.appendChild(kb);
    if(img.caption){ wrap.appendChild(el('div','cap', escapeHTML(img.caption))); }
    return wrap;
  }

  function buildBullets(list){
    const ul = el('ul','bullets');
    list.forEach((raw,i)=>{
      let t = raw, cls = '';
      if(t.startsWith('-')){ t = t.slice(1).trim(); cls = 'sub'; }
      else if(isQuestion(t)){ cls = 'q'; }
      const li = el('li', cls);
      li.innerHTML = linkify(t);
      revealItem(li, 90*i);
      ul.appendChild(li);
    });
    return ul;
  }
  function buildSource(text){
    return el('p','source reveal-item', escapeHTML(text));
  }
  function buildLink(link, delay){
    const a = document.createElement('a');
    a.className = 'link-chip reveal-item';
    a.href = link.url; a.target='_blank'; a.rel='noopener';
    a.textContent = link.label;
    revealItem(a, delay||0);
    return a;
  }

  function animateCountUps(container){
    const nums = container.querySelectorAll('.points-badge .n[data-target]');
    nums.forEach(n=>{
      const target = parseFloat(n.dataset.target);
      if(prefersReduced || isNaN(target)){ n.textContent = n.dataset.target; return; }
      const dur = 900; const start = performance.now();
      function frame(t){
        const p = Math.max(0,Math.min(1,(t-start)/dur));
        const eased = 1-Math.pow(1-p,3);
        n.textContent = Math.round(target*eased).toString();
        if(p<1) requestAnimationFrame(frame); else n.textContent = n.dataset.target;
      }
      requestAnimationFrame(frame);
      setTimeout(()=>{ n.textContent = n.dataset.target; }, dur+80);
    });
  }

  // ---------- chart builders ----------
  function buildDonut(spec){
    const wrap = el('div','chart-card');
    wrap.appendChild(el('h4','', escapeHTML(spec.caption)));
    const row = el('div','donut-wrap');
    const size = 150, r = 60, cx=75, cy=75, circ = 2*Math.PI*r;
    const svgNS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(svgNS,'svg');
    svg.setAttribute('viewBox','0 0 150 150');
    const bg = document.createElementNS(svgNS,'circle');
    bg.setAttribute('cx',cx); bg.setAttribute('cy',cy); bg.setAttribute('r',r);
    bg.setAttribute('fill','none'); bg.setAttribute('stroke','rgba(243,240,232,.08)'); bg.setAttribute('stroke-width','20');
    svg.appendChild(bg);
    let cum = 0;
    const segEls = [];
    spec.segments.forEach((seg)=>{
      const c = document.createElementNS(svgNS,'circle');
      c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
      c.setAttribute('fill','none'); c.setAttribute('stroke', seg.color); c.setAttribute('stroke-width','20');
      const segLen = (seg.value/100)*circ;
      c.setAttribute('stroke-dasharray', segLen.toFixed(2)+' '+circ.toFixed(2));
      const offset = circ - (cum/100)*circ;
      c.setAttribute('stroke-dashoffset', circ.toFixed(2));
      c.classList.add('donut-seg');
      c.dataset.finalOffset = offset.toFixed(2);
      svg.appendChild(c);
      segEls.push(c);
      cum += seg.value;
    });
    row.appendChild(svg);
    const legend = el('div','donut-legend');
    spec.segments.forEach((seg,i)=>{
      const r2 = el('div','row');
      r2.style.transitionDelay = (300+i*90)+'ms';
      const sw = el('span','sw'); sw.style.background = seg.color;
      r2.appendChild(sw);
      r2.appendChild(el('span','', escapeHTML(seg.label)));
      r2.appendChild(el('span','val', seg.value+'%'));
      legend.appendChild(r2);
    });
    row.appendChild(legend);
    wrap.appendChild(row);
    return {node:wrap, segEls, legend};
  }

  function buildGrowthChart(spec){
    const wrap = el('div','chart-card');
    wrap.appendChild(el('h4','', escapeHTML(spec.caption)));
    const groups = el('div','gbar-groups');
    const seriesColors = {advertising:'var(--blue)', marketing:'var(--violet)', sponsorship:'var(--gold)'};
    const maxVal = 5;
    const fillEls = [];
    let barIdx = 0;
    spec.years.forEach(y=>{
      const g = el('div','gbar-group');
      const set = el('div','gbar-set');
      ['advertising','marketing','sponsorship'].forEach(k=>{
        const col = el('div','gbar-col');
        col.appendChild(el('div','gbar-val', y[k]+'%'));
        const fill = el('div','gbar-fill');
        fill.style.background = seriesColors[k];
        fill.style.transitionDelay = (barIdx*45)+'ms';
        fill.dataset.h = Math.round((y[k]/maxVal)*100);
        col.appendChild(fill);
        fillEls.push(fill);
        set.appendChild(col);
        barIdx++;
      });
      g.appendChild(set);
      g.appendChild(el('div','gbar-yr', escapeHTML(y.yr)));
      groups.appendChild(g);
    });
    wrap.appendChild(groups);
    const legend = el('div','gbar-legend');
    [['Advertising','var(--blue)'],['Marketing/Promotion','var(--violet)'],['Sponsorship','var(--gold)']].forEach(([label,color])=>{
      const row = el('div','row');
      const sw = el('span','sw'); sw.style.background = color;
      row.appendChild(sw); row.appendChild(el('span','',label));
      legend.appendChild(row);
    });
    wrap.appendChild(legend);
    return {node:wrap, fillEls};
  }

  function buildVBarChart(spec){
    const card = el('div','vbar-card');
    card.appendChild(el('div','vbar-unit', escapeHTML(spec.unit)));
    const bars = el('div','vbars');
    const maxVal = Math.max(...spec.data.map(d=>d.v)) * 1.08;
    const fillEls = [];
    spec.data.forEach((d,i)=>{
      const b = el('div','vbar');
      b.appendChild(el('div','vbar-val', d.v.toFixed(1)));
      const fill = el('div','vbar-fill');
      fill.dataset.h = ((d.v/maxVal)*100).toFixed(1);
      fill.style.transitionDelay = (i*35)+'ms';
      b.appendChild(fill);
      b.appendChild(el('div','vbar-yr', d.yr));
      bars.appendChild(b);
      fillEls.push(fill);
    });
    card.appendChild(bars);
    return {node:card, fillEls};
  }

  const slideEls = SLIDES.map((s,i)=> build(s,i));
  slideEls.forEach(e=> deck.appendChild(e));

  let current = -1;
  let notesOpen = false;

  function resetCharts(e){
    if(e._donut){
      e._donut.segEls.forEach(c=> c.setAttribute('stroke-dashoffset', c.getAttribute('stroke-dasharray').split(' ')[1]));
      e._donut.legend.querySelectorAll('.row').forEach(r=> r.classList.remove('in'));
    }
    if(e._growth){ e._growth.fillEls.forEach(f=> f.style.height='0'); }
    if(e._vbars){ e._vbars.fillEls.forEach(f=> f.style.height='0'); }
    if(e._objCards){ e._objCards.forEach(c=> c.classList.remove('in')); }
    if(e._venn){ e._venn.forEach(c=> c.classList.remove('in')); }
    if(e._vennPhoto){ e._vennPhoto.classList.remove('in'); }
    if(e._annotated){ e._annotated.classList.remove('in'); }
    if(e._coverWash){ e._coverWash.classList.remove('in'); }
    if(e._closingLogo){ e._closingLogo.classList.remove('in'); }
  }
  function fireCharts(e){
    if(e._donut){
      requestAnimationFrame(()=>{
        e._donut.segEls.forEach(c=> c.setAttribute('stroke-dashoffset', c.dataset.finalOffset));
        e._donut.legend.querySelectorAll('.row').forEach(r=> r.classList.add('in'));
      });
    }
    if(e._growth){
      requestAnimationFrame(()=>{
        e._growth.fillEls.forEach(f=>{ f.style.height = f.dataset.h+'%'; });
      });
    }
    if(e._vbars){
      requestAnimationFrame(()=>{
        e._vbars.fillEls.forEach(f=>{ f.style.height = f.dataset.h+'%'; });
      });
    }
    if(e._objCards){ e._objCards.forEach((c,i)=> setTimeout(()=> c.classList.add('in'), 150+i*110)); }
    if(e._venn){ e._venn.forEach(c=> c.classList.add('in')); }
    if(e._vennPhoto){ e._vennPhoto.classList.add('in'); }
    if(e._annotated){ e._annotated.classList.add('in'); }
    if(e._coverWash){ e._coverWash.classList.add('in'); }
    if(e._closingLogo){ e._closingLogo.classList.add('in'); }
  }

  function activate(idx){
    current = idx;
    slideEls.forEach((e,i)=>{
      if(i===idx){
        e.classList.add('active');
      } else {
        e.classList.remove('active');
        e.querySelectorAll('.reveal-item').forEach(r=> r.classList.remove('in'));
        if(e._tableRows) e._tableRows.forEach(r=> r.classList.remove('in'));
        e.querySelectorAll('.exhibit').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.kb').forEach(k=> k.classList.remove('kb-anim'));
        resetCharts(e);
      }
    });
    const activeEl = slideEls[idx];
    requestAnimationFrame(()=>{
      activeEl.querySelectorAll('.reveal-item').forEach(r=> r.classList.add('in'));
      activeEl.querySelectorAll('.exhibit').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.kb').forEach(k=> k.classList.add('kb-anim'));
      if(activeEl._tableRows) activeEl._tableRows.forEach(r=> r.classList.add('in'));
      fireCharts(activeEl);
      animateCountUps(activeEl);
    });

    progressFill.style.width = ((idx)/(SLIDES.length-1)*100).toFixed(2)+'%';
    counterEl.textContent = String(idx+1).padStart(2,'0')+' / '+SLIDES.length;
    sectionLabel.textContent = sectionFor(idx);
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===SLIDES.length-1;

    const notesText = SLIDES[idx].notes;
    if(notesText){
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p></p>';
      notesBody.querySelector('p').textContent = notesText;
      notesToggle.style.opacity = 1;
    } else {
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p class="notes-empty">No speaker notes for this slide.</p>';
      notesToggle.style.opacity = .45;
    }

    location.hash = 's'+(idx+1);
  }

  function next(){ if(current < SLIDES.length-1) activate(current+1); hideHint(); }
  function prev(){ if(current > 0) activate(current-1); hideHint(); }

  let hintHidden = false;
  function hideHint(){ if(!hintHidden){ hint.classList.add('hide'); hintHidden = true; } }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  deck.addEventListener('click', (e)=>{
    if(e.target.closest('.table-wrap')) return;
    if(e.target.closest('a')) return;
    next();
  });

  let wheelLock = false;
  deck.addEventListener('wheel', (e)=>{
    if(e.target.closest('.table-wrap')) return;
    if(wheelLock) return;
    if(Math.abs(e.deltaY) < 12) return;
    wheelLock = true;
    if(e.deltaY > 0) next(); else prev();
    setTimeout(()=>{ wheelLock = false; }, 700);
  }, {passive:true});

  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); activate(0); }
    else if(e.key==='End'){ e.preventDefault(); activate(SLIDES.length-1); }
    else if(e.key==='n' || e.key==='N'){ toggleNotes(); }
    else if(e.key==='Escape'){ if(notesOpen) toggleNotes(); }
    else if(e.key==='+' || e.key==='='){ e.preventDefault(); zoomIn(); }
    else if(e.key==='-' || e.key==='_'){ e.preventDefault(); zoomOut(); }
    else if(e.key==='0'){ e.preventDefault(); zoomReset(); }
  });

  const ZOOM_MIN = 0.75, ZOOM_MAX = 2, ZOOM_STEP = 0.1;
  let zoomLevel = 1;
  try{
    const saved = parseFloat(localStorage.getItem('spm261wk1b_zoom'));
    if(!isNaN(saved) && saved>=ZOOM_MIN && saved<=ZOOM_MAX) zoomLevel = saved;
  }catch(err){}
  function applyZoom(){
    document.documentElement.style.setProperty('--zoom', zoomLevel.toFixed(2));
    zoomResetBtn.textContent = Math.round(zoomLevel*100)+'%';
    zoomOutBtn.disabled = zoomLevel<=ZOOM_MIN;
    zoomInBtn.disabled = zoomLevel>=ZOOM_MAX;
    try{ localStorage.setItem('spm261wk1b_zoom', zoomLevel); }catch(err){}
  }
  function zoomIn(){ zoomLevel = Math.min(ZOOM_MAX, +(zoomLevel+ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomOut(){ zoomLevel = Math.max(ZOOM_MIN, +(zoomLevel-ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomReset(){ zoomLevel = 1; applyZoom(); }
  zoomInBtn.addEventListener('click', (e)=>{ e.stopPropagation(); zoomIn(); });
  zoomOutBtn.addEventListener('click', (e)=>{ e.stopPropagation(); zoomOut(); });
  zoomResetBtn.addEventListener('click', (e)=>{ e.stopPropagation(); zoomReset(); });
  applyZoom();

  function toggleNotes(){
    notesOpen = !notesOpen;
    notesPanel.classList.toggle('open', notesOpen);
  }
  notesToggle.addEventListener('click', toggleNotes);
  document.getElementById('closeNotes').addEventListener('click', toggleNotes);

  setTimeout(hideHint, 5000);

  let startIdx = 0;
  const m = location.hash.match(/s(\d+)/);
  if(m){ const n = parseInt(m[1],10)-1; if(n>=0 && n<SLIDES.length) startIdx = n; }
  activate(startIdx);
})();

</script>
</body>
</html>
