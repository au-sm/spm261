<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPM 261 &middot; Current &amp; Future Trends in Sport Management (Part I)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

:root{
  --bg:#0b1220;
  --bg2:#0e1728;
  --surface:#141f38;
  --surface2:#1a2744;
  --paper:#f5f1e7;
  --paper-ink:#1b1710;
  --ink:#f3f0e8;
  --muted:rgba(243,240,232,.62);
  --muted2:rgba(243,240,232,.4);
  --rule:rgba(243,240,232,.14);
  --gold:#dba548;
  --gold-soft:rgba(219,165,72,.16);
  --blue:#6c93d6;
  --teal:#4fc3a8;
  --green:#a3cf5e;
  --coral:#ec6a5c;
  --violet:#c88bd8;
  --sand:#e7dcc2;
  --font-display: Georgia,'Iowan Old Style','Palatino Linotype','Book Antiqua','Times New Roman',serif;
  --font-body: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono: ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
  --ease: cubic-bezier(.22,.61,.36,1);
  --dur: .7s;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.bg-wash{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 900px 600px at 12% -10%, rgba(219,165,72,.10), transparent 60%),
    radial-gradient(ellipse 1100px 800px at 110% 110%, rgba(108,147,214,.10), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg) 40%);
}
.deck{position:fixed;inset:0;z-index:1;}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;
  transform:translateY(26px) scale(.985);
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur);
  visibility:hidden;
  pointer-events:none;
  padding: clamp(24px,4vh,56px) clamp(24px,5vw,96px);
}
.slide.active{
  opacity:1;transform:translateY(0) scale(1);
  visibility:visible;pointer-events:auto;z-index:2;transition-delay:0s;
}
.slide-inner{width:100%;max-width:1360px;max-height:100%;margin:0 auto;display:flex;flex-direction:column;gap:clamp(14px,2vh,22px);overflow:auto;padding-right:2px;zoom:var(--zoom,1);}
.slide-inner::-webkit-scrollbar{width:6px;height:6px;}
.slide-inner::-webkit-scrollbar-thumb{background:rgba(219,165,72,.3);border-radius:3px;}
.slide-inner::-webkit-scrollbar-track{background:transparent;}

/* chrome */
.chrome-top{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;gap:16px;
  padding:16px clamp(20px,4vw,48px) 0;
  pointer-events:none;
}
.brand{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
.brand b{color:var(--gold);font-weight:600;}
.progress-track{flex:1;height:2px;background:var(--rule);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width .5s var(--ease);}
.section-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis;}
.counter{font-family:var(--font-mono);font-size:11px;color:var(--muted);white-space:nowrap;min-width:52px;text-align:right;}

.chrome-bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(20px,4vw,48px) 20px;
  pointer-events:none;
}
.navbtn{
  pointer-events:auto;
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--rule);background:rgba(20,31,56,.7);backdrop-filter:blur(6px);
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:background .25s ease, border-color .25s ease, transform .2s ease;
}
.navbtn:hover{background:var(--gold-soft);border-color:var(--gold);transform:translateY(-2px);}
.navbtn:active{transform:translateY(0);}
.navbtn svg{width:18px;height:18px;}
.navbtn:disabled{opacity:.25;cursor:default;transform:none;}
.hint{
  pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted2);opacity:1;transition:opacity 1s ease;z-index:19;
}
.hint.hide{opacity:0;}
.notes-toggle{
  pointer-events:auto;background:none;border:1px solid var(--rule);border-radius:999px;
  padding:5px 12px;cursor:pointer;flex-shrink:0;
  font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--muted);transition:border-color .2s ease,color .2s ease;
}
.notes-toggle:hover{border-color:var(--gold);color:var(--gold);}
.home-btn{text-decoration:none;display:inline-flex;align-items:center;}

.zoom-controls{pointer-events:auto;display:flex;align-items:center;flex-shrink:0;}
.zoom-btn{
  background:none;border:1px solid var(--rule);color:var(--muted);cursor:pointer;
  font-family:var(--font-mono);font-size:13px;line-height:1;
  padding:5px 10px;transition:border-color .2s ease,color .2s ease;
}
.zoom-btn:hover{border-color:var(--gold);color:var(--gold);}
.zoom-controls .zoom-btn + .zoom-btn{margin-left:-1px;}
.zoom-controls .zoom-btn:first-child{border-radius:999px 0 0 999px;}
.zoom-controls .zoom-btn:last-child{border-radius:0 999px 999px 0;}
.zoom-reset{min-width:46px;text-align:center;font-size:10px;letter-spacing:.03em;}
.zoom-btn:disabled{opacity:.3;cursor:default;}
.zoom-btn:disabled:hover{border-color:var(--rule);color:var(--muted);}

/* reveal primitives */
.reveal-item{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease);}
.slide.active .reveal-item.in{opacity:1;transform:translateY(0);}

.kicker{font-family:var(--font-mono);font-size:clamp(10.5px,1vw,12.5px);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 6px;}
.kicker::before{content:'';display:inline-block;width:22px;height:1px;background:var(--gold);margin-right:10px;vertical-align:middle;}

/* ================= topic nav (breadcrumb) ================= */
.topic-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:2px;}
.topic-chip{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;color:var(--muted2);padding:4px 10px;border-radius:999px;border:1px solid transparent;white-space:nowrap;}
.topic-chip.done{color:var(--muted);}
.topic-chip.done::before{content:'✓ ';color:var(--teal);}
.topic-chip.active{color:var(--gold);border-color:var(--gold);background:var(--gold-soft);font-weight:600;}
.topic-sep{color:var(--rule);font-size:10px;}

h1.disp{font-family:var(--font-display);font-weight:400;line-height:1.06;margin:0;color:var(--ink);letter-spacing:-.01em;}
.title-hero{font-size:clamp(38px,6.6vw,84px);}
.title-slide{font-size:clamp(25px,3.35vw,42px);}
.title-slide.long{font-size:clamp(21px,2.5vw,32px);}
.subtitle{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:clamp(16px,1.8vw,22px);margin:6px 0 0;}
.meta-badge{display:inline-block;margin-top:22px;padding:7px 16px;border:1px solid var(--rule);border-radius:999px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);}

.lede{font-family:var(--font-display);font-style:italic;color:var(--sand);font-size:clamp(16px,1.6vw,20px);margin:0;}

ul.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;}
ul.bullets li{
  font-size:clamp(14.5px,1.3vw,18px);line-height:1.55;color:var(--ink);
  padding-left:22px;position:relative;
}
ul.bullets li::before{content:'';position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--gold);}
ul.bullets li.q{color:var(--sand);font-style:italic;font-family:var(--font-display);font-size:clamp(16px,1.5vw,21px);}
ul.bullets li.q::before{background:var(--coral);}

.prompt-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;justify-content:center;height:100%;}
.statement-text{font-family:var(--font-display);font-style:italic;color:var(--ink);font-size:clamp(22px,3vw,40px);line-height:1.4;max-width:900px;}

.source{font-family:var(--font-mono);font-size:11.5px;color:var(--muted2);margin-top:4px;word-break:break-word;}
.source::before{content:'Source — ';color:var(--muted);}
.source a{color:var(--blue);text-decoration:none;}
.source a:hover{color:var(--gold);}

/* media / exhibits */
.media-grid{display:grid;gap:20px;align-items:start;}
.media-grid.cols-1{grid-template-columns:1fr;}
.media-grid.cols-2{grid-template-columns:1fr 1fr;}
.media-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.exhibit{position:relative;border-radius:14px;overflow:hidden;}
.exhibit .kb{overflow:hidden;display:block;border-radius:inherit;max-height:46vh;}
.exhibit img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;opacity:0;transform:scale(1.07);transition:opacity .9s var(--ease), transform 1.3s var(--ease);}
.slide.active .exhibit.in img{opacity:1;transform:scale(1);}
.exhibit.frame{background:var(--surface);padding:10px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6);border:1px solid var(--rule);}
.exhibit.frame img{border-radius:6px;}
.exhibit.paper{background:var(--paper);padding:16px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);}
.exhibit.paper img{border-radius:2px;}
.exhibit.solo{max-width:760px;margin:0 auto;}
.exhibit .cap{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.03em;margin-top:10px;padding:0 2px;}
.exhibit .img-overlay-badge{position:absolute;border-radius:4px;box-shadow:0 3px 10px rgba(0,0,0,.4);border:2px solid #fff;object-fit:cover;}
.exhibit.paper .cap{color:#8a7f63;}
.exhibit.frame .cap{color:var(--muted);}
.exhibit.bleed{border-radius:10px;max-width:960px;margin:0 auto;}
.exhibit.bleed .kb, .exhibit.bleed img{max-height:64vh;object-fit:cover;}
.exhibit.bare{background:none;padding:0;box-shadow:none;border:none;}

@keyframes kenburns{ from{transform:scale(1);} to{transform:scale(1.06);} }
.slide.active .kb.kb-anim{animation:kenburns 16s ease-out forwards;}

.two-col{display:grid;grid-template-columns:1.1fr 1fr;gap:clamp(24px,4vw,64px);align-items:center;}
.two-col.reverse{grid-template-columns:1fr 1.1fr;}

@media (prefers-reduced-motion: reduce){
  .slide{transition:opacity .15s linear !important;transform:none !important;}
  .reveal-item{transition:none !important;opacity:1 !important;transform:none !important;}
  .exhibit img{transition:none !important;opacity:1 !important;transform:none !important;}
  .kb.kb-anim{animation:none !important;}
  .bar-fill{transition:none !important;}
  .stat-card{transition:none !important;}
}
.reduced .slide{transition:opacity .15s linear !important;transform:none !important;}
.reduced .reveal-item{transition:none !important;opacity:1 !important;transform:none !important;}
.reduced .exhibit img{transition:none !important;opacity:1 !important;transform:none !important;}
.reduced .kb.kb-anim{animation:none !important;}
.reduced .bar-fill{transition:none !important;}
.reduced .stat-card{transition:none !important;}

/* ================= custom slide types ================= */

/* cover */
.cover-wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(28px,5vw,72px);align-items:center;width:100%;}
.cover-text .meta-badge{margin-top:26px;}
.cover-media{display:flex;gap:12px;align-items:stretch;max-width:100%;}
.cover-hero{flex:1 1 auto;min-width:0;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--rule);box-shadow:0 30px 80px -24px rgba(0,0,0,.65);}
.cover-hero img{display:block;width:100%;height:100%;min-height:100%;max-height:56vh;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1s var(--ease),transform 1.4s var(--ease);}
.slide.active .cover-hero.in img{opacity:1;transform:scale(1);}
@media (max-width:880px){.cover-wrap{grid-template-columns:1fr;}}

/* roadmap (Part I / Part II) */
.roadmap-wrap{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,48px);width:100%;}
.roadmap-col{border-radius:16px;padding:24px 26px;border:1px solid var(--rule);background:var(--surface);transition:opacity .3s ease;}
.roadmap-col.active{border-color:var(--gold);box-shadow:0 24px 60px -24px rgba(219,165,72,.35);}
.roadmap-col:not(.active){opacity:.62;}
.part-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.roadmap-col.active .part-label{color:var(--gold);}
.part-note{font-family:var(--font-display);font-style:italic;color:var(--muted2);font-size:13px;margin-bottom:14px;}
.roadmap-item{padding:14px 0;border-top:1px solid var(--rule);}
.roadmap-item:first-of-type{border-top:none;}
.roadmap-item .ri-num{font-family:var(--font-display);font-size:clamp(16px,1.9vw,21px);color:var(--ink);}
.roadmap-col.active .roadmap-item .ri-num{color:var(--gold);}
.roadmap-item .ri-sub{font-size:13.5px;color:var(--muted);margin-top:2px;}
@media (max-width:880px){.roadmap-wrap{grid-template-columns:1fr;}}

/* bigstats */
.bigstats-wrap{display:flex;flex-direction:column;gap:30px;align-items:center;text-align:center;width:100%;}
.burst-text{font-family:var(--font-display);font-style:italic;color:var(--sand);font-size:clamp(20px,2.7vw,34px);max-width:820px;}
.stat-row{display:flex;gap:clamp(14px,3vw,32px);flex-wrap:wrap;justify-content:center;}
.stat-card{opacity:0;transform:translateY(16px) scale(.92);transition:opacity .6s var(--ease),transform .6s var(--ease);background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:20px 30px;min-width:170px;}
.slide.active .stat-card.in{opacity:1;transform:translateY(0) scale(1);}
.stat-card .sv{font-family:var(--font-display);font-size:clamp(28px,3.6vw,46px);color:var(--gold);line-height:1;}
.stat-card.mystery .sv{color:var(--coral);}
.stat-card .sl{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px;}
.stat-photostrip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;max-width:920px;}
@media (max-width:880px){.stat-photostrip{grid-template-columns:1fr;}}

/* chart (animated bars) */
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,40px);width:100%;}
.chart-block{display:flex;flex-direction:column;gap:11px;}
.chart-caption{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
.bar-row{display:grid;grid-template-columns:minmax(110px,240px) 1fr auto;gap:12px;align-items:center;}
.bar-label{font-size:12.5px;color:var(--ink);text-align:right;line-height:1.3;}
.bar-track{position:relative;height:13px;background:rgba(243,240,232,.08);border-radius:8px;overflow:hidden;}
.bar-fill{position:absolute;left:0;top:0;height:100%;width:0%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--coral));transition:width 1.1s var(--ease);}
.bar-fill.in{width:var(--w);}
.bar-value{font-family:var(--font-mono);font-size:12px;color:var(--gold);min-width:58px;}
.chart-footnote{font-size:10.5px;color:var(--muted2);font-style:italic;margin-top:2px;}
.chart-note{margin:8px auto 0;text-align:center;font-family:var(--font-display);font-size:clamp(16px,2vw,22px);color:var(--ink);border:1px solid var(--gold);border-radius:999px;padding:10px 28px;display:table;}
.exhibit.chart-inset{max-width:170px;margin:0 0 4px auto;}
.exhibit.chart-inset .kb, .exhibit.chart-inset img{max-height:110px;}
@media (max-width:880px){.chart-grid-2{grid-template-columns:1fr;}.bar-row{grid-template-columns:96px 1fr auto;}}

/* media-fact (fill-in-blank / rights deals) */
.factline{font-family:var(--font-display);font-size:clamp(18px,2.3vw,27px);color:var(--ink);line-height:1.5;margin:0;}
.factline .blank{display:inline-block;height:1px;border-bottom:2px dashed var(--gold);margin:0 3px;vertical-align:middle;}
.fact-reveal{font-family:var(--font-display);font-style:italic;color:var(--sand);font-size:clamp(15px,1.6vw,19px);margin:14px 0 0;}
.netgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px;}
.netcell{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;}
.netcell b{color:var(--gold);font-family:var(--font-mono);display:block;font-size:12.5px;letter-spacing:.03em;margin-bottom:4px;}
.netcell span{font-size:12.5px;color:var(--muted);}
.mediafact-wrap{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:start;width:100%;}
.mediafact-body{min-width:0;}
.exhibit.mediafact-img{width:220px;flex-shrink:0;}
.exhibit.mediafact-img .kb, .exhibit.mediafact-img img{max-height:140px;}
.sources-list{margin-top:16px;display:flex;flex-direction:column;gap:5px;}
.sources-list a{font-family:var(--font-mono);font-size:11px;color:var(--muted2);word-break:break-all;text-decoration:none;}
.sources-list a:hover{color:var(--gold);}
@media (max-width:880px){.mediafact-wrap{grid-template-columns:1fr;}}

/* showcase (job placement / logo cloud) */
.showcase-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;}
.exhibit.showcase-hero{max-width:800px;width:100%;}
.showcase-logos{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
.exhibit.showcase-logo{width:80px;}
.exhibit.showcase-logo .kb, .exhibit.showcase-logo img{max-height:80px;}

/* numbered-chart (implications) */
.numchart-wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(24px,4vw,56px);align-items:start;width:100%;}
.numbered-list{display:flex;flex-direction:column;gap:18px;}
.numbered-item{display:flex;gap:14px;align-items:flex-start;}
.numbered-badge{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);font-family:var(--font-mono);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.numbered-body .nh{font-family:var(--font-display);font-size:clamp(15.5px,1.7vw,19px);color:var(--ink);line-height:1.4;}
.numbered-body .ns{font-size:13px;color:var(--muted);margin-top:3px;}
@media (max-width:880px){.numchart-wrap{grid-template-columns:1fr;}}

/* bonus / sources rows (reused for citation slides) */
.bonus-list{display:flex;flex-direction:column;gap:14px;}
.bonus-row{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px 22px;flex-wrap:wrap;}
.bonus-info{display:flex;flex-direction:column;gap:4px;min-width:0;}
.bonus-label{font-family:var(--font-display);font-size:17px;color:var(--ink);}
.bonus-url{font-family:var(--font-mono);font-size:12.5px;color:var(--blue);text-decoration:none;word-break:break-all;}
.bonus-url:hover{color:var(--gold);}
.bonus-points{font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:5px 14px;white-space:nowrap;}

/* prompt */
/* (shared .prompt-wrap / .statement-text above) */

/* closing */
.closing-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;}
.closing-wrap .rule{width:64px;height:1px;background:var(--gold);}

/* notes panel */
.notes-panel{
  position:fixed;top:0;right:0;height:100%;width:min(420px,86vw);
  background:rgba(10,16,30,.97);backdrop-filter:blur(10px);
  border-left:1px solid var(--rule);z-index:15;
  transform:translateX(100%);transition:transform .45s var(--ease);
  padding:80px 28px 28px;display:flex;flex-direction:column;gap:14px;
}
.notes-panel.open{transform:translateX(0);}
.notes-panel h3{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0;}
.notes-panel p{font-family:var(--font-display);font-size:16px;line-height:1.6;color:var(--ink);white-space:pre-wrap;}
.notes-panel .close-notes{position:absolute;top:24px;right:24px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:20px;}
.notes-empty{color:var(--muted2);font-style:italic;font-family:var(--font-display);}

.notes-panel::-webkit-scrollbar{width:8px;}

<script>

(function(){
  const SLIDES = JSON.parse(document.getElementById('slide-data').textContent);
  const deck = document.getElementById('deck');
  const progressFill = document.getElementById('progressFill');
  const counterEl = document.getElementById('counter');
  const sectionLabel = document.getElementById('sectionLabel');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const hint = document.getElementById('hint');
  const notesPanel = document.getElementById('notesPanel');
  const notesBody = document.getElementById('notesBody');
  const notesToggle = document.getElementById('notesToggle');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced) document.documentElement.classList.add('reduced');

  const SECTIONS = [
    {from:0,to:0,label:'Opening'},
    {from:1,to:1,label:'Course Roadmap'},
    {from:2,to:19,label:'(1) Internship — Are You Qualified?'},
    {from:20,to:24,label:'(2) College Athletics — Significant Growth'},
    {from:25,to:25,label:'Closing'}
  ];
  function sectionFor(i){
    for(const s of SECTIONS){ if(i>=s.from && i<=s.to) return s.label; }
    return '';
  }

  function el(tag, cls, html){
    const e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function revealItem(node, delayMs){
    node.classList.add('reveal-item');
    node.style.transitionDelay = (delayMs||0)+'ms';
    return node;
  }
  function isQuestion(text){ return /\?\s*$/.test(text.trim()); }
  function escapeHTML(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function linkify(text){
    const parts = String(text).split(/(https?:\/\/[^\s]+)/g);
    return parts.map(p=>{
      if(/^https?:\/\//.test(p)){
        const clean = p.replace(/[.,;]+$/,'');
        return '<a href="'+clean+'" target="_blank" rel="noopener" style="color:var(--blue);">'+escapeHTML(clean)+'</a>';
      }
      return escapeHTML(p);
    }).join('');
  }
  function renderBlanks(text){
    const esc = escapeHTML(text);
    return esc.replace(/_{3,}/g, function(m){
      const w = Math.min(120, Math.max(40, m.length*7));
      return '<span class="blank" style="width:'+w+'px"></span>';
    });
  }
  function titleEl(text, delay){
    const cls = 'disp title-slide'+(text.length>52?' long':'')+' reveal-item';
    const h = el('h1',cls, escapeHTML(text));
    revealItem(h, delay||0);
    return h;
  }
  function buildKicker(text){ return el('p','kicker reveal-item', escapeHTML(text)); }

  function buildTopicNav(topic){
    const order = [
      {key:'internship', label:'Internship'},
      {key:'college', label:'College Athletics'},
      {key:'sponsorship', label:'Sponsorship'},
      {key:'analytics', label:'Analytics'}
    ];
    const activeIdx = order.findIndex(t => t.key === topic);
    const nav = el('div','topic-nav reveal-item');
    order.forEach((t,i)=>{
      let cls = 'topic-chip';
      if(activeIdx > -1 && i < activeIdx) cls += ' done';
      if(t.key === topic) cls += ' active';
      nav.appendChild(el('span', cls, escapeHTML(t.label)));
      if(i < order.length-1) nav.appendChild(el('span','topic-sep','/'));
    });
    revealItem(nav,0);
    return nav;
  }

  function buildExhibit(img, delay, extraClass){
    const wrap = el('div','exhibit '+(img.frame||'paper')+(extraClass?' '+extraClass:''));
    wrap.style.transitionDelay = (delay||0)+'ms';
    const kb = el('div','kb');
    const im = document.createElement('img');
    im.src = img.src; im.loading='lazy'; im.alt = img.caption || '';
    if(img.w && img.h) im.style.aspectRatio = img.w+' / '+img.h;
    kb.appendChild(im);
    if(img.overlays){
      img.overlays.forEach(ov=>{
        const badge = document.createElement('img');
        badge.className = 'img-overlay-badge';
        badge.src = ov.src; badge.loading='lazy';
        badge.style.left = (ov.rx*100)+'%';
        badge.style.top = (ov.ry*100)+'%';
        badge.style.width = (ov.rw*100)+'%';
        if(ov.w && ov.h) badge.style.aspectRatio = ov.w+'/'+ov.h;
        kb.appendChild(badge);
      });
    }
    wrap.appendChild(kb);
    if(img.caption){ wrap.appendChild(el('div','cap', escapeHTML(img.caption))); }
    return wrap;
  }

  function buildBullets(list){
    const ul = el('ul','bullets');
    list.forEach((t,i)=>{
      const li = el('li', isQuestion(t)?'q':'');
      li.innerHTML = linkify(t);
      revealItem(li, 90*i);
      ul.appendChild(li);
    });
    return ul;
  }
  function buildSource(text){
    const p = el('p','source reveal-item');
    p.innerHTML = linkify(text);
    revealItem(p,0);
    return p;
  }

  function animateNumbers(container){
    const nums = container.querySelectorAll('.num-target[data-target]');
    nums.forEach(n=>{
      const target = parseFloat(n.dataset.target);
      const prefix = n.dataset.prefix || '';
      const suffix = n.dataset.suffix || '';
      const decimals = parseInt(n.dataset.decimals||'0',10);
      if(isNaN(target)) return;
      if(prefersReduced){ n.textContent = prefix+target.toFixed(decimals)+suffix; return; }
      const dur = 1000; const start = performance.now();
      function frame(t){
        const p = Math.max(0,Math.min(1,(t-start)/dur));
        const eased = 1-Math.pow(1-p,3);
        n.textContent = prefix + (target*eased).toFixed(decimals) + suffix;
        if(p<1) requestAnimationFrame(frame); else n.textContent = prefix+target.toFixed(decimals)+suffix;
      }
      requestAnimationFrame(frame);
      setTimeout(()=>{ n.textContent = prefix+target.toFixed(decimals)+suffix; }, dur+100);
    });
  }

  function buildChartBlock(ch, delay){
    const block = el('div','chart-block reveal-item'); revealItem(block, delay||0);
    if(ch.caption) block.appendChild(el('div','chart-caption', escapeHTML(ch.caption)));
    const max = Math.max.apply(null, ch.bars.map(b=>b[1]));
    const fills = [], values = [];
    ch.bars.forEach((b,bi)=>{
      const row = el('div','bar-row');
      row.appendChild(el('div','bar-label', escapeHTML(String(b[0]))));
      const track = el('div','bar-track');
      const fill = el('div','bar-fill');
      fill.style.setProperty('--w', (max? (b[1]/max*100) : 0).toFixed(1)+'%');
      fill.style.transitionDelay = (bi*70)+'ms';
      track.appendChild(fill);
      row.appendChild(track);
      const val = el('span','bar-value num-target');
      val.dataset.target = b[1];
      val.dataset.prefix = ch.prefix||'';
      val.dataset.suffix = ch.suffix||'';
      val.dataset.decimals = ch.decimals||0;
      val.textContent = (ch.prefix||'') + (0).toFixed(ch.decimals||0) + (ch.suffix||'');
      row.appendChild(val);
      block.appendChild(row);
      fills.push(fill); values.push(val);
    });
    if(ch.footnote) block.appendChild(el('div','chart-footnote', escapeHTML(ch.footnote)));
    return {block, fills, values};
  }

  // ---------- slide type builders ----------
  function build(slide, idx){
    const s = el('section','slide');
    s.dataset.index = idx;
    let inner;
    let allFills = [], allValues = [];

    switch(slide.type){

      case 'cover': {
        inner = el('div','slide-inner');
        const wrap = el('div','cover-wrap');
        const textCol = el('div','cover-text');
        if(slide.kicker) textCol.appendChild(buildKicker(slide.kicker));
        const h = el('h1','disp title-hero reveal-item', escapeHTML(slide.title));
        revealItem(h,120); textCol.appendChild(h);
        if(slide.subtitle){ const sub = el('p','subtitle reveal-item', escapeHTML(slide.subtitle)); revealItem(sub,260); textCol.appendChild(sub); }
        wrap.appendChild(textCol);
        const mediaCol = el('div','cover-media');
        const hero = buildExhibit(slide.hero, 120, 'cover-hero');
        mediaCol.appendChild(hero);
        wrap.appendChild(mediaCol);
        inner.appendChild(wrap);
        break;
      }

      case 'roadmap': {
        inner = el('div','slide-inner');
        inner.appendChild(titleEl(slide.title,80));
        const wrap = el('div','roadmap-wrap');
        [slide.partI, slide.partII].forEach((part,pi)=>{
          const col = el('div','roadmap-col'+(part.active?' active':'')+' reveal-item'); revealItem(col, 220+pi*160);
          col.appendChild(el('div','part-label', escapeHTML(part.label)));
          part.items.forEach(pair=>{
            const item = el('div','roadmap-item');
            item.appendChild(el('div','ri-num', escapeHTML(pair[0])));
            if(pair[1]) item.appendChild(el('div','ri-sub', escapeHTML(pair[1])));
            col.appendChild(item);
          });
          wrap.appendChild(col);
        });
        inner.appendChild(wrap);
        break;
      }

      case 'bigstats': {
        inner = el('div','slide-inner bigstats-wrap');
        if(slide.title) inner.appendChild(titleEl(slide.title,40));
        if(slide.burst){ const b = el('p','burst-text reveal-item', escapeHTML(slide.burst)); revealItem(b,100); inner.appendChild(b); }
        const row = el('div','stat-row');
        const cards = [];
        slide.stats.forEach((st,i)=>{
          const card = el('div','stat-card'+(st.value==='???'?' mystery':'')); card.style.transitionDelay=(240+i*140)+'ms';
          card.appendChild(el('div','sv', escapeHTML(st.value)));
          card.appendChild(el('div','sl', escapeHTML(st.label)));
          row.appendChild(card);
          cards.push(card);
        });
        inner.appendChild(row);
        s._statCards = cards;
        if(slide.images && slide.images.length){
          const strip = el('div','stat-photostrip');
          slide.images.forEach((im,i)=> strip.appendChild(buildExhibit(im, 520+i*140)));
          inner.appendChild(strip);
        }
        break;
      }

      case 'chart': {
        inner = el('div','slide-inner');
        if(slide.title) inner.appendChild(titleEl(slide.title,50));
        if(slide.lede){ const l = el('p','lede reveal-item', escapeHTML(slide.lede)); revealItem(l,140); inner.appendChild(l); }
        if(slide.image){ inner.appendChild(buildExhibit(slide.image, 80, 'chart-inset')); }
        const wrap = el('div', slide.charts.length>1 ? 'chart-grid-2' : '');
        slide.charts.forEach((ch,ci)=>{
          const built = buildChartBlock(ch, 200+ci*160);
          wrap.appendChild(built.block);
          allFills = allFills.concat(built.fills);
          allValues = allValues.concat(built.values);
        });
        inner.appendChild(wrap);
        s._barFills = allFills; s._barValues = allValues;
        if(slide.note){ const n = el('div','chart-note reveal-item', escapeHTML(slide.note)); revealItem(n,520); inner.appendChild(n); }
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }

      case 'media-fact': {
        inner = el('div','slide-inner');
        if(slide.title) inner.appendChild(titleEl(slide.title,40));
        const wrap = el('div','mediafact-wrap');
        const body = el('div','mediafact-body');
        const headline = el('p','factline reveal-item'); revealItem(headline,120);
        headline.innerHTML = renderBlanks(slide.headline);
        body.appendChild(headline);
        if(slide.reveal){ const r = el('p','fact-reveal reveal-item', escapeHTML(slide.reveal)); revealItem(r,280); body.appendChild(r); }
        if(slide.grid){
          const grid = el('div','netgrid');
          slide.grid.forEach((pair,i)=>{
            const cell = el('div','netcell reveal-item'); revealItem(cell,380+i*100);
            cell.appendChild(el('b','',escapeHTML(pair[0])));
            cell.appendChild(el('span','',escapeHTML(pair[1])));
            grid.appendChild(cell);
          });
          body.appendChild(grid);
        }
        if(slide.sources && slide.sources.length){
          const sl = el('div','sources-list reveal-item'); revealItem(sl,520);
          slide.sources.forEach(u=>{
            const a = document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener'; a.textContent=u;
            sl.appendChild(a);
          });
          body.appendChild(sl);
        }
        wrap.appendChild(body);
        if(slide.image){ wrap.appendChild(buildExhibit(slide.image, 220, 'mediafact-img')); }
        inner.appendChild(wrap);
        break;
      }

      case 'prompt': {
        inner = el('div','slide-inner prompt-wrap');
        if(slide.title){ inner.appendChild(titleEl(slide.title,60)); }
        if(slide.statement){ const p = el('p','statement-text reveal-item', escapeHTML(slide.statement)); revealItem(p,120); inner.appendChild(p); }
        break;
      }

      case 'media': {
        inner = el('div','slide-inner');
        if(slide.title){ inner.appendChild(titleEl(slide.title,50)); }
        if(slide.lede){ const l = el('p','lede reveal-item', escapeHTML(slide.lede)); revealItem(l,140); inner.appendChild(l); }
        if(slide.bullets) inner.appendChild(buildBullets(slide.bullets));
        if(slide.images && slide.images.length){
          const colsClass = slide.cols ? ('cols-'+slide.cols) : (slide.images.length>1?'cols-2':'cols-1');
          const grid = el('div','media-grid '+colsClass);
          slide.images.forEach((im,i)=> grid.appendChild(buildExhibit(im, 200+i*160)));
          inner.appendChild(grid);
        }
        if(slide.note){ const n = el('div','chart-note reveal-item', escapeHTML(slide.note)); revealItem(n,440); inner.appendChild(n); }
        if(slide.source) inner.appendChild(buildSource(slide.source));
        break;
      }

      case 'stat-list': {
        inner = el('div','slide-inner');
        if(slide.title) inner.appendChild(titleEl(slide.title,60));
        if(slide.lede){ const l = el('p','lede reveal-item', escapeHTML(slide.lede)); revealItem(l,140); inner.appendChild(l); }
        if(slide.bullets) inner.appendChild(buildBullets(slide.bullets));
        break;
      }

      case 'bonus': {
        inner = el('div','slide-inner');
        if(slide.title) inner.appendChild(titleEl(slide.title,50));
        if(slide.lede){ const l = el('p','lede reveal-item', escapeHTML(slide.lede)); revealItem(l,150); inner.appendChild(l); }
        const list = el('div','bonus-list');
        slide.links.forEach((lnk,i)=>{
          const row = el('div','bonus-row reveal-item'); revealItem(row,240+i*140);
          const info = el('div','bonus-info');
          info.appendChild(el('div','bonus-label', escapeHTML(lnk.label)));
          const a = document.createElement('a'); a.className='bonus-url'; a.href=lnk.url; a.target='_blank'; a.rel='noopener'; a.textContent=lnk.url;
          info.appendChild(a);
          row.appendChild(info);
          if(lnk.points) row.appendChild(el('div','bonus-points', escapeHTML(lnk.points)));
          list.appendChild(row);
        });
        inner.appendChild(list);
        break;
      }

      case 'showcase': {
        inner = el('div','slide-inner showcase-wrap');
        if(slide.title) inner.appendChild(titleEl(slide.title,50));
        inner.appendChild(buildExhibit(slide.image, 160, 'showcase-hero'));
        if(slide.logos && slide.logos.length){
          const row = el('div','showcase-logos');
          slide.logos.forEach((lg,i)=> row.appendChild(buildExhibit(lg, 400+i*120, 'showcase-logo')));
          inner.appendChild(row);
        }
        break;
      }

      case 'numbered-chart': {
        inner = el('div','slide-inner');
        inner.appendChild(titleEl(slide.title,50));
        const wrap = el('div','numchart-wrap');
        const list = el('div','numbered-list');
        slide.items.forEach((it,i)=>{
          const row = el('div','numbered-item reveal-item'); revealItem(row,180+i*130);
          row.appendChild(el('div','numbered-badge', String(i+1)));
          const body = el('div','numbered-body');
          body.appendChild(el('div','nh', escapeHTML(it.head)));
          if(it.sub) body.appendChild(el('div','ns', escapeHTML(it.sub)));
          row.appendChild(body);
          list.appendChild(row);
        });
        wrap.appendChild(list);
        const built = buildChartBlock(slide.chart, 300);
        wrap.appendChild(built.block);
        allFills = built.fills; allValues = built.values;
        inner.appendChild(wrap);
        s._barFills = allFills; s._barValues = allValues;
        break;
      }

      case 'closing': {
        inner = el('div','slide-inner closing-wrap');
        const rule = el('div','rule reveal-item'); revealItem(rule,40);
        const h = el('h1','disp title-hero reveal-item', escapeHTML(slide.title));
        revealItem(h,80);
        const rule2 = el('div','rule reveal-item'); revealItem(rule2,340);
        inner.appendChild(rule);
        inner.appendChild(h);
        inner.appendChild(rule2);
        break;
      }

      default: inner = el('div','slide-inner');
    }
    if(slide.topic) inner.insertBefore(buildTopicNav(slide.topic), inner.firstChild);
    s.appendChild(inner);
    return s;
  }

  const slideEls = SLIDES.map((s,i)=> build(s,i));
  slideEls.forEach(e=> deck.appendChild(e));

  let current = -1;
  let notesOpen = false;

  function activate(idx){
    current = idx;
    slideEls.forEach((e,i)=>{
      if(i===idx){
        e.classList.add('active');
      } else {
        e.classList.remove('active');
        e.querySelectorAll('.reveal-item').forEach(r=> r.classList.remove('in'));
        e.querySelectorAll('.exhibit').forEach(x=> x.classList.remove('in'));
        e.querySelectorAll('.kb').forEach(k=> k.classList.remove('kb-anim'));
        if(e._statCards){ e._statCards.forEach(c=> c.classList.remove('in')); }
        if(e._barFills){ e._barFills.forEach(f=> f.classList.remove('in')); }
        if(e._barValues){ e._barValues.forEach(v=>{
          const prefix=v.dataset.prefix||'', suffix=v.dataset.suffix||'', dec=parseInt(v.dataset.decimals||'0',10);
          v.textContent = prefix+(0).toFixed(dec)+suffix;
        }); }
      }
    });
    const activeEl = slideEls[idx];
    requestAnimationFrame(()=>{
      activeEl.querySelectorAll('.reveal-item').forEach(r=> r.classList.add('in'));
      activeEl.querySelectorAll('.exhibit').forEach(x=> x.classList.add('in'));
      activeEl.querySelectorAll('.kb').forEach(k=> k.classList.add('kb-anim'));
      if(activeEl._statCards){ activeEl._statCards.forEach(c=> c.classList.add('in')); }
      if(activeEl._barFills){ activeEl._barFills.forEach(f=> f.classList.add('in')); }
      animateNumbers(activeEl);
    });

    progressFill.style.width = ((idx)/(SLIDES.length-1)*100).toFixed(2)+'%';
    counterEl.textContent = String(idx+1).padStart(2,'0')+' / '+SLIDES.length;
    sectionLabel.textContent = sectionFor(idx);
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===SLIDES.length-1;

    const notesText = SLIDES[idx].notes;
    if(notesText){
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p></p>';
      notesBody.querySelector('p').textContent = notesText;
      notesToggle.style.opacity = 1;
    } else {
      notesBody.innerHTML = '<h3>Speaker Notes</h3><p class="notes-empty">No speaker notes for this slide.</p>';
      notesToggle.style.opacity = .45;
    }

    location.hash = 's'+(idx+1);
  }

  function next(){ if(current < SLIDES.length-1) activate(current+1); hideHint(); }
  function prev(){ if(current > 0) activate(current-1); hideHint(); }

  let hintHidden = false;
  function hideHint(){ if(!hintHidden){ hint.classList.add('hide'); hintHidden = true; } }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);

  deck.addEventListener('click', (e)=>{
    if(e.target.closest('a')) return;
    next();
  });

  let wheelLock = false;
  deck.addEventListener('wheel', (e)=>{
    if(wheelLock) return;
    if(Math.abs(e.deltaY) < 12) return;
    wheelLock = true;
    if(e.deltaY > 0) next(); else prev();
    setTimeout(()=>{ wheelLock = false; }, 650);
  }, {passive:true});

  window.addEventListener('keydown', (e)=>{
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); activate(0); }
    else if(e.key==='End'){ e.preventDefault(); activate(SLIDES.length-1); }
    else if(e.key==='n' || e.key==='N'){ toggleNotes(); }
    else if(e.key==='Escape'){ if(notesOpen) toggleNotes(); }
    else if(e.key==='+' || e.key==='='){ e.preventDefault(); zoomIn(); }
    else if(e.key==='-' || e.key==='_'){ e.preventDefault(); zoomOut(); }
    else if(e.key==='0'){ e.preventDefault(); zoomReset(); }
  });

  const ZOOM_MIN = 0.75, ZOOM_MAX = 2, ZOOM_STEP = 0.1;
  let zoomLevel = 1;
  try{
    const saved = parseFloat(localStorage.getItem('spm261_trends1_zoom'));
    if(!isNaN(saved) && saved>=ZOOM_MIN && saved<=ZOOM_MAX) zoomLevel = saved;
  }catch(err){}
  function applyZoom(){
    document.documentElement.style.setProperty('--zoom', zoomLevel.toFixed(2));
    zoomResetBtn.textContent = Math.round(zoomLevel*100)+'%';
    zoomOutBtn.disabled = zoomLevel<=ZOOM_MIN;
    zoomInBtn.disabled = zoomLevel>=ZOOM_MAX;
    try{ localStorage.setItem('spm261_trends1_zoom', zoomLevel); }catch(err){}
  }
  function zoomIn(){ zoomLevel = Math.min(ZOOM_MAX, +(zoomLevel+ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomOut(){ zoomLevel = Math.max(ZOOM_MIN, +(zoomLevel-ZOOM_STEP).toFixed(2)); applyZoom(); }
  function zoomReset(){ zoomLevel = 1; applyZoom(); }
  zoomInBtn.addEventListener('click', (e)=>{ e.stopPropagation(); zoomIn(); });
  zoomOutBtn.addEventListener('click', (e)=>{ e.stopPropagation(); zoomOut(); });
  zoomResetBtn.addEventListener('click', (e)=>{ e.stopPropagation(); zoomReset(); });
  applyZoom();

  function toggleNotes(){
    notesOpen = !notesOpen;
    notesPanel.classList.toggle('open', notesOpen);
  }
  notesToggle.addEventListener('click', (e)=>{ e.stopPropagation(); toggleNotes(); });
  document.getElementById('closeNotes').addEventListener('click', (e)=>{ e.stopPropagation(); toggleNotes(); });

  setTimeout(hideHint, 5000);

  let startIdx = 0;
  const m = location.hash.match(/s(\d+)/);
  if(m){ const n = parseInt(m[1],10)-1; if(n>=0 && n<SLIDES.length) startIdx = n; }
  activate(startIdx);
})();

</script>
</body>
</html>
